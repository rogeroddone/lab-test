<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://use.typekit.net/srq1kya.css"/>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #0a0a0a;
  color: #eee;
  font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
  overflow: hidden;
  height: 100vh;
  width: 100vw;
  display: flex;
  flex-direction: column;
}

/* ── Overlay UI (always visible) ─────────────────────────────────────────── */
#overlay {
  position: absolute;
  top: 0; left: 0; right: 0;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 20px 24px;
  pointer-events: none;
  z-index: 20;
}

/* Expanded invisible hit area so the field is easy to land on */
#inputWrap {
  position: relative;
  pointer-events: all;
  padding: 12px 20px;
  margin: -12px -20px;
  cursor: text;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

/* Particle field living inside the pill outline */
#pillCanvas {
  position: absolute;
  pointer-events: none;
  z-index: 0;
}

/* Contenteditable sitting inside the pill */
#textInput {
  pointer-events: all;
  background: transparent;              /* particles live behind the text */
  border: 1px solid transparent;        /* ring is drawn by particles now */
  border-radius: 999px;
  position: relative;
  z-index: 1;
  padding: 7px 16px;
  color: #ffffff;
  font-size: 13px;
  font-family: 'neue-haas-grotesk-text', 'Helvetica Neue', Helvetica, Arial, sans-serif;
  font-weight: 400;
  line-height: 1.5;
  outline: none;
  width: calc(15ch + 32px);
  min-height: calc(1 * 13px * 1.5 + 14px);
  max-height: calc(5 * 13px * 1.5 + 14px);
  overflow: hidden;
  word-break: break-all;
  white-space: pre-wrap;
  caret-color: #ffffff;
  text-align: center;
  transition: background 0.25s ease, border-color 0.25s ease, filter 0.25s ease;
}
#textInput.light-bg {
  color: #111111;
  caret-color: #111111;
}

/* Pill brightens on approach */
#inputWrap:hover #textInput { filter: brightness(1.15); }

/* Ghost placeholder, clears on first keystroke */
#textInput.is-empty::before {
  content: var(--ph, 'try');
  opacity: 0.4;
  pointer-events: none;
  transition: opacity 0.35s ease;
}
#textInput.is-empty.ph-out::before { opacity: 0; }

/* Faux caret: blinks even when the field is not focused */
#textInput::after {
  content: '';
  display: inline-block;
  width: 1px;
  height: 1em;
  background: currentColor;
  vertical-align: -0.16em;
  margin-left: 1px;
  animation: caretBlink 1.1s step-end infinite;
}
#textInput:focus::after { display: none; }

@keyframes caretBlink {
  0%, 49%   { opacity: 1; }
  50%, 100% { opacity: 0; }
}

/* ── Actions: appear only once something has been typed ─────────────────── */
#actions {
  position: absolute;
  bottom: 48px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 14px;
  z-index: 20;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
}
#actions.on { opacity: 1; pointer-events: all; }

.action {
  font-family: inherit;
  font-size: 8px;
  letter-spacing: 0.04em;
  text-transform: lowercase;
  color: rgba(255,255,255,0.35);
  background: none;
  border: none;
  padding: 0;
  cursor: pointer;
  transition: color 0.15s;
}
.action:hover { color: rgba(255,255,255,0.9); }
.action-sep {
  width: 0.5px;
  height: 8px;
  background: rgba(255,255,255,0.15);
}
body.light-theme .action { color: rgba(0,0,0,0.4); }
body.light-theme .action:hover { color: rgba(0,0,0,0.9); }
body.light-theme .action-sep { background: rgba(0,0,0,0.2); }

/* ── Theme dots, bottom center ───────────────────────────────────────────── */
#themes {
  position: absolute;
  bottom: 22px;
  left: 50%;
  transform: translateX(-50%);
  pointer-events: all;
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: 7.2px;
  z-index: 20;
}

/* Invisible hit rectangle wrapping each group of 4 dots */
.theme-group {
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: 3.6px;
  cursor: pointer;
  padding: 4px 2px;      /* expands the clickable/hoverable area */
  opacity: 0.3;           /* unselected: 50% - 20% = 30% */
  transition: opacity 0.15s;
}
.theme-group:hover   { opacity: 0.6; }
.theme-group.active  { opacity: 1; }

.tdot {
  width: 7.49px;
  height: 7.49px;
  border-radius: 50%;
  border: 0.5px solid rgba(255,255,255,0.15);
  flex-shrink: 0;
  pointer-events: none;  /* clicks pass through to the group */
}

/* ── Controls panel (hidden by default, press C) ─────────────────────────── */
#controls {
  position: absolute;
  top: 50%; left: 24px;
  transform: translateY(-50%);
  background: none;
  border: none;
  padding: 0;
  z-index: 21;
  display: none;
}
#controls.visible {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 7px;
}

.ctrl {
  display: flex;
  align-items: center;
  gap: 8px;
  height: 12px;
}
.ctrl label {
  font-size: 8px;
  color: rgba(255,255,255,0.35);
  white-space: nowrap;
  text-transform: lowercase;
  letter-spacing: 0.04em;
  width: 46px;
  flex-shrink: 0;
}

/* Hairline track, small dot thumb */
.ctrl input[type=range] {
  -webkit-appearance: none;
  appearance: none;
  width: 84px;
  height: 12px;
  background: none;
  cursor: pointer;
  flex-shrink: 0;
}
.ctrl input[type=range]::-webkit-slider-runnable-track {
  height: 1px;
  background: rgba(255,255,255,0.2);
}
.ctrl input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 5px; height: 5px;
  margin-top: -2px;
  border-radius: 50%;
  background: rgba(255,255,255,0.9);
}
.ctrl input[type=range]::-moz-range-track {
  height: 1px;
  background: rgba(255,255,255,0.2);
  border: none;
}
.ctrl input[type=range]::-moz-range-thumb {
  width: 5px; height: 5px;
  border: none;
  border-radius: 50%;
  background: rgba(255,255,255,0.9);
}

/* Value only surfaces on hover */
.ctrl .val {
  font-size: 8px;
  color: rgba(255,255,255,0.5);
  width: 26px;
  opacity: 0;
  transition: opacity 0.15s;
}
.ctrl:hover .val { opacity: 1; }

/* Color inputs as small dots */
.ctrl input[type=color] {
  width: 10px; height: 10px;
  border: 0.5px solid rgba(255,255,255,0.2);
  border-radius: 50%;
  cursor: pointer; padding: 0; background: none;
  flex-shrink: 0;
}
.ctrl input[type=color]::-webkit-color-swatch-wrapper { padding: 0; }
.ctrl input[type=color]::-webkit-color-swatch { border: none; border-radius: 50%; }
.ctrl input[type=color]::-moz-color-swatch { border: none; border-radius: 50%; }

.ctrl-hint {
  font-size: 8px;
  color: rgba(255,255,255,0.2);
  text-transform: lowercase;
  letter-spacing: 0.04em;
}
.ctrl-toggle {
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  height: 12px;
}
.ctrl-toggle label {
  font-size: 8px;
  color: rgba(255,255,255,0.35);
  text-transform: lowercase;
  letter-spacing: 0.04em;
  cursor: pointer;
  width: 46px;
  flex-shrink: 0;
}

/* Toggles as a single small dot */
.toggle-btn {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: none;
  border: 0.5px solid rgba(255,255,255,0.35);
  position: relative;
  cursor: pointer;
  transition: background 0.2s, border-color 0.2s;
  flex-shrink: 0;
  margin-left: 2px;
}
.toggle-btn.on { background: rgba(255,255,255,0.9); border-color: rgba(255,255,255,0.9); }
.toggle-btn::after { display: none; }

.ctrl-separator {
  width: 24px;
  height: 0.5px;
  background: rgba(255,255,255,0.12);
  margin: 3px 0;
}

/* Color row and label group stack inside the rail */
.ctrl-group { display: flex; flex-direction: column; gap: 7px; }
.ctrl-row { display: flex; align-items: center; gap: 6px; height: 12px; }
#labelControls { flex-direction: column; align-items: flex-start; }

#canvas {
  flex: 1;
  display: block;
  cursor: default;
  width: 100%;
  height: 100%;
}

/* Hide the canvas crosshair cursor — parent portfolio provides the cursor */
.notype-hide-cursor * { cursor: none !important; }
</style>
</head>
<body>

<!-- Always-visible overlay: text input + particle color dots -->
<div id="overlay">
  <div id="inputWrap">
    <canvas id="pillCanvas"></canvas>
    <div id="textInput" contenteditable="true" spellcheck="false" class="is-empty"></div>
  </div>
</div>

<!-- Actions, revealed once the field has content -->
<div id="actions">
  <button class="action" id="copyBtn" onclick="copyLink(event)">copy link</button>
  <div class="action-sep"></div>
  <button class="action" id="pngBtn" onclick="downloadPNG(event)">png</button>
</div>

<!-- Particle color dots, bottom center -->
<div id="themes"></div>

<!-- Developer controls (Alt + C) -->
<div id="controls">
  <div class="ctrl">
    <label>Particles</label>
    <input type="range" id="partSlider" min="50" max="50000" value="5000" step="10" oninput="onControl()">
    <span class="val" id="partVal">5000</span>
  </div>
  <div class="ctrl">
    <label>Tracking</label>
    <input type="range" id="trackSlider" min="-200" max="100" value="-54" oninput="onControl()">
    <span class="val" id="trackVal">-54</span>
  </div>
  <div class="ctrl">
    <label>Leading</label>
    <input type="range" id="leadSlider" min="-200" max="100" value="-54" oninput="onControl()">
    <span class="val" id="leadVal">-54</span>
  </div>
  <div class="ctrl">
    <label>Speed</label>
    <input type="range" id="speedSlider" min="0" max="100" value="58" oninput="onControl()">
    <span class="val" id="speedVal">58</span>
  </div>
  <div class="ctrl">
    <label>speed 3/4</label>
    <input type="range" id="speed2Slider" min="0" max="100" value="28" oninput="onControl()">
    <span class="val" id="speed2Val">28</span>
  </div>
  <div class="ctrl">
    <label>Radius</label>
    <input type="range" id="radiusSlider" min="1" max="8" value="1" oninput="onControl()">
    <span class="val" id="radiusVal">1</span>
  </div>
  <div class="ctrl">
    <label>softness</label>
    <input type="range" id="softSlider" min="0" max="12" value="0" step="0.5" oninput="onControl()">
    <span class="val" id="softVal">0</span>
  </div>
  <div class="ctrl">
    <label>Spacing</label>
    <input type="range" id="spacingSlider" min="0" max="5" value="1" step="0.1" oninput="onControl()">
    <span class="val" id="spacingVal">1</span>
  </div>
  <!-- Container. Its own handler, not onControl(): these two feed the auto-fit
       rather than override it, so the chain is computeAutoSize() then rebuild().
       onControl() deliberately skips the fit, because touching Tracking,
       Leading or Particles is a manual override the fit would overwrite. -->
  <div class="ctrl">
    <label>cont w</label>
    <input type="range" id="contWSlider" min="10" max="5000" value="90" step="1" oninput="onContainer()">
    <span class="val" id="contWVal">90</span>
  </div>
  <div class="ctrl">
    <label>cont h</label>
    <input type="range" id="contHSlider" min="10" max="5000" value="70" step="1" oninput="onContainer()">
    <span class="val" id="contHVal">70</span>
  </div>
  <!-- Pan. Layout only, so it rides onControl(): it does not feed the fit and
       has nothing to recompute. -->
  <div class="ctrl">
    <label>off x</label>
    <input type="range" id="offXSlider" min="-300" max="300" value="0" step="1" oninput="onControl()">
    <span class="val" id="offXVal">0</span>
  </div>
  <div class="ctrl">
    <label>off y</label>
    <input type="range" id="offYSlider" min="-300" max="300" value="0" step="1" oninput="onControl()">
    <span class="val" id="offYVal">0</span>
  </div>
  <div class="ctrl-separator"></div>
  <!-- Per-theme color editors: shown for active theme -->
  <div class="ctrl-group">
    <div class="ctrl-row">
      <label style="font-size:8px;color:rgba(255,255,255,0.35);text-transform:lowercase;letter-spacing:0.04em;width:46px;" id="themeEditLabel">theme 1</label>
      <div class="ctrl"><input type="color" id="tc_bg" oninput="onThemeColor()" title="Background"></div>
      <div class="ctrl"><input type="color" id="tc_glyph" oninput="onThemeColor()" title="Glyph"></div>
      <div class="ctrl"><input type="color" id="tc_pt" oninput="onThemeColor()" title="P1"></div>
      <div class="ctrl"><input type="color" id="tc_fill" oninput="onThemeColor()" title="P2"></div>
      <div class="ctrl"><input type="color" id="tc_tert" oninput="onThemeColor()" title="P3"></div>
      <div class="ctrl"><input type="color" id="tc_quat" oninput="onThemeColor()" title="P4"></div>
    </div>
    <div class="ctrl">
      <label>glyph op</label>
      <input type="range" id="tc_glyphOpacity" min="0" max="100" value="100" step="1" oninput="onThemeColor()">
      <span class="val" id="tc_glyphOpacityVal">100%</span>
    </div>
  </div>
  <div class="ctrl-separator"></div>
  <!-- Float mode: layers 2+4 cursor-blind -->
  <div class="ctrl-toggle" onclick="toggleFloat()">
    <label>float 2+4</label>
    <div class="toggle-btn" id="floatBtn"></div>
  </div>
  <!-- Debug char label toggle -->
  <div class="ctrl-toggle" onclick="toggleLabel()">
    <label>char labels</label>
    <div class="toggle-btn" id="labelBtn"></div>
  </div>
  <div id="labelControls" style="display:none;gap:7px;">
    <div class="ctrl">
      <label>label size</label>
      <input type="range" id="labelSize" min="6" max="48" value="14" oninput="onControl()">
      <span class="val" id="labelSizeVal">14</span>
    </div>
    <div class="ctrl">
      <label>label color</label>
      <input type="color" id="labelColor" value="#ffffff" oninput="onControl()">
    </div>
  </div>
  <span class="ctrl-hint">⌥c</span>
</div>

<canvas id="canvas"></canvas>

  THEMES.forEach((t, ti) => {
    const g = document.createElement('div');
    g.className = 'theme-group' + (ti === currentTheme ? ' active' : '');
    g.onclick = () => { applyTheme(ti); syncHash(); };
    [t.tert, t.quat].forEach(col => {
      const d = document.createElement('div');
      d.className = 'tdot';
      d.style.background = col;
      g.appendChild(d);
    });
    container.appendChild(g);
  });
}

// ─── Theme transition: eased color crossfade instead of a hard swap ──────────
const THEME_FADE_MS = 700;
let themeTweenId = null;

function lerpHex(a, b, t) {
  const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
  const r = Math.round(((pa >> 16) & 255) + ((((pb >> 16) & 255) - ((pa >> 16) & 255)) * t));
  const g = Math.round(((pa >> 8)  & 255) + ((((pb >> 8)  & 255) - ((pa >> 8)  & 255)) * t));
  const bl = Math.round((pa & 255) + (((pb & 255) - (pa & 255)) * t));
  return '#' + ((1 << 24) | (r << 16) | (g << 8) | bl).toString(16).slice(1);
}

function applyTheme(idx, instant = false) {
  currentTheme = idx;
  const t = THEMES[idx];
  // UI reflects the destination immediately; only the canvas colors fade.
  buildThemeDots();
  syncThemeEditors();
  if (themeTweenId) { cancelAnimationFrame(themeTweenId); themeTweenId = null; }

  const setAll = () => {
    bgColor = t.bg; ptColor = t.pt; fillCol = t.fill; tertCol = t.tert; quatCol = t.quat;
    glyphColor = t.glyph; glyphOpacity = t.glyphOpacity;
    document.body.style.background = bgColor;
    buildTintedGlyphs();
    updateInputContrast();
  };
  if (instant) { setAll(); return; }

  const from = { bg: bgColor, pt: ptColor, fill: fillCol, tert: tertCol, quat: quatCol, glyph: glyphColor, gop: glyphOpacity };
  const start = performance.now();
  function step(now) {
    const k = Math.min(1, (now - start) / THEME_FADE_MS);
    const e = k < 0.5 ? 2*k*k : 1 - Math.pow(-2*k + 2, 2) / 2; // easeInOutQuad
    bgColor    = lerpHex(from.bg,    t.bg,    e);
    ptColor    = lerpHex(from.pt,    t.pt,    e);
    fillCol    = lerpHex(from.fill,  t.fill,  e);
    tertCol    = lerpHex(from.tert,  t.tert,  e);
    quatCol    = lerpHex(from.quat,  t.quat,  e);
    glyphColor = lerpHex(from.glyph, t.glyph, e);
    glyphOpacity = from.gop + (t.glyphOpacity - from.gop) * e;
    document.body.style.background = bgColor;
    buildTintedGlyphs();
    if (k < 1) {
      themeTweenId = requestAnimationFrame(step);
    } else {
      themeTweenId = null;
      setAll(); // snap exactly to target values
    }
  }
  themeTweenId = requestAnimationFrame(step);
}


// ─── Input contrast: always readable regardless of bg ─────────────────────────
function hexToRgb(hex) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return [r,g,b];
}
function relativeLuminance([r,g,b]) {
  const c = [r,g,b].map(v => {
    v /= 255;
    return v <= 0.03928 ? v/12.92 : Math.pow((v+0.055)/1.055, 2.4);
  });
  return 0.2126*c[0] + 0.7152*c[1] + 0.0722*c[2];
}
function updateInputContrast() {
  const el = document.getElementById('textInput');

  // Fill and stroke are both transparent: the pill outline is particle drawn.
  el.style.background  = 'transparent';
  el.style.borderColor = 'transparent';

  // Text contrast reads against the fill, which is now the background.
  const pillLum = relativeLuminance(hexToRgb(bgColor));
  if (pillLum > 0.4) {
    el.style.color      = '#111111';
    el.style.caretColor = '#111111';
    el.classList.add('light-bg');
    el.classList.remove('dark-bg');
  } else {
    el.style.color      = '#ffffff';
    el.style.caretColor = '#ffffff';
    el.classList.add('dark-bg');
    el.classList.remove('light-bg');
  }

  // Page chrome still follows the canvas background.
  const bgLum = relativeLuminance(hexToRgb(bgColor));
  document.body.classList.toggle('light-theme', bgLum > 0.4);
}

function syncThemeEditors() {
  const t = THEMES[currentTheme];
  document.getElementById('tc_bg').value    = t.bg;
  document.getElementById('tc_glyph').value = t.glyph;
  const opPct = Math.round(t.glyphOpacity * 100);
  document.getElementById('tc_glyphOpacity').value   = opPct;
  document.getElementById('tc_glyphOpacityVal').textContent = opPct + '%';
  document.getElementById('tc_pt').value    = t.pt;
  document.getElementById('tc_fill').value  = t.fill;
  document.getElementById('tc_tert').value  = t.tert;
  document.getElementById('tc_quat').value  = t.quat;
  document.getElementById('themeEditLabel').textContent = 'theme ' + (currentTheme + 1);
}

function onThemeColor() {
  const t = THEMES[currentTheme];
  t.bg           = document.getElementById('tc_bg').value;
  t.glyph        = document.getElementById('tc_glyph').value;
  t.glyphOpacity = +document.getElementById('tc_glyphOpacity').value / 100;
  document.getElementById('tc_glyphOpacityVal').textContent = document.getElementById('tc_glyphOpacity').value + '%';
  t.pt    = document.getElementById('tc_pt').value;

}

// ─── Type anywhere: any printable key lands in the field ──────────────────
function caretToEnd(el) {
  const range = document.createRange();
  const sel = window.getSelection();
  range.selectNodeContents(el);
  range.collapse(false);
  sel.removeAllRanges();
  sel.addRange(range);
}

document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const el = document.getElementById('textInput');
  const active = document.activeElement;
  if (active === el) return;
  // Do not hijack the dev sliders and color pickers
  if (active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA')) return;

  if (e.key.length === 1) {
    e.preventDefault();
    el.focus();
    caretToEnd(el);
    document.execCommand('insertText', false, e.key);
  } else if (e.key === 'Backspace') {
    e.preventDefault();
    el.focus();
    caretToEnd(el);
    document.execCommand('delete', false, null);
  } else if (e.key === 'Enter') {
    e.preventDefault();
    el.focus();
    caretToEnd(el);
  }
});

// Escape releases the field so the canvas regains focus
document.getElementById('textInput').addEventListener('keydown', e => {
  if (e.key === 'Escape') { e.preventDefault(); document.getElementById('textInput').blur(); }
});

// Clicking anywhere in the padded wrapper focuses the field
document.getElementById('inputWrap').addEventListener('mousedown', e => {
  if (e.target.id === 'inputWrap') {
    e.preventDefault();
    const el = document.getElementById('textInput');
    el.focus();
    caretToEnd(el);
  }
});

// ─── Placeholder state ──────────────────────────────────────────────
// placeholderWord is also the canvas fallback, so the ghost and the rendered
// type always say the same thing.
let placeholderWord = 'try';

function updatePlaceholder() {
  const el = document.getElementById('textInput');
  const t = (el.innerText || '').replace(/[\n\r]/g, '').trim();
  el.classList.toggle('is-empty', t.length === 0);
}

// ─── Idle nudge ─────────────────────────────────────────────────────
// After a few seconds of nothing, cycle the ghost word twice so the type
// visibly changes on its own. Any interaction kills it permanently.
const PLACEHOLDERS   = ['try', 'type', 'anything'];
const NUDGE_DELAY    = 4000;   // idle time before the first swap
const NUDGE_HOLD     = 1500;   // time each word stays up
const NUDGE_FADE     = 350;    // matches the CSS transition
const NUDGE_LOOPS    = 2;      // passes through the list, ends back on 'try'

let phIndex   = 0;
let stepsLeft = 0;
let nudgeTimer = null;
let nudgeDone  = false;

function setPlaceholderWord(word) {
  placeholderWord = word;
  document.getElementById('textInput').style.setProperty('--ph', '"' + word + '"');
}

function startNudge() {
  if (nudgeDone) return;
  clearTimeout(nudgeTimer);
  nudgeTimer = setTimeout(() => {
    stepsLeft = PLACEHOLDERS.length * NUDGE_LOOPS;
    nudgeStep();
  }, NUDGE_DELAY);
}

function nudgeStep() {
  const el = document.getElementById('textInput');
  if (nudgeDone || stepsLeft <= 0 || !el.classList.contains('is-empty')) return;
  el.classList.add('ph-out');
  nudgeTimer = setTimeout(() => {
    if (nudgeDone) return;
    phIndex = (phIndex + 1) % PLACEHOLDERS.length;
    setPlaceholderWord(PLACEHOLDERS[phIndex]);
    el.classList.remove('ph-out');
    computeAutoSize();
    rebuild();
    stepsLeft--;
    if (stepsLeft > 0) nudgeTimer = setTimeout(nudgeStep, NUDGE_HOLD);
    else nudgeDone = true;
  }, NUDGE_FADE);
}

function cancelNudge() {
  if (nudgeDone) return;
  nudgeDone = true;
  clearTimeout(nudgeTimer);
  const el = document.getElementById('textInput');
  el.classList.remove('ph-out');
  if (placeholderWord !== PLACEHOLDERS[0]) {
    phIndex = 0;
    setPlaceholderWord(PLACEHOLDERS[0]);
    if (el.classList.contains('is-empty')) { computeAutoSize(); rebuild(); }
  }
}

document.addEventListener('keydown',   cancelNudge, true);
document.addEventListener('mousedown', cancelNudge, true);
document.addEventListener('touchstart', cancelNudge, { capture: true, passive: true });

// ─── Share link ─────────────────────────────────────────────────────
// Text and palette ride in the hash so a shared URL opens live, not as a still.
function currentText() {
  const el = document.getElementById('textInput');
  return (el.innerText || '').replace(/[\n\r]+/g, ' ').trim();
}

function shareURL() {
  const base  = location.href.split('#')[0];
  const parts = [];
  const t = currentText();
  if (t) parts.push('t=' + encodeURIComponent(t));
  if (currentTheme) parts.push('c=' + currentTheme);
  return base + (parts.length ? '#' + parts.join('&') : '');
}

function syncHash() {
  // replaceState keeps the back button clean. It can throw on file:// so guard it.
  try { history.replaceState(null, '', shareURL()); } catch (err) {}
}

function readHash() {
  const out = { text: '', theme: 0 };
  const h = location.hash.replace(/^#/, '');
  if (!h) return out;
  try {
    const p = new URLSearchParams(h);
    const t = p.get('t');
    const c = parseInt(p.get('c'), 10);
    if (t) out.text = t.slice(0, 90);
    if (!isNaN(c) && c >= 0 && c < THEMES.length) out.theme = c;
  } catch (err) {}
  return out;
}

function legacyCopy(text, done) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.top = '-9999px';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); done(); } catch (err) {}
  ta.remove();
}

function copyLink(e) {
  const btn = e && e.currentTarget;
  if (btn) btn.blur();   // hand focus back so type anywhere keeps working
  const url = shareURL();
  const done = () => {
    if (!btn) return;
    btn.textContent = 'copied';
    setTimeout(() => { btn.textContent = 'copy link'; }, 1200);
  };
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(url).then(done).catch(() => legacyCopy(url, done));
  } else {
    legacyCopy(url, done);
  }
}

// ─── PNG export ─────────────────────────────────────────────────────
// The backing store is already DPR scaled and capped at 2, so this exports at
// up to 2x with no re-render. PNG, not JPEG: sparse dots on flat black are the
// worst case for DCT and would ring around every particle.
function downloadPNG(e) {
  const btn = e && e.currentTarget;
  if (btn) btn.blur();
  const raw  = currentText() || placeholderWord;
  const slug = raw.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 32) || 'notype';
  try {
    canvas.toBlob(blob => {
      if (!blob) return;
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'notype-' + slug + '.png';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }, 'image/png');
  } catch (err) {}
}

// ─── Click to release particles ───────────────────────────────────────────────
canvas.addEventListener('mousedown', () => {
  clicked = true;
  // Scatter all particles
  const scatter = (arr) => arr.forEach(p => {
    const angle = Math.random() * Math.PI * 2;
    const spd   = 4 + Math.random() * 8;
    p.vx = Math.cos(angle) * spd;
    p.vy = Math.sin(angle) * spd;
    p.released = true;
  });
  scatter(innerParticles);
  scatter(fillParticles);
  scatter(tertiaryParticles);
  scatter(quaternaryParticles);
});

  clicked = false;
  // Re-enable attraction
  innerParticles.forEach(p => p.released = false);
  fillParticles.forEach(p => p.released = false);
  tertiaryParticles.forEach(p => p.released = false);
  quaternaryParticles.forEach(p => p.released = false);
});

/* Container is read separately from onControl(). The sliders are percentages

   computeAutoSize() runs before rebuild() and rewrites tracking, leading and

function onContainer() {

// ─── Input limits: auto-wrap at 15 chars/line, max 3 lines (contenteditable) ──
function enforceInputLimits() {
  const el = document.getElementById('textInput');
  const raw = el.innerText || '';
  const segments = raw.split('\n');
  const wrapped = [];
  for (const seg of segments) {
    if (seg.length <= 15) {
      wrapped.push(seg);
    } else {
      for (let i = 0; i < seg.length; i += 15) {
        wrapped.push(seg.slice(i, i + 15));
      }
    }
    if (wrapped.length >= 5) break;
  }
  const capped = wrapped.slice(0, 5).join('\n');
  if (capped !== raw) {
    el.innerText = capped;
    const range = document.createRange();
    const sel = window.getSelection();
    range.selectNodeContents(el);
    range.collapse(false);
    sel.removeAllRanges();
    sel.addRange(range);
  }
}

// ─── Auto-size: fit text to canvas with 15% vertical padding ─────────────────
// Tracking and leading scale proportionally with glyph size.
// The base reference: at glyphSize=200, tracking=-54, leading=-54.
const BASE_TRACK_RATIO = -54 / 200; // -0.27
const BASE_LEAD_RATIO  = -54 / 200; // -0.27

function computeAutoSize() {
  const text  = document.getElementById('textInput').innerText || placeholderWord;
  const lines = text.split('\n');
  const maxChars = Math.max(...lines.map(l => l.length || 1));

  const availH = (viewH || canvas.offsetHeight) * contH;
  const availW = (viewW || canvas.offsetWidth)  * contW;

  // glyphW = CS*2 + H*2 + PAD*2  where CS=S/2, H=S/4, PAD=S/8
  // => glyphW = S + S/2 + S/4 = 1.75*S
  const GLYPH_RATIO = 1.75;

  // tracking = BASE_TRACK_RATIO * S  (scales with size)
  // lineW = maxChars * glyphW + (maxChars-1) * tracking
  //       = maxChars * 1.75*S + (maxChars-1) * BASE_TRACK_RATIO * S
  //       = S * (maxChars*1.75 + (maxChars-1)*BASE_TRACK_RATIO)
  const wCoeff = maxChars * GLYPH_RATIO + (maxChars - 1) * BASE_TRACK_RATIO;
  const sFromW = wCoeff > 0 ? availW / wCoeff : 9999;

  // totalH = lines*glyphH + (lines-1)*leading
  //        = S * (lines*GLYPH_RATIO + (lines-1)*BASE_LEAD_RATIO)
  const hCoeff = lines.length * GLYPH_RATIO + (lines.length - 1) * BASE_LEAD_RATIO;
  const sFromH = hCoeff > 0 ? availH / hCoeff : 9999;

  /* 800 was a memory guard, not a design limit: it was the only thing keeping
     a glyph raster from reaching 196MB back when the raster and the logical box
     were the same number. MASK_MAX decouples them, so the buffer is 16MB at any
     size and this can be what it should have been, a sanity bound. */
  const S = Math.max(20, Math.min(Math.min(sFromW, sFromH), 40000));
  // Two-tier sizing: exactly 3 non-space chars = +30%, all others = +15% (vs original 0.8 base)
  const totalChars = lines.reduce((a, l) => a + l.replace(/ /g, '').length, 0);
  const sizeMultiplier = totalChars === 3 ? 1.04 : 0.92;
  // (0.8 * 1.30 = 1.04 for 3 chars; 0.8 * 1.15 = 0.92 for others)
  glyphSize = S * sizeMultiplier;

  // Scale tracking proportionally; leading reduced 40% from base ratio
  tracking = Math.round(BASE_TRACK_RATIO * glyphSize);
  leading  = Math.round(BASE_LEAD_RATIO  * glyphSize * 0.6); // 40% less leading

  // Sync sliders
  document.getElementById('trackSlider').value = tracking;
  document.getElementById('leadSlider').value  = leading;
  document.getElementById('trackVal').textContent = tracking;
  document.getElementById('leadVal').textContent  = leading;

  // Responsive particle count
  const BASE_S = 200;
  const BASE_P = 5000;
  /* Ceiling on the AUTO count, deliberately left at 5000 while partSlider now
     reaches 50000. The two are not the same number on purpose.

     particleCount scales with area_ratio, which is (glyphSize/200) squared, so
     it hits 10x by a glyph size of about 632. Letting the auto-fit reach 50000
     would mean any zoom past a small one silently slams the count to maximum.
     And maximum is not 50000 on screen: spawnParticles() pushes FOUR particles
     per iteration, one into each of the inner, fill, tertiary and quaternary
     arrays, so 50000 is 200,000 live, each going through a spatial grid rebuild
     and a collision pass every frame. That is a deliberate choice to make, not
     something zoom should trigger for you.

     So the headroom is on the slider, where you ask for it. */
  const PART_MAX = 5000;
  const chars = lines.reduce((a, l) => a + (l.length || 1), 0);
  const area_ratio = (glyphSize / BASE_S) ** 2;
  particleCount = Math.round(Math.max(50, Math.min(BASE_P * area_ratio * chars / 6, PART_MAX)));
  document.getElementById('partSlider').value = particleCount;
  document.getElementById('partVal').textContent = particleCount;
}

// ─── Mandala mask builder ─────────────────────────────────────────────────────
/* ── MASK RASTER CAP ──
   A glyph mask has two sizes now. The LOGICAL size (mask.w, mask.h) is the real
   1.75 x glyphSize footprint and is what every consumer positions against. The
   RASTER size (mask.pw, mask.ph) is the pixel buffer behind it, capped here.

   They used to be the same number, which is what put a hard ceiling on zoom.
   The mask allocates a square canvas and getImageData over all of it, once per
   character occurrence, with no cache, and every mask is held at once. At a
   logical 14000 that is 196MB for a single glyph. Capped, it is 16MB no matter
   how far the container opens.

   2048 is a resolution decision, not a memory one. The mask only has to be fine
   enough to place particles, and at 4.2M raster pixels it clears even a maxed
   50000 slider, which is 200,000 live, by more than an order of magnitude. What
   it also feeds is the tinted glyph sitting behind them, and that one does get
   upscaled past a logical 2048, so hard edges soften at extreme zoom. That
   backdrop is drawn in glyphColor, which defaults to the background, so it is
   the least costly place to spend the resolution. */
const MASK_MAX = 2048;

function buildMandalaMask() {
  const CS  = glyphSize / 2;
  const H   = CS / 2;
  const PAD = H * 0.5;
  const W   = Math.ceil(CS * 2 + H * 2 + PAD * 2);
  const HH  = W;
  const PW  = Math.min(W, MASK_MAX);
  const oc  = document.createElement('canvas');
  oc.width = PW; oc.height = PW;
  const octx = oc.getContext('2d');
  const path = new Path2D(MANDALA_PATH);
  /* Was W / MANDALA_VB. The path is drawn straight into the raster, so it
     scales to the buffer rather than to the logical box. */
  const scale = PW / MANDALA_VB;
  octx.save(); octx.scale(scale, scale);
  octx.fillStyle = '#fff'; octx.fill(path);
  octx.restore();
  const id = octx.getImageData(0, 0, PW, PW);
  const pixels = new Uint8Array(id.data.buffer);
  return { canvas: oc, pixels, w: W, h: HH, pw: PW, ph: PW };
}

// ─── Glyph mask builder ───────────────────────────────────────────────────────
function buildGlyphMask(char) {
  if (char === '@') return buildMandalaMask();
  const data = GLYPH_DATA[char];
  if (!data || !data.c.length) return null;
  const CS = glyphSize / 2, H = CS / 2, PAD = H * 0.5;
  const W  = Math.ceil(CS*2 + H*2 + PAD*2);
  const HH = Math.ceil(CS*2 + H*2 + PAD*2);
  const PW = Math.min(W, MASK_MAX);
  const oc = document.createElement('canvas');
  oc.width = PW; oc.height = PW;
  const octx = oc.getContext('2d');
  /* Every coordinate below stays in logical units. One transform at the top
     maps them into the raster, so the geometry reads the same as it did when
     the two sizes were one number. Below the cap this is scale(1, 1). */
  octx.scale(PW / W, PW / W);
  const sh = {};
  data.c.forEach(i => sh[i] = { N:false, E:false, S:false, W:false });
  data.e.forEach(([a, b]) => {
    const ra=Math.floor(a/3),ca=a%3,rb=Math.floor(b/3),cb=b%3;
    if(rb===ra&&cb===ca+1){sh[a].E=true;sh[b].W=true;}
    else if(rb===ra&&cb===ca-1){sh[a].W=true;sh[b].E=true;}
    else if(rb===ra+1&&cb===ca){sh[a].S=true;sh[b].N=true;}
    else if(rb===ra-1&&cb===ca){sh[a].N=true;sh[b].S=true;}
  });
  const ir = H / Math.SQRT2;
  octx.fillStyle = '#fff';
  data.c.forEach(idx => {
    const row=Math.floor(idx/3), col=idx%3;
    const cx = PAD + col*CS + CS/2;
    const cy = PAD + row*CS + CS/2;
    const s  = sh[idx];
    const corners = [
      { sharp:s.N, tip:[cx,   cy-H], a1:-3*Math.PI/4, a2:-Math.PI/4 },
      { sharp:s.E, tip:[cx+H, cy  ], a1:-Math.PI/4,   a2: Math.PI/4 },
      { sharp:s.S, tip:[cx,   cy+H], a1: Math.PI/4,   a2: 3*Math.PI/4 },
      { sharp:s.W, tip:[cx-H, cy  ], a1: 3*Math.PI/4, a2: 5*Math.PI/4 },
    ];
    octx.beginPath(); let started = false;
    for (let i=0;i<4;i++) {
      const {sharp,tip,a1,a2}=corners[i];
      if (sharp) {
        if(!started){octx.moveTo(tip[0],tip[1]);started=true;}
        else octx.lineTo(tip[0],tip[1]);
      } else {
        const r=Math.max(1,ir);
        const sx=cx+r*Math.cos(a1),sy=cy+r*Math.sin(a1);
        if(!started){octx.moveTo(sx,sy);started=true;}
        else octx.lineTo(sx,sy);
        octx.arc(cx,cy,r,a1,a2,false);
      }
    }
    octx.closePath(); octx.fill();
  });
  const id = octx.getImageData(0,0,PW,PW);
  const pixels = new Uint8Array(id.data.buffer);
  return { canvas:oc, pixels, w:W, h:HH, pw:PW, ph:PW };
}

/* lx, ly arrive in logical mask space. Bounds are checked there, then the
   point is mapped into the raster. Below the cap the ratio is 1 and this is
   the old lookup with two extra multiplies. */
function insideMask(mask, lx, ly) {
  if (lx < 0 || ly < 0 || lx >= mask.w || ly >= mask.h) return false;
  const ix = (lx * mask.pw / mask.w) | 0;
  const iy = (ly * mask.ph / mask.h) | 0;
  if (ix < 0 || iy < 0 || ix >= mask.pw || iy >= mask.ph) return false;
  return mask.pixels[(iy*mask.pw+ix)*4] > 128;
}

// ─── Global canvas-space mask ─────────────────────────────────────────────────
function buildGlobalMask() {
  const W = viewW, H = viewH;
  const buf = new Uint8Array(W * H);
  letterMasks.forEach(({ mask, x, y }) => {
    const x0=Math.floor(x), y0=Math.floor(y);
    /* Clip to the canvas before iterating, not inside the loop. The old version
       walked the glyph's full logical box and bounds-checked each pixel, which
       was fine while a glyph was smaller than the screen and quadratic once the
       container opened past 100%. A logical 14000 glyph is 196M iterations, and
       all but a screenful of them were being thrown away. Bounded this way the
       cost per glyph can never exceed the viewport. */
    const gx0 = Math.max(0, x0), gx1 = Math.min(W, x0 + mask.w);
    const gy0 = Math.max(0, y0), gy1 = Math.min(H, y0 + mask.h);
    for (let gy=gy0; gy<gy1; gy++) {
      for (let gx=gx0; gx<gx1; gx++) {
        if (insideMask(mask, gx - x0, gy - y0)) buf[gy*W+gx] = 1;
      }
    }
  });
  return { pixels:buf, w:W, h:H };
}

function insideAnyLetter(gx, gy) {
  if(!globalMask) return false;
  const ix=gx|0, iy=gy|0;
  if(ix<0||iy<0||ix>=globalMask.w||iy>=globalMask.h) return false;
  return globalMask.pixels[iy*globalMask.w+ix] === 1;
}

function randomInsideMask(mask) {
  for(let t=0;t<500;t++){
    const x=Math.random()*mask.w, y=Math.random()*mask.h;
    if(insideMask(mask,x,y)) return [x,y];
  }
  /* Fallback when 500 random darts all miss. It used to sweep the logical box,
     which past the cap is a 196M-iteration scan for a glyph that only has a
     few million real pixels behind it. Sweeping the raster finds the same first
     hit and converts it back, so the cost is bounded by MASK_MAX. */
  for (let iy=0; iy<mask.ph; iy++) for (let ix=0; ix<mask.pw; ix++) {
    if (mask.pixels[(iy*mask.pw+ix)*4] > 128)
      return [ (ix+0.5) * mask.w / mask.pw, (iy+0.5) * mask.h / mask.ph ];
  }
  return [mask.w/2, mask.h/2];
}

function randomOutsideLetters() {
  for(let t=0;t<500;t++){
    const x=Math.random()*viewW, y=Math.random()*viewH;
    if(!insideAnyLetter(x,y)) return [x,y];
  }
  return [Math.random()*viewW, Math.random()*viewH];
}

// ─── Layout ───────────────────────────────────────────────────────────────────
function rebuild() {
  cancelAnimationFrame(animId);
  resize();
  letterMasks = [];

  const CS    = glyphSize / 2;
  const H     = CS / 2;
  const PAD   = H * 0.5;
  const glyphW = CS*2 + H*2 + PAD*2;
  const glyphH = CS*2 + H*2 + PAD*2;

  const text  = document.getElementById('textInput').innerText || placeholderWord;
  const lines = text.split('\n');

  function isValidGlyph(ch) {
    return ch === '@' || (GLYPH_DATA[ch] && GLYPH_DATA[ch].c.length > 0);
  }

  const blockH  = lines.length*glyphH + (lines.length-1)*leading;
  let originY = (viewH - blockH) / 2;
  /* The 10px floor keeps small type off the top edge. Past 100% container it
     would fight the zoom: once the block is taller than the canvas the centred
     origin is negative on purpose, and pinning it to 10 threw the whole block
     downward so it overflowed the bottom only. Guarded, so the floor applies
     while the type fits and stands down once it does not. */
  if (blockH <= viewH && originY < 10) originY = 10;
  /* Pan is applied after the floor, not before, so panning is never clamped
     back. The floor is about where centred type rests; the offset is a
     deliberate move away from that and has to survive it. Offsets are fractions
     of the viewport rather than pixels, so a given slider position frames the
     same way at any canvas size or zoom. */
  originY += offY * viewH;

  lines.forEach(line => {
    const chars = line.toLowerCase().split('');
    const lineW = chars.reduce((a,ch) => a + (isValidGlyph(ch)?glyphW:glyphW*0.5) + tracking, -tracking);
    let originX = (viewW - lineW) / 2 + offX * viewW;
    chars.forEach(ch => {
      const charW = isValidGlyph(ch) ? glyphW : glyphW*0.5;
      if(ch!==' ' && isValidGlyph(ch)) {
        const mask = buildGlyphMask(ch);
        if(mask) letterMasks.push({ mask, x:originX, y:originY, ch });
      }
      originX += charW + tracking;
    });
    originY += glyphH + leading;
  });

  globalMask = buildGlobalMask();
  buildTintedGlyphs();
  invertedGlyphs = []; invertedGlyphColor = null; // invalidate inverted cache
  spawnParticles();
  animate();
}

// ─── Spatial grid ─────────────────────────────────────────────────────────────
let grid = null, gridCellSize = 1, gridCols = 1, gridRows = 1;

function buildGrid(allParticles, gapSpacing) {
  const minDist = ptRadius*2 + gapSpacing;
  gridCellSize  = Math.max(1, minDist);
  gridCols = Math.ceil(viewW  / gridCellSize) + 1;
  gridRows = Math.ceil(viewH / gridCellSize) + 1;
  grid = new Array(gridCols * gridRows).fill(null).map(() => []);
  allParticles.forEach(p => {
    const cx = Math.floor(p.x / gridCellSize);
    const cy = Math.floor(p.y / gridCellSize);
    if(cx>=0&&cy>=0&&cx<gridCols&&cy<gridRows) grid[cy*gridCols+cx].push(p);
  });
}

function resolveCollisions(allParticles, gapSpacing) {
  if(gapSpacing < 0.1 && ptRadius < 0.5) return;
  const minDist = ptRadius*2 + gapSpacing;
  const minDist2 = minDist*minDist;
  allParticles.forEach(p => {
    const cx=Math.floor(p.x/gridCellSize);
    const cy=Math.floor(p.y/gridCellSize);
    for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++) {
      const nx=cx+dx, ny=cy+dy;
      if(nx<0||ny<0||nx>=gridCols||ny>=gridRows) continue;
      const cell=grid[ny*gridCols+nx];
      for(let i=0;i<cell.length;i++){
        const q=cell[i]; if(q===p) continue;
        const ex=p.x-q.x, ey=p.y-q.y;
        const d2=ex*ex+ey*ey;
        if(d2<minDist2&&d2>0.0001){
          const d=Math.sqrt(d2), push=(minDist-d)/d*0.5;
          const fx=ex*push, fy=ey*push;
          p.vx+=fx*0.4; p.vy+=fy*0.4;
          q.vx-=fx*0.4; q.vy-=fy*0.4;
        }
      }
    }
  });
}

// ─── Fill particle (passive, cursor-repelled, base layer) ────────────────────
class FillParticle {
  constructor(mask, ox, oy, mirrored=false) {
    this.mask = mask; this.ox = ox; this.oy = oy;
    this.mirrored = mirrored;
    this.released = false;

      const [lx, ly] = randomInsideMask(mask);
      this.x = ox+lx; this.y = oy+ly;
      this.lx = lx; this.ly = ly;
    
    const angle = Math.random()*Math.PI*2, spd = Math.random()*0.4;
    this.vx = Math.cos(angle)*spd; this.vy = Math.sin(angle)*spd;
    this.stuckFrames = 0;
  }

  update() {
    if (this.released) {
      // Released: scatter but stay inside the mask — bounce off letter walls
      this.vx *= 0.97; this.vy *= 0.97;
      const nx = this.x + this.vx, ny = this.y + this.vy;
      const nlx = nx - this.ox, nly = ny - this.oy;
      if (insideMask(this.mask, nlx, nly)) {
        this.x = nx; this.y = ny; this.lx = nlx; this.ly = nly;
      } else if (insideMask(this.mask, nlx, this.ly)) {
        this.x = nx; this.lx = nlx; this.vy *= -0.7;
      } else if (insideMask(this.mask, this.lx, nly)) {
        this.y = ny; this.ly = nly; this.vx *= -0.7;
      } else {
        this.vx *= -0.7; this.vy *= -0.7;
      }
      this.lx = this.x - this.ox; this.ly = this.y - this.oy;
      return;
    }

    const s = this.mirrored ? speed2 : speed;
    const dx = mouse.x - this.x, dy = mouse.y - this.y;
    const dist = Math.sqrt(dx*dx+dy*dy) || 1;
    if(mouse.active && !floatMode) {
      // Normal mode: repelled by cursor
      const push = Math.min(s*0.6, s*60/(dist+8));
      this.vx -= (dx/dist)*push*0.15; this.vy -= (dy/dist)*push*0.15;
    }
    // Float mode: pure brownian drift — slightly higher noise for organic feel
    const jitter = floatMode ? 0.18 : 0.08;
    this.vx += (Math.random()-0.5)*jitter; this.vy += (Math.random()-0.5)*jitter;
    this.vx *= 0.97; this.vy *= 0.97;
    const spd = Math.sqrt(this.vx*this.vx+this.vy*this.vy);
    if(spd>s){this.vx=(this.vx/spd)*s;this.vy=(this.vy/spd)*s;}


      const nx=this.x+this.vx, ny=this.y+this.vy;
      const nlx=nx-this.ox, nly=ny-this.oy;
      if(insideMask(this.mask,nlx,nly)){
        this.x=nx; this.y=ny; this.lx=nlx; this.ly=nly; this.stuckFrames=0;
      } else if(insideMask(this.mask,nlx,this.ly)){
        this.x=nx; this.lx=nlx; this.vy*=0.3; this.stuckFrames=0;
      } else if(insideMask(this.mask,this.lx,nly)){
        this.y=ny; this.ly=nly; this.vx*=0.3; this.stuckFrames=0;
      } else {
        this.stuckFrames++;
        const probe=3; let nx2=0, ny2=0, samples=0;
        for(let a=0;a<8;a++){
          const ang=(a/8)*Math.PI*2;
          const px=this.lx+Math.cos(ang)*probe, py=this.ly+Math.sin(ang)*probe;
          if(!insideMask(this.mask,px,py)){nx2+=Math.cos(ang);ny2+=Math.sin(ang);samples++;}
        }
        if(samples>0){
          const tlen=Math.sqrt(nx2*nx2+ny2*ny2)||1;
          const tx=-ny2/tlen, ty=nx2/tlen;
          const sal=this.vx*tx+this.vy*ty;
          this.vx=tx*sal+(Math.random()-0.5)*0.1; this.vy=ty*sal+(Math.random()-0.5)*0.1;
          this.vx-=(nx2/tlen)*0.1; this.vy-=(ny2/tlen)*0.1;
        } else { this.vx*=-0.4; this.vy*=-0.4; }
        if(this.stuckFrames>45){
          const [lx,ly]=randomInsideMask(this.mask);
          this.x=this.ox+lx; this.y=this.oy+ly; this.lx=lx; this.ly=ly;
          const a=Math.random()*Math.PI*2;
          this.vx=Math.cos(a)*0.3; this.vy=Math.sin(a)*0.3; this.stuckFrames=0;
        }
      }
      this.lx=this.x-this.ox; this.ly=this.y-this.oy;
    
  }

}

// ─── Inner particle (cursor-attracted, constrained inside letter) ─────────────
class InnerParticle {
  constructor(mask, ox, oy, mirrored=false) {
    this.mask = mask; this.ox = ox; this.oy = oy;
    this.mirrored = mirrored;
    this.released = false;

      const [lx,ly] = randomInsideMask(mask);
      this.x = ox+lx; this.y = oy+ly;
      this.lx = lx; this.ly = ly;
    
    this.vx = (Math.random()-0.5)*0.5; this.vy = (Math.random()-0.5)*0.5;
    this.stuckFrames = 0;
  }

  update() {
    if (this.released) {
      // Released: scatter but stay inside the mask — bounce off letter walls
      this.vx *= 0.97; this.vy *= 0.97;
      const nx = this.x + this.vx, ny = this.y + this.vy;
      const nlx = nx - this.ox, nly = ny - this.oy;
      if (insideMask(this.mask, nlx, nly)) {
        this.x = nx; this.y = ny; this.lx = nlx; this.ly = nly;
      } else if (insideMask(this.mask, nlx, this.ly)) {
        this.x = nx; this.lx = nlx; this.vy *= -0.7;
      } else if (insideMask(this.mask, this.lx, nly)) {
        this.y = ny; this.ly = nly; this.vx *= -0.7;
      } else {
        this.vx *= -0.7; this.vy *= -0.7;
      }
      this.lx = this.x - this.ox; this.ly = this.y - this.oy;
      return;
    }

    const s = this.mirrored ? speed2 : speed;
    const dx = mouse.x - this.x, dy = mouse.y - this.y;
    const dist = Math.sqrt(dx*dx+dy*dy) || 1;
    if(mouse.active) {
      const pull = Math.min(s*0.6, s*60/(dist+8));
      this.vx += (dx/dist)*pull*0.15; this.vy += (dy/dist)*pull*0.15;
    }
    this.vx += (Math.random()-0.5)*0.3; this.vy += (Math.random()-0.5)*0.3;
    this.vx *= 0.85; this.vy *= 0.85;
    const spd = Math.sqrt(this.vx*this.vx+this.vy*this.vy);
    if(spd>s){this.vx=(this.vx/spd)*s;this.vy=(this.vy/spd)*s;}


      const nx=this.x+this.vx, ny=this.y+this.vy;
      const nlx=nx-this.ox, nly=ny-this.oy;
      if(insideMask(this.mask,nlx,nly)){
        this.x=nx; this.y=ny; this.lx=nlx; this.ly=nly; this.stuckFrames=0;
      } else if(insideMask(this.mask,nlx,this.ly)){
        this.x=nx; this.lx=nlx; this.vy*=0.3; this.stuckFrames=0;
      } else if(insideMask(this.mask,this.lx,nly)){
        this.y=ny; this.ly=nly; this.vx*=0.3; this.stuckFrames=0;
      } else {
        this.stuckFrames++;
        const probe=3; let nx2=0, ny2=0, samples=0;
        for(let a=0;a<8;a++){
          const ang=(a/8)*Math.PI*2;
          const px=this.lx+Math.cos(ang)*probe, py=this.ly+Math.sin(ang)*probe;
          if(!insideMask(this.mask,px,py)){nx2+=Math.cos(ang);ny2+=Math.sin(ang);samples++;}
        }
        if(samples>0){
          const tlen=Math.sqrt(nx2*nx2+ny2*ny2)||1;
          const tx=-ny2/tlen, ty=nx2/tlen;
          const sal=this.vx*tx+this.vy*ty;
          this.vx=tx*sal*1.0+(Math.random()-0.5)*0.2; this.vy=ty*sal*1.0+(Math.random()-0.5)*0.2;
          this.vx-=(nx2/tlen)*0.15; this.vy-=(ny2/tlen)*0.15;
        } else {
          this.vx+=(this.ox+this.mask.w/2-this.x)*0.05;
          this.vy+=(this.oy+this.mask.h/2-this.y)*0.05;
        }
        if(this.stuckFrames>45){
          const [lx,ly]=randomInsideMask(this.mask);
          this.x=this.ox+lx; this.y=this.oy+ly; this.lx=lx; this.ly=ly;
          this.vx=(Math.random()-0.5)*0.5; this.vy=(Math.random()-0.5)*0.5; this.stuckFrames=0;
        }
      }
      this.lx=this.x-this.ox; this.ly=this.y-this.oy;
    
  }

}

// ─── Spawn ────────────────────────────────────────────────────────────────────
function spawnParticles() {
  innerParticles = []; fillParticles = [];
  tertiaryParticles = []; quaternaryParticles = [];
  if(!letterMasks.length) return;
  const perLetter = Math.max(1, Math.round(particleCount / letterMasks.length));
  letterMasks.forEach(({mask, x, y}) => {
    for(let i=0;i<perLetter;i++){
      innerParticles.push(new InnerParticle(mask, x, y, false));
      fillParticles.push(new FillParticle(mask, x, y, false));
      tertiaryParticles.push(new InnerParticle(mask, x, y, true));
      quaternaryParticles.push(new FillParticle(mask, x, y, true));
    }
  });
}

// ─── Tinted glyph cache ───────────────────────────────────────────────────────
let tintedGlyphs = [];
function buildTintedGlyphs() {
  tintedGlyphs = letterMasks.map(({mask}) => {
    const tmp = document.createElement('canvas');
    /* Raster size, not logical. Past the cap a logical-sized canvas is either
       an illegal allocation or hundreds of megabytes. The draw call scales it
       back up to mask.w by mask.h. */
    tmp.width = mask.pw; tmp.height = mask.ph;
    const tc = tmp.getContext('2d');
    tc.drawImage(mask.canvas, 0, 0);
    tc.globalCompositeOperation = 'source-in';
    tc.fillStyle = glyphColor;
    tc.fillRect(0, 0, mask.pw, mask.ph);
    return tmp;
  });
}

// Re-tint cached glyph shapes with a given color (used in inverted mode, cached by color)
let invertedGlyphs = [];
let invertedGlyphColor = null;
function ensureInvertedGlyphs() {
  if (invertedGlyphColor === bgColor && invertedGlyphs.length === letterMasks.length) return;
  invertedGlyphColor = bgColor;
  invertedGlyphs = letterMasks.map(({mask}) => {
    const tmp = document.createElement('canvas');
    tmp.width = mask.pw; tmp.height = mask.ph;
    const tc = tmp.getContext('2d');
    tc.drawImage(mask.canvas, 0, 0);
    tc.globalCompositeOperation = 'source-in';
    tc.fillStyle = bgColor;
    tc.fillRect(0, 0, mask.pw, mask.ph);
    return tmp;
  });
}

// ─── Cursor ───────────────────────────────────────────────────────────────────
const isEmbedded = window.self !== window.top;
// ─── Animate ──────────────────────────────────────────────────────────────────
// Batched particle drawing: one path + one fill per color group instead of
// beginPath/fillStyle/fill per particle. Pays for the DPR-scaled fill rate.
const TAU = Math.PI * 2;

// Soft particles are pre-rendered sprites, not a post-process blur. A blurred
// frame buffer would sample transparent pixels past the viewport and leave a
// faded band around all four edges. Per-particle sprites clip at the edge the
// same way hard dots do, so there is nothing to fix.
const _spriteCache = new Map();

function particleSprite(color, radius, soft) {
  const key = color + '|' + radius + '|' + soft;
  const hit = _spriteCache.get(key);
  if (hit) return hit;
  // Theme lerps generate a new colour every frame, so keep the cache bounded.
  if (_spriteCache.size > 48) _spriteCache.clear();

  const dpr  = Math.min(window.devicePixelRatio || 1, 2);
  const rOut = radius + soft;
  const size = Math.ceil(rOut * 2) + 2;
  const c = document.createElement('canvas');
  c.width  = Math.ceil(size * dpr);
  c.height = Math.ceil(size * dpr);
  const g = c.getContext('2d');
  g.scale(dpr, dpr);

  const [r, gg, b] = hexToRgb(color);
  const mid  = size / 2;
  const core = Math.max(0, Math.min(0.95, radius / rOut));
  const grad = g.createRadialGradient(mid, mid, 0, mid, mid, rOut);
  grad.addColorStop(0,    'rgba(' + r + ',' + gg + ',' + b + ',1)');
  grad.addColorStop(core, 'rgba(' + r + ',' + gg + ',' + b + ',1)');
  grad.addColorStop(1,    'rgba(' + r + ',' + gg + ',' + b + ',0)');
  g.fillStyle = grad;
  g.fillRect(0, 0, size, size);

  const sprite = { canvas: c, size: size, half: size / 2 };
  _spriteCache.set(key, sprite);
  return sprite;
}

function drawBatch(list, colBase, colMirrored) {
  if (ptSoft <= 0) {
    // Fast path: one path and one fill per colour group.
    ctx.beginPath();
    for (const p of list) if (!p.mirrored) { ctx.moveTo(p.x + ptRadius, p.y); ctx.arc(p.x, p.y, ptRadius, 0, TAU); }
    ctx.fillStyle = colBase; ctx.fill();
    ctx.beginPath();
    for (const p of list) if (p.mirrored) { ctx.moveTo(p.x + ptRadius, p.y); ctx.arc(p.x, p.y, ptRadius, 0, TAU); }
    ctx.fillStyle = colMirrored; ctx.fill();
    return;
  }
  const sB = particleSprite(colBase,     ptRadius, ptSoft);
  const sM = particleSprite(colMirrored, ptRadius, ptSoft);
  for (const p of list) {
    const s = p.mirrored ? sM : sB;
    ctx.drawImage(s.canvas, p.x - s.half, p.y - s.half, s.size, s.size);
  }
}

function animate() {
  ctx.fillStyle = bgColor;
  ctx.fillRect(0, 0, viewW, viewH);

  // Glyph fills first (behind particles)
  tintedGlyphs.forEach((tg, i) => {
    const {mask, x, y} = letterMasks[i];
    /* Explicit destination size. The cached canvas is the raster, which below
       the cap equals the logical box and above it does not. */
    ctx.save(); ctx.globalAlpha = glyphOpacity;
    ctx.drawImage(tg, x, y, mask.w, mask.h);
    ctx.restore();
  });

  buildGrid(fillParticles, spacing);
  resolveCollisions(fillParticles, spacing);
  buildGrid(quaternaryParticles, spacing);
  resolveCollisions(quaternaryParticles, spacing);
  buildGrid(innerParticles, spacing);
  resolveCollisions(innerParticles, spacing);
  buildGrid(tertiaryParticles, spacing);
  resolveCollisions(tertiaryParticles, spacing);

  ctx.save(); ctx.globalAlpha = fillAlpha;
  fillParticles.forEach(p => p.update());
  quaternaryParticles.forEach(p => p.update());
  drawBatch(fillParticles, fillCol, quatCol);
  drawBatch(quaternaryParticles, fillCol, quatCol);
  ctx.restore();
  innerParticles.forEach(p => p.update());
  tertiaryParticles.forEach(p => p.update());
  drawBatch(innerParticles, ptColor, tertCol);
  drawBatch(tertiaryParticles, ptColor, tertCol);

  // Character labels (dev only)
  if (showLabels) {
    ctx.save();
    ctx.font = `${labelSize}px -apple-system, sans-serif`;
    ctx.fillStyle = labelColor;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowBlur = 0;
    letterMasks.forEach(({mask, x, y, ch}) => {
      ctx.fillText(ch.toUpperCase(), x + mask.w/2, y + mask.h/2);
    });
    ctx.restore();
  }

  animId = requestAnimationFrame(animate);
}

// ─── Resize ───────────────────────────────────────────────────────────────────
let viewW = 0, viewH = 0; // logical (CSS px) canvas size; backing store is DPR-scaled
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  viewW = canvas.offsetWidth;
  viewH = canvas.offsetHeight;
  canvas.width  = viewW * dpr;
  canvas.height = viewH * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0); // all drawing stays in CSS px
}

window.addEventListener('resize', () => { computeAutoSize(); rebuild(); });
// Allow parent portfolio page to trigger a resize+rebuild via postMessage
// after the iframe's pixel dimensions have been set (canvas was 0×0 on first boot)
window.addEventListener('message', (e) => {
  if (e.data === 'notype:resize') { resize(); computeAutoSize(); rebuild(); }
});

canvas.addEventListener('mousemove', e => {
  const r = canvas.getBoundingClientRect();
  mouse.x = (e.clientX - r.left);
  mouse.y = (e.clientY - r.top);
  mouse.active = true;
});
canvas.addEventListener('mouseleave', () => { mouse.active = false; });
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  const r = canvas.getBoundingClientRect();
  mouse.x = e.touches[0].clientX - r.left;
  mouse.y = e.touches[0].clientY - r.top;
  mouse.active = true;
}, { passive:false });
canvas.addEventListener('touchend', () => { mouse.active = false; });

// ─── Boot ─────────────────────────────────────────────────────────────────────
const hashState = readHash();
currentTheme = hashState.theme;
buildThemeDots();
applyTheme(hashState.theme, true);
syncThemeEditors();
updateInputContrast();
// Wait a frame for layout to settle
requestAnimationFrame(() => {
  resize();
  if (hashState.text) {
    document.getElementById('textInput').innerText = hashState.text;
    nudgeDone = true;              // arriving with content, no invitation needed
  }
  enforceInputLimits();
  updatePlaceholder();
  setPlaceholderWord(PLACEHOLDERS[0]);
  updateActions();
  if (!hashState.text) startNudge();
  computeAutoSize();
  rebuild();
});


// ─── Pill particle field ─────────────────────────────────────────────────────
// All four colour sets ride the same capsule outline at the same radius, so the
// result is a single thin line with the colours mixed along it rather than four
// concentric lanes.
(function pillField() {
  const el   = document.getElementById('textInput');
  const cv   = document.getElementById('pillCanvas');
  const ctx  = cv.getContext('2d');
  const OVER = 12;         // canvas overhang so the ring is not clipped
  const BAND = 1.5;        // thickness of the shared ring, CSS px
  let W = 0, H = 0, dpr = 1;

  // All four sets share one radius, so the rings stack into a single thin line.
  const sets = [
    { off: 0, pts: [], mode: 'repel',   col: () => fillCol },
    { off: 0, pts: [], mode: 'repel',   col: () => quatCol },
    { off: 0, pts: [], mode: 'attract', col: () => ptColor },
    { off: 0, pts: [], mode: 'attract', col: () => tertCol }
  ];
  const pm = { x: -9999, y: -9999, active: false };

  // Capsule spine: the horizontal segment between the two cap centres.
  function spine(x, y) {
    const r  = H / 2;
    const ax = r, bx = Math.max(r, W - r);
    return [Math.min(Math.max(x, ax), bx), r];
  }
  function ringRadius(st) { return Math.max(1, H / 2 + st.off); }

  function seedPoint(st) {
    const R  = H / 2;
    const rr = ringRadius(st) + (Math.random() - 0.5) * BAND;
    const straight = Math.max(0, W - H);
    const perim = straight * 2 + Math.PI * H;
    let t = Math.random() * perim;
    if (t < straight) return [R + t, R - rr];
    if ((t -= straight) < straight) return [R + t, R + rr];
    const a = ((t - straight) / (Math.PI * H)) * Math.PI * 2;
    const cx = Math.cos(a) < 0 ? R : Math.max(R, W - R);
    return [cx + Math.cos(a) * rr, R + Math.sin(a) * rr];
  }

  // Hold the particle inside its own ring and cancel radial drift.
  function clampToRing(st, p) {
    const [cx, cy] = spine(p.x, p.y);
    const dx = p.x - cx, dy = p.y - cy;
    const d  = Math.sqrt(dx * dx + dy * dy) || 1;
    const nx = dx / d, ny = dy / d;
    const R  = ringRadius(st);
    const rin = Math.max(0.5, R - BAND / 2), rout = R + BAND / 2;
    if (d >= rin && d <= rout) return;
    const target = d < rin ? rin : rout;
    p.x = cx + nx * target;
    p.y = cy + ny * target;
    const vr = p.vx * nx + p.vy * ny;
    p.vx -= nx * vr * 1.6;
    p.vy -= ny * vr * 1.6;
  }

  function seed() {
    const straight = Math.max(0, W - H);
    const perim = straight * 2 + Math.PI * H;
    const per = Math.max(6, Math.min(80, Math.round(perim / 6)));
    for (const st of sets) {
      while (st.pts.length > per) st.pts.pop();
      while (st.pts.length < per) {
        const [x, y] = seedPoint(st);
        const a = Math.random() * Math.PI * 2, sp = Math.random() * 0.3;
        st.pts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp });
      }
    }
  }

  function sync() {
    const w = el.offsetWidth, h = el.offsetHeight;
    if (!w || !h) return;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.style.left   = (el.offsetLeft - OVER) + 'px';
    cv.style.top    = (el.offsetTop  - OVER) + 'px';
    cv.style.width  = (w + OVER * 2) + 'px';
    cv.style.height = (h + OVER * 2) + 'px';
    cv.width  = Math.round((w + OVER * 2) * dpr);
    cv.height = Math.round((h + OVER * 2) * dpr);
    W = w; H = h;
    for (const st of sets) for (const p of st.pts) clampToRing(st, p);
    seed();
  }

  window.addEventListener('pointermove', e => {
    const r = cv.getBoundingClientRect();
    pm.x = e.clientX - r.left - OVER;   // pill local, not canvas local
    pm.y = e.clientY - r.top  - OVER;
    pm.active = true;
  });
  window.addEventListener('pointerleave', () => { pm.active = false; });

  function step() {
    const floating = (typeof floatMode !== 'undefined' && floatMode);
    const drift  = floating ? 0.16 : 0.07;
    const maxSpd = 0.5;
    for (const st of sets) {
      const repel = st.mode === 'repel';
      for (const p of st.pts) {
        if (pm.active && !(floating && repel)) {
          const dx = pm.x - p.x, dy = pm.y - p.y;
          const d  = Math.sqrt(dx * dx + dy * dy) || 1;
          const f  = Math.min(maxSpd * 0.6, maxSpd * 40 / (d + 8)) * 0.25;
          const sgn = repel ? -1 : 1;
          p.vx += (dx / d) * f * sgn;
          p.vy += (dy / d) * f * sgn;
        }
        p.vx += (Math.random() - 0.5) * drift;
        p.vy += (Math.random() - 0.5) * drift;
        p.vx *= 0.96; p.vy *= 0.96;
        const sp = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
        if (sp > maxSpd) { p.vx = (p.vx / sp) * maxSpd; p.vy = (p.vy / sp) * maxSpd; }
        p.x += p.vx; p.y += p.vy;
        clampToRing(st, p);
      }
    }
  }

  function draw() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W + OVER * 2, H + OVER * 2);
    ctx.translate(OVER, OVER);   // draw in pill local coordinates
    const r = Math.max(0.6, (typeof ptRadius !== 'undefined' ? ptRadius : 1) * 0.7);
    for (const st of sets) {
      ctx.beginPath();
      for (const p of st.pts) { ctx.moveTo(p.x + r, p.y); ctx.arc(p.x, p.y, r, 0, Math.PI * 2); }
      ctx.fillStyle = st.col();
      ctx.fill();
    }
  }

  function loop() { step(); draw(); requestAnimationFrame(loop); }

  if (typeof ResizeObserver !== 'undefined') new ResizeObserver(sync).observe(el);
  window.addEventListener('resize', sync);
  sync();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
