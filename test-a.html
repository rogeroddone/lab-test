<!DOCTYPE html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>A mirror</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior:smooth; -webkit-text-size-adjust:100%; }
html, body { width:100%; height:100%; overflow:hidden; }
body { font-family:-apple-system,Helvetica,sans-serif; background:#F5F5F5; }
.bar { position:fixed; top:0; left:0; right:0; height:57px; background:#F5F5F5; z-index:9999; pointer-events:none; }
.hdr { position:fixed; top:15px; left:10px; right:10px; z-index:10000; font-size:16px; display:flex; justify-content:space-between; }
.main { height:100svh; overflow-y:auto; overflow-x:hidden; padding:57px 10px 240px; -webkit-overflow-scrolling:touch; scroll-behavior:smooth; }
.main::-webkit-scrollbar { display:none; }
.lbl { margin:calc(100vh / 6 - 57px) 0 20px; font-size:22px; }
.card { height:40vh; border-radius:8px; margin-bottom:8px; display:flex; align-items:flex-end; padding:14px; color:#fff; font-size:28px; }
.tag { position:fixed; bottom:8px; right:10px; font:12px monospace; background:#000; color:#fff; padding:4px 6px; z-index:10001; }
</style></head><body>
<div class="bar"></div>
<div class="hdr"><span>A mirror</span><span>Work / Info</span></div>
<div class="main">
<div class="lbl">Selected works (7)</div>
<div class="card" style="background:#E8583F">1</div>
<div class="card" style="background:#fff;color:#000">2</div>
<div class="card" style="background:#333">3</div>
<div class="card" style="background:#2A6BD8">4</div>
<div class="card" style="background:#0A8F5C">5</div>
</div>
<div class="tag" id="tag"></div>
<script>
function r(){document.getElementById('tag').textContent='ih '+innerHeight+' vv '+(visualViewport?Math.round(visualViewport.height)+' ot '+Math.round(visualViewport.offsetTop):'-')+' sy '+Math.round(scrollY);}
r(); setInterval(r,500);
</script></body></html>
