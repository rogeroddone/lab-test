nction () {\n  const STEPS = 20, SD = 360 / STEPS;\n  const LS_KEY = 'hg26.themes.v1';\n\n  const H = {\n    mode: 'comp',\n    hue: 11, spr: 1, opp: 10,\n    sat: 100,\n    satA: 100, litA: 66,\n    satB: 92, litB: 42,\n    bgL: 3, bgS: 18, amb: 22, amb2: 50,\n    pullA: 100, pushA: 100, blend: 'source-over',\n    bgHex: null, ambHex: null\n  };\n  let snapshot = null;\n  /* The four themes the file boots with, kept aside so they can be put back\n     after they have been edited over. */\n  const DEFAULTS = JSON.parse(JSON.stringify(THEMES));\n\n  // ── color math ──────────────────────────────────────────────────────────\n  function hsl2hex(h, s, l) {\n    h = ((h % 360) + 360) % 360; s = Math.max(0, Math.min(100, s)) / 100; l = Math.max(0, Math.min(100, l)) / 100;\n    const c = (1 - Math.abs(2 * l - 1)) * s;\n    const x = c * (1 - Math.abs(((h / 60) % 2) - 1));\n    const m = l - c / 2;\n    let r = 0, g = 0, b = 0;\n    if (h < 60)       { r = c; g = x; }\n    else if (h < 120) { r = x; g = c; }\n    else if (h < 180) { g = c; b = x; }\n    else if (h < 240) { g = x; b = c; }\n    else if (h < 300) { r = x; b = c; }\n    else              { r = c; b = x; }\n    const to = v => Math.round((v + m) * 255).toString(16).padStart(2, '0');\n    return '#' + to(r) + to(g) + to(b);\n  }\n  function toHsl(hex) {\n    const n = parseInt(hex.slice(1), 16);\n    const r = ((n >> 16) & 255) / 255, g = ((n >> 8) & 255) / 255, b = (n & 255) / 255;\n    const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2;\n    let h = 0, s = 0;\n    if (mx !== mn) {\n      const d = mx - mn;\n      s = l > 0.5 ? d / (2 - mx - mn) : d / (mx + mn);\n      if (mx === r) h = (g - b) / d + (g < b ? 6 : 0);\n      else if (mx === g) h = (b - r) / d + 2;\n      else h = (r - g) / d + 4;\n      h *= 60;\n    }\n    return [h, s * 100, l * 100];\n  }\n  function lum(hex) {\n    const n = parseInt(hex.slice(1), 16);\n    const c = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map(v => {\n      v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);\n    });\n    return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];\n  }\n  /* Accepts #rgb, #rrggbb, or three numbers, so a value can be pasted in from\n     anywhere without reformatting it first. */\n  function parseColor(str) {\n    if (!str) return null;\n    let s = String(str).trim().toLowerCase();\n    const m = s.match(/^#?([0-9a-f]{3})$/);\n    if (m) return '#' + m[1].split('').map(c => c + c).join('');\n    const m6 = s.match(/^#?([0-9a-f]{6})$/);\n    if (m6) return '#' + m6[1];\n    const nums = s.replace(/rgba?|[()]/g, '').split(/[,\\s]+/).filter(Boolean).map(Number);\n    if (nums.length >= 3 && nums.slice(0, 3).every(n => n >= 0 && n <= 255)) {\n      return '#' + nums.slice(0, 3).map(n => Math.round(n).toString(16).padStart(2, '0')).join('');\n    }\n    return null;\n  }\n\n  /* One params object in, one full palette out. Suggestions and the live panel\n     both go through here so a preview can never drift from what applying it does. */\n  function palette(p) {\n    const base = p.hue * SD, d = p.spr * SD, opp = p.opp * SD;\n    let h1, h3, h2, h4, hBg;\n    if (p.mode === 'analog') {\n      // One arc, four stops. Hue does almost no separating work here, so the\n      // pull and push pairs lean entirely on the value split.\n      h1 = base; h3 = base + d; h2 = base + 2 * d; h4 = base + 3 * d;\n      hBg = base + 1.5 * d;\n    } else if (p.mode === 'triad') {\n      hBg = base; h1 = base + 120; h3 = base + 120 + d; h2 = base + 240; h4 = base + 240 + d;\n    } else {\n      h1 = base; h3 = base + d; h2 = base + opp; h4 = base + opp + d;\n      hBg = base + opp;\n    }\n    const autoBg = hsl2hex(hBg, p.bgS * (p.bgL > 50 ? 0.5 : 1), p.bgL);\n    const bg = p.bgHex || autoBg;\n    const autoAmb = lum(bg) > 0.45 ? '#000000' : '#ffffff';\n    return {\n      bg, glyph: bg,\n      p1: hsl2hex(h1, p.satA, p.litA),\n      p3: hsl2hex(h3, p.satA, Math.max(8, p.litA - 12)),\n      p2: hsl2hex(h2, p.satB, p.litB),\n      p4: hsl2hex(h4, p.satB, Math.max(8, p.litB - 9)),\n      sil: p.ambHex || autoAmb,\n      silAlpha: p.amb / 100,\n      silAlpha2: (p.amb2 === undefined ? 50 : p.amb2) / 100,\n      autoBg, autoAmb,\n      angles: { p1: h1, p3: h3, p2: h2, p4: h4, bg: hBg }\n    };\n  }\n\n  // ── wheel ───────────────────────────────────────────────────────────────\n  const wheel = document.getElementById('harmWheel');\n  const wctx = wheel.getContext('2d');\n  /* The rail is a resizable column, so the wheel takes its size from whatever\n     width it is handed rather than a fixed one. */\n  let WS = 190, RO = 78, RI = 52;\n  /* Ring geometry: same mid radius, band 30% thinner than it was. */\n  const RING_BAND = 0.135 * 0.7;   // thickness as a share of the canvas\n  function sizeWheel() {\n    const host = document.getElementById('harmWheelWrap');\n    const avail = (host && host.clientWidth) ? host.clientWidth : 190;\n    WS = Math.max(104, Math.min(210, Math.round(avail)));\n    /* The ring is sized from the outside in: a marker sits a full diameter\n       past the outer edge, so the ring gives that room back before taking its\n       own. Otherwise a marker clipped whenever the hue put it at the top or\n       the side, which is exactly where it lands most often. */\n    const clear = MARK_D + 7;\n    RO = Math.max(24, WS / 2 - clear);\n    RI = Math.max(12, RO - WS * RING_BAND);\n    const dpr = window.devicePixelRatio || 1;\n    wheel.style.width = WS + 'px'; wheel.style.height = WS + 'px';\n    wheel.width = WS * dpr; wheel.height = WS * dpr;\n    wctx.setTransform(dpr, 0, 0, dpr, 0, 0);\n  }\n  window.addEventListener('resize', () => { sizeWheel(); drawWheel(palette(H)); });\n  const pt = (ang, r) => [WS / 2 + r * Math.cos((ang - 90) * Math.PI / 180), WS / 2 + r * Math.sin((ang - 90) * Math.PI / 180)];\n  /* Marker discs match the particle swatches in the rail: same diameter, same\n     idea. The number goes inside, in whichever of black or white reads. */\n  const MARK_D = 15.2;\n  const markR = () => MARK_D / 2;\n  function drawWheel(pal) {\n    const cx = WS / 2, cy = WS / 2;\n    wctx.clearRect(0, 0, WS, WS);\n    // Twenty wedges forming one ring, hairline gaps between them.\n    for (let i = 0; i < STEPS; i++) {\n      const a0 = (i * SD - 90 - SD / 2) * Math.PI / 180;\n      const a1 = (i * SD - 90 + SD / 2) * Math.PI / 180;\n      wctx.beginPath();\n      wctx.arc(cx, cy, RO, a0 + 0.008, a1 - 0.008);\n      wctx.arc(cx, cy, RI, a1 - 0.008, a0 + 0.008, true);\n      wctx.closePath();\n      wctx.fillStyle = hsl2hex(i * SD, H.sat, 50);\n      wctx.fill();\n    }\n    // Tie lines: the relationship, drawn. Complementary reads as one axis,\n    // triadic as a triangle, analogous as a fan.\n    wctx.save();\n    wctx.strokeStyle = 'rgba(255,255,255,0.24)'; wctx.lineWidth = 0.5;\n    wctx.beginPath();\n    if (H.mode === 'triad') {\n      const a = pt(pal.angles.bg, RI - 6), b = pt(pal.angles.p1, RI - 6), c = pt(pal.angles.p2, RI - 6);\n      wctx.moveTo(a[0], a[1]); wctx.lineTo(b[0], b[1]); wctx.lineTo(c[0], c[1]); wctx.closePath();\n    } else {\n      [['p1', 'p2'], ['p3', 'p4']].forEach(([u, v]) => {\n        const a = pt(pal.angles[u], RI - 6), b = pt(pal.angles[v], RI - 6);\n        wctx.moveTo(a[0], a[1]); wctx.lineTo(b[0], b[1]);\n      });\n    }\n    wctx.stroke();\n    wctx.restore();\n\n    const marks = [\n      { a: pal.angles.p1, c: pal.p1, t: '1' },\n      { a: pal.angles.p3, c: pal.p3, t: '3' },\n      { a: pal.angles.p2, c: pal.p2, t: '2' },\n      { a: pal.angles.p4, c: pal.p4, t: '4' }\n    ];\n    // In triadic the ground is a member of the scheme, so it gets a marker too.\n    if (H.mode === 'triad' && !H.bgHex) marks.push({ a: pal.angles.bg, c: pal.bg, t: 'b' });\n    /* Colour and label, stacked: the dot sits just outside the ring, its\n       number just outside that, so neither has to be read through the other. */\n    marks.forEach(m => {\n      const r = markR();\n      const [x, y] = pt(m.a, RO + r + 4);\n      wctx.beginPath(); wctx.arc(x, y, r, 0, Math.PI * 2);\n      wctx.fillStyle = m.c; wctx.fill();\n      wctx.fillStyle = lum(m.c) > 0.5 ? '#000000' : '#ffffff';\n      wctx.font = '8px ui-monospace, monospace';\n      wctx.textAlign = 'center'; wctx.textBaseline = 'middle';\n      wctx.fillText(m.t, x, y + 0.5);\n    });\n\n    wctx.beginPath(); wctx.arc(cx, cy, RI - 10, 0, Math.PI * 2);\n    wctx.fillStyle = pal.bg; wctx.fill();\n    wctx.strokeStyle = 'rgba(255,255,255,0.12)'; wctx.lineWidth = 0.5; wctx.stroke();\n  }\n  function wheelPick(ev) {\n    const r = wheel.getBoundingClientRect();\n    const x = ev.clientX - r.left - WS / 2, y = ev.clientY - r.top - WS / 2;\n    let ang = Math.atan2(y, x) * 180 / Math.PI + 90;\n    ang = ((ang % 360) + 360) % 360;\n    H.hue = Math.round(ang / SD) % STEPS;\n    sync(); buildSug(); push();\n  }\n  let wheelDrag = false;\n  wheel.addEventListener('mousedown', e => { wheelDrag = true; wheelPick(e); });\n  window.addEventListener('mousemove', e => { if (wheelDrag) wheelPick(e); });\n  window.addEventListener('mouseup', () => { wheelDrag = false; });\n\n  // ── mini specimen: 3x3 diamond glyph, drawn as particles ────────────────\n  const MW = 98, MH = 112, MPTS = 900;\n  const MINI_CACHE = {};\n  function miniInk(ch) {\n    if (MINI_CACHE[ch]) return MINI_CACHE[ch];\n    const data = GLYPH_DATA[ch];\n    const oc = document.createElement('canvas');\n    oc.width = MW; oc.height = MH;\n    const o = oc.getContext('2d');\n    const G = 3, PAD = MW * 0.15, cell = (MW - PAD * 2) / G, HT = cell / 2, ir = HT / Math.SQRT2;\n    const top = (MH - cell * G) / 2;\n    const sh = {};\n    data.c.forEach(i => sh[i] = { N: false, E: false, S: false, W: false });\n    const cs = new Set(data.c);\n    data.c.forEach(i => {\n      const r = Math.floor(i / G), c = i % G;\n      if (c < G - 1 && cs.has(i + 1)) { sh[i].E = true; sh[i + 1].W = true; }\n      if (cs.has(i + G) && Math.floor((i + G) / G) === r + 1) { sh[i].S = true; sh[i + G].N = true; }\n    });\n    o.fillStyle = '#fff';\n    data.c.forEach(idx => {\n      const row = Math.floor(idx / G), col = idx % G;\n      const cx = PAD + col * cell + cell / 2, cy = top + row * cell + cell / 2, s = sh[idx];\n      const corners = [\n        { sharp: s.N, tip: [cx, cy - HT], a1: -3 * Math.PI / 4, a2: -Math.PI / 4 },\n        { sharp: s.E, tip: [cx + HT, cy], a1: -Math.PI / 4, a2: Math.PI / 4 },\n        { sharp: s.S, tip: [cx, cy + HT], a1: Math.PI / 4, a2: 3 * Math.PI / 4 },\n        { sharp: s.W, tip: [cx - HT, cy], a1: 3 * Math.PI / 4, a2: 5 * Math.PI / 4 }\n      ];\n      o.beginPath(); let started = false;\n      for (let i = 0; i < 4; i++) {\n        const { sharp, tip, a1, a2 } = corners[i];\n        if (sharp) {\n          if (!started) { o.moveTo(tip[0], tip[1]); started = true; } else o.lineTo(tip[0], tip[1]);\n        } else {\n          const rr = Math.max(1, ir);\n          const sx = cx + rr * Math.cos(a1), sy = cy + rr * Math.sin(a1);\n          if (!started) { o.moveTo(sx, sy); started = true; } else o.lineTo(sx, sy);\n          o.arc(cx, cy, rr, a1, a2, false);\n        }\n      }\n      o.closePath(); o.fill();\n    });\n    const px = o.getImageData(0, 0, MW, MH).data;\n    // Fixed point set, so previews differ by color alone and not by noise.\n    const pts = [];\n    let guard = 0;\n    while (pts.length < MPTS && guard < 200000) {\n      guard++;\n      const x = Math.random() * MW, y = Math.random() * MH;\n      if (px[((y | 0) * MW + (x | 0)) * 4 + 3] > 128) pts.push([x, y]);\n    }\n    return (MINI_CACHE[ch] = pts);\n  }\n  function drawMini(cv, pal, ch) {\n    const dpr = window.devicePixelRatio || 1;\n    cv.style.width = '100%'; cv.style.height = 'auto';\n    cv.width = MW * dpr; cv.height = MH * dpr;\n    const c = cv.getContext('2d');\n    c.setTransform(dpr, 0, 0, dpr, 0, 0);\n    c.fillStyle = pal.bg; c.fillRect(0, 0, MW, MH);\n    const pts = miniInk(ch);\n    const n = pts.length;\n    const groups = [\n      { col: pal.sil, alpha: pal.silAlpha, from: 0,             to: n * 0.38 },\n      { col: pal.p2,  alpha: 1,            from: n * 0.38,      to: n * 0.55 },\n      { col: pal.p4,  alpha: 1,            from: n * 0.55,      to: n * 0.72 },\n      { col: pal.p1,  alpha: 1,            from: n * 0.72,      to: n * 0.88 },\n      { col: pal.p3,  alpha: 1,            from: n * 0.88,      to: n }\n    ];\n    groups.forEach(g => {\n      c.globalAlpha = g.alpha;\n      c.fillStyle = g.col;\n      c.beginPath();\n      for (let i = Math.floor(g.from); i < g.to && i < n; i++) {\n        const p = pts[i];\n        c.moveTo(p[0] + 0.85, p[1]); c.arc(p[0], p[1], 0.85, 0, Math.PI * 2);\n      }\n      c.fill();\n    });\n    c.globalAlpha = 1;\n  }\n\n  /* ── Suggestions ──────────────────────────────────────────────────────────\n     Nine per model, all holding the current hue and varying the relationship,\n     so the grid answers one question instead of showing nine random palettes.\n     Move the hue and the whole grid re-rolls around the new anchor. */\n  const ARCH = {\n    comp: [\n      { nm: 'comp',    p: { opp: 10, spr: 1, satA: 74, litA: 70, satB: 62, litB: 40, bgL: 3,  bgS: 18, amb: 22 } },\n      { nm: 'split',   p: { opp: 8,  spr: 2, satA: 78, litA: 66, satB: 58, litB: 44, bgL: 4,  bgS: 22, amb: 20 } },\n      { nm: 'square',  p: { opp: 5,  spr: 5, satA: 70, litA: 68, satB: 66, litB: 46, bgL: 3,  bgS: 12, amb: 24 } },\n      { nm: 'tight',   p: { opp: 10, spr: 0, satA: 82, litA: 72, satB: 70, litB: 36, bgL: 2,  bgS: 24, amb: 18 } },\n      { nm: 'wide',    p: { opp: 10, spr: 3, satA: 66, litA: 74, satB: 54, litB: 42, bgL: 5,  bgS: 14, amb: 26 } },\n      { nm: 'muted',   p: { opp: 10, spr: 1, satA: 34, litA: 76, satB: 26, litB: 40, bgL: 6,  bgS: 10, amb: 30 } },\n      { nm: 'ink',     p: { opp: 10, spr: 1, satA: 96, litA: 62, satB: 88, litB: 30, bgL: 1,  bgS: 30, amb: 14 } },\n      { nm: 'lift',    p: { opp: 9,  spr: 2, satA: 58, litA: 86, satB: 72, litB: 34, bgL: 3,  bgS: 16, amb: 28 } },\n      { nm: 'paper',   p: { opp: 10, spr: 1, satA: 62, litA: 34, satB: 54, litB: 52, bgL: 92, bgS: 12, amb: 26 } }\n    ],\n    analog: [\n      { nm: 'close',   p: { spr: 1, satA: 72, litA: 74, satB: 64, litB: 38, bgL: 3,  bgS: 20, amb: 22 } },\n      { nm: 'open',    p: { spr: 2, satA: 70, litA: 76, satB: 62, litB: 36, bgL: 4,  bgS: 18, amb: 22 } },\n      { nm: 'fan',     p: { spr: 3, satA: 68, litA: 72, satB: 60, litB: 40, bgL: 4,  bgS: 16, amb: 24 } },\n      { nm: 'wash',    p: { spr: 4, satA: 60, litA: 78, satB: 52, litB: 42, bgL: 6,  bgS: 14, amb: 28 } },\n      { nm: 'near',    p: { spr: 0, satA: 80, litA: 78, satB: 78, litB: 32, bgL: 2,  bgS: 26, amb: 18 } },\n      { nm: 'ember',   p: { spr: 2, satA: 92, litA: 64, satB: 84, litB: 28, bgL: 1,  bgS: 34, amb: 14 } },\n      { nm: 'dusk',    p: { spr: 3, satA: 40, litA: 70, satB: 34, litB: 34, bgL: 7,  bgS: 22, amb: 30 } },\n      { nm: 'chalk',   p: { spr: 2, satA: 26, litA: 84, satB: 22, litB: 44, bgL: 5,  bgS: 8,  amb: 34 } },\n      { nm: 'sheet',   p: { spr: 2, satA: 66, litA: 32, satB: 58, litB: 54, bgL: 93, bgS: 10, amb: 26 } }\n    ],\n    triad: [\n      { nm: 'triad',   p: { spr: 1, satA: 72, litA: 70, satB: 64, litB: 42, bgL: 10, bgS: 46, amb: 22 } },\n      { nm: 'deep',    p: { spr: 1, satA: 78, litA: 68, satB: 70, litB: 38, bgL: 6,  bgS: 60, amb: 18 } },\n      { nm: 'lit',     p: { spr: 2, satA: 68, litA: 78, satB: 60, litB: 44, bgL: 16, bgS: 38, amb: 26 } },\n      { nm: 'flat',    p: { spr: 0, satA: 70, litA: 66, satB: 66, litB: 40, bgL: 12, bgS: 30, amb: 20 } },\n      { nm: 'poster',  p: { spr: 1, satA: 94, litA: 62, satB: 88, litB: 34, bgL: 14, bgS: 74, amb: 16 } },\n      { nm: 'soft',    p: { spr: 2, satA: 40, litA: 76, satB: 34, litB: 44, bgL: 12, bgS: 24, amb: 30 } },\n      { nm: 'shade',   p: { spr: 3, satA: 66, litA: 72, satB: 58, litB: 36, bgL: 8,  bgS: 40, amb: 24 } },\n      { nm: 'clay',    p: { spr: 1, satA: 54, litA: 74, satB: 46, litB: 40, bgL: 22, bgS: 28, amb: 28 } },\n      { nm: 'field',   p: { spr: 1, satA: 60, litA: 34, satB: 54, litB: 52, bgL: 86, bgS: 30, amb: 26 } }\n    ]\n  };\n  const SHOW_SUGGESTIONS = false;\n  function buildSug() {\n    if (!SHOW_SUGGESTIONS) return;\n    const host = document.getElementById('harmSug');\n    host.innerHTML = '';\n    document.getElementById('harmSugLabel').textContent = 'suggestions · ' + H.mode;\n    ARCH[H.mode].forEach(arch => {\n      // Suggestions always show the model, never a manual override.\n      const p = Object.assign({ mode: H.mode, hue: H.hue, opp: 10, bgHex: null, ambHex: null }, arch.p);\n      const pal = palette(p);\n      const btn = document.createElement('button');\n      btn.className = 'sug'; btn.title = arch.nm;\n      const cv = document.createElement('canvas');\n      btn.appendChild(cv);\n      const nm = document.createElement('div');\n      nm.className = 'nm'; nm.textContent = arch.nm;\n      btn.appendChild(nm);\n      btn.onclick = () => { Object.assign(H, p); sync(); buildSug(); push(); };\n      host.appendChild(btn);\n      drawMini(cv, pal, 'a');\n    });\n  }\n\n  // ── panel plumbing ──────────────────────────────────────────────────────\n  const BIND = [\n    ['hmHue', 'hue', 'hmHueV', v => v + '/20'],\n    ['hmSat', 'sat', 'hmSatV', v => v + '%'],\n    ['hmSpr', 'spr', 'hmSprV', v => (v * SD) + '°'],\n    ['hmOpp', 'opp', 'hmOppV', v => (v * SD) + '°'],\n    ['hmSatA', 'satA', 'hmSatAV', v => v + '%'],\n    ['hmLitA', 'litA', 'hmLitAV', v => v + '%'],\n    ['hmSatB', 'satB', 'hmSatBV', v => v + '%'],\n    ['hmLitB', 'litB', 'hmLitBV', v => v + '%'],\n    ['hmBgL', 'bgL', 'hmBgLV', v => v + '%'],\n    ['hmBgS', 'bgS', 'hmBgSV', v => v + '%'],\n    ['hmAmb', 'amb', 'hmAmbV', v => v + '%'],\n    ['hmAmb2', 'amb2', 'hmAmb2V', v => v + '%'],\n    ['hmPullA', 'pullA', 'hmPullAV', v => v + '%'],\n    ['hmPushA', 'pushA', 'hmPushAV', v => v + '%']\n  ];\n  BIND.forEach(([id, key, vid, fmt]) => {\n    document.getElementById(id).addEventListener('input', e => {\n      H[key] = +e.target.value;\n      document.getElementById(vid).textContent = fmt(H[key]);\n      // Touching the ground sliders means the model owns it again.\n      if (key === 'bgL' || key === 'bgS') H.bgHex = null;\n      /* One saturation for both pairs. The push pair keeps a small step down,\n         which is the same relationship the two sliders used to hold by hand. */\n      if (key === 'sat') { H.satA = H.sat; H.satB = Math.round(H.sat * 0.92); }\n      if (key === 'pullA' || key === 'pushA') { /* palette only, no hue work */ }\n      sync(); push();\n    });\n  });\n  document.querySelectorAll('#harmModes button').forEach(b => {\n    b.addEventListener('click', () => {\n      H.mode = b.dataset.m;\n      if (H.mode === 'analog' && H.spr === 0) H.spr = 2;\n      if (H.mode === 'triad' && H.bgL < 6 && !H.bgHex) { H.bgL = 10; H.bgS = 46; }\n      sync(); buildSug(); push();\n    });\n  });\n\n  function bindHex(pickId, textId, autoId, key) {\n    const pick = document.getElementById(pickId), txt = document.getElementById(textId), auto = document.getElementById(autoId);\n    /* The native colour input is hidden behind a plain circle. Rounding the\n       control itself never held: it paints its own inner swatch, and browsers\n       disagree about whether that swatch takes a radius. A span always does. */\n    const dot = document.getElementById(pickId.replace('Pick', 'Dot'));\n    if (dot) {\n      const paint = () => { dot.style.background = pick.value; };\n      pick.addEventListener('input', paint);\n      pick.addEventListener('change', paint);\n      paint();\n    }\n    pick.addEventListener('input', () => { H[key] = pick.value; txt.value = pick.value; sync(); push(); });\n    txt.addEventListener('input', () => {\n      const c = parseColor(txt.value);\n      if (c) { H[key] = c; pick.value = c; push(); }\n    });\n    txt.addEventListener('blur', () => sync( ────────────────────────────────────────────────────\n  const SPOTS = [[3.5, 3.5], [13.5, 3.5], [3.5, 13.5], [13.5, 13.5]];\n  function buildLib() {\n    const host = document.getElementById('harmLib');\n    host.innerHTML = '';\n    THEMES.forEach((t, k) => {\n      const b = document.createElement('button');\n      b.className = 'chip' + (k === currentTheme ? ' on' : '');\n      b.title = t.name || ('theme ' + (k + 1));\n      b.style.background = t.bg;\n      const dots = themeDots(t);\n      b.dataset.n = dots.length;\n      dots.forEach(col => {\n        const dot = document.createElement('i');\n        dot.style.background = col;\n        b.appendChild(dot);\n      });\n      b.onclick = () => { applyTheme(k, true); rebuildAll(); pull(); };\n      host.appendChild(b);\n    });\n    const add = document.createElement('button');\n    add.className = 'add'; add.textContent = '+'; add.title = 'New theme from the current colors';\n    add.onclick = () => addTheme();\n    host.appendChild(add);\n    const nameEl = document.getElementById('harmName');\n    if (document.activeElement !== nameEl) nameEl.value = THEMES[currentTheme].name || '';\n    document.getElementById('harmTitle').textContent = 'harmony · ' + (currentTheme + 1) + '/' + THEMES.length;\n  }\n  /* The dock paints its swatch dots once at build time, so both the colors and\n     the number of swatches need rebuilding when the library changes. */\n  function rebuildDock() {\n    const sw = document.getElementById('dockThemes');\n    if (!sw) return;\n    sw.innerHTML = '';\n    THEMES.forEach((t, k) => {\n      const b = document.createElement('button');\n      b.className = 'dock-swatch' + (k === currentTheme ? ' on' : '');\n      b.title = t.name || ('theme ' + (k + 1));\n      [t.pt, t.fill, t.tert, t.quat].forEach((col, n) => {\n        const dot = document.createElement('i');\n        dot.style.background = col;\n        dot.style.left = [3.5, 11.5, 3.5, 11.5][n] + 'px';\n        dot.style.top = [3.     u.fitField();
  });

  /* One clock, two documents. The panel gates its own caret on the same
     expression against the same wall clock, so the bar and the type blink on
     the same beat without either one being told when to start. */
  setInterval(() => {
    const on = (Date.now() % 1060) < 560 ? '1' : '0';
    units.forEach(u => { u.caret.style.opacity = on; });
  }, 40);

  window.addEventListener('load', () => units.forEach(u => u.fitField()));
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(() => units.forEach(u => u.fitField()));
  }

  function glyphsOf(t) { return String(t || '').split('\n').join('').toUpperCase(); }

  function unitBySource(src) {
    return units.find(u => { try { return u.el.contentWindow === src; } catch (e) { return null; } });
  }

  window.addEventListener('message', e => {
    const d = e.data;
    if (!d) return;
    /* The studio's preview posts live values in; a standalone file never
       receives this and behaves exactly as before. */
    if (d.t === 'hg26host') { units.forEach(u => u.send({ state: d.state })); return; }
    if (d.t === 'hg26ready') {
      const u = unitBySource(e.source) || units.find(x => x.set === d.set);
      if (!u) return;
      u.send({ text: u.text || PANEL_SEED, rev: u.rev });
      /* Two messages, because the panel's inbound path answers one thing per
         message. The colour goes second so it lands on the text it dresses. */
      u.send({ pal: u.custom || u.palette() });
      return;
    }
    if (d.t === 'hg26shot') {
      const u = units.find(x => x.set === d.set) || unitBySource(e.source);
      if (!u) return;
      const img = new Image();
      img.onload = () => { u.shot = { img: img, w: d.w, h: d.h }; };
      img.src = d.data;
      return;
    }
    if (d.t === 'hg26text') {
      /* A panel edited in place. Its own bar follows it, and only its own: the
         sets are independent now, so an edit in one is not an edit in both.
         The bar wins only while it is the thing being typed into. */
      const u = units.find(x => x.set === d.set) || unitBySource(e.source);
      if (!u) return;
      if (document.activeElement === u.field) return;
      /* The echo arrives already wrapped, and a wrap and a break look the same
         once they are both newlines, so the letters are compared flat. If they
         match, this is the panel restating what it was sent and the breaks the
         visitor asked for are left alone. */
      let flat = String(d.text || '').split('\n').join('');
      if (flat.toUpperCase() === glyphsOf(u.text)) return;
      const raw = clamp(flat);
      const next = lay(raw).join('\n').toUpperCase();
      if (next === u.text) return;
      u.text = next;
      u.rev++;
      u.field.value = shown(raw);
      u.fitField();
      writeHash();
      return;
    }
  });

  units.forEach(u => {
    const cfg = '<scr' + 'ipt>window.__HG26_PANEL=' +
                JSON.stringify({ set: u.set, text: u.text || PANEL_SEED,
                                 pal: u.custom || u.palette(), ui: false, share: false, cap: CAP }) +
                ';</scr' + 'ipt>';
    u.el.srcdoc = PANEL_HTML.replace('<head>', '<head>' + cfg);
  });
})();
</script>
</body>
</html>
