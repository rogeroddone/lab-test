<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HG26 5X5 10X10</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root { --gutter: 12px; --radius: 4px; }
/* One gutter everywhere: page edge to bar, bar to panel, panel to the next
   set's bar, panel to page edge. The panels take equal shares of what is left. */
body {
  background: #000; height: 100vh; width: 100vw; overflow: hidden;
  padding: var(--gutter) 0 0;
  display: flex; flex-direction: column; gap: 0;
  font-family: 'Aeonik Fono', 'Helvetica Neue', Helvetica, Arial, sans-serif;
}
/* A set is its controls and its canvas, kept together. Two sets are two of
   these, not one bar trying to speak for both. */
.unit {
  flex: 1 1 0; min-height: 0; min-width: 0;
  display: flex; flex-direction: column;
}
/* One rule across the full width between sets, so the stack reads as one
   thing divided rather than two boxes set apart. */
.unit + .unit { border-top: 1px solid #2a2a2a; padding-top: var(--gutter); }
.panel {
  position: relative; flex: 1 1 0; min-width: 0; min-height: 0;
  overflow: hidden; background: #000;
}
.panel iframe { display: block; width: 100%; height: 100%; border: 0; }

/* Control bar. One per set, sitting above the type it drives. */
.bar {
  flex: 0 0 auto; display: flex; align-items: center; justify-content: center;
  gap: 8px; margin-bottom: var(--gutter);
}
/* The set name is a control-bar item now, not a sticker in the corner of the
   canvas: same height, same case, same grey as the labels beside it, so the
   row reads as one line rather than a label floating over artwork. */
.bar .tag {
  display: inline-flex; align-items: center; height: 28px;
  font-size: 11.5px; letter-spacing: 0.06em; text-transform: uppercase;
  color: #8a8a8a; white-space: nowrap; user-select: none; pointer-events: none;
}
/* One treatment across the bar: near black fill, one hairline, the same small
   corner. The field is not a pill and the actions are not circles; they are
   the same control at three widths. */
.fieldWrap, .acts button {
  background: #111; border: 0.5px solid #2a2a2a; border-radius: 3px;
}
/* No padding here. It sits on the input instead, so every pixel inside this
   box belongs to the field: a selection drag beginning beside the type starts
   in the input rather than on this wrapper. */
.fieldWrap {
  position: relative;
  cursor: text;
  height: 28px; padding: 0; display: flex; align-items: center; gap: 0;
  max-width: 62vw;
}
.fieldWrap:focus-within { border-color: #444; }

/* The note sits after the type, so it reads as an aside rather than a prompt.
   Clicks pass through it to the wrap, which puts focus back in the field. */
.flabel {
  margin-left: -32px; margin-right: 14px;
  color: #5a5a5a; font-size: 11.5px; letter-spacing: 0.06em;
  white-space: nowrap; user-select: none; pointer-events: none;
}
.flabel:empty { display: none; margin: 0; }
/* Both insets always. The inset is hit area, not spacing: it is what makes a
   press beside the type land inside the field rather than on the wrap. */
.field {
  width: 60px; min-width: 0; height: 100%; padding: 0 44px 0 14px;
  background: none; border: none; border-radius: 0;
  color: #fff; font-family: inherit; font-size: 11.5px; letter-spacing: 0.06em;
  text-transform: uppercase; text-align: left; outline: none;
}
.field::placeholder { color: #5a5a5a; text-transform: uppercase; }
/* Stands in for the real caret while the field is unfocused, so it is clear
   the copy on screen is something you can type over. Taken out of the flow and
   placed against the end of the word by script. */
/* No CSS animation. A keyframe starts whenever its element is laid out, and
   the panel is a separate document that lays out at a different moment, so two
   animations at the same duration still drift apart by whatever gap there was
   between the two loads. Both are driven from the wall clock instead, which is
   the one thing the two documents already share. */
.caret {
  position: absolute; top: 50%; transform: translateY(-50%);
  width: 1.5px; height: 13px; background: #fff;
}
.fieldWrap:focus-within .caret { display: none; }
/* The palette is generated, not picked from a shelf. Its three controls sit in
   one tray rather than loose in the bar, so they read as a single thing that
   makes a colour: where on the wheel it starts, how far it opens, and how its
   members are distributed across that opening. */
.sw {
  display: flex; flex-wrap: nowrap; align-items: center; gap: 10px;
  height: 28px; padding: 0 12px;
  background: #111; border: 0.5px solid #2a2a2a; border-radius: 3px;
}
/* The control is the line itself. The box around it is only there to be
   grabbed: 12px tall so it can be hit, transparent so all that reads is a
   2px rule carrying the colour. Both strips share it, so they align. */
.strip {
  position: relative; height: 12px; cursor: pointer;
  flex: none; touch-action: none;
}
.strip .line {
  position: absolute; left: 0; right: 0; top: 50%; height: 1.6px;
  transform: translateY(-50%); border-radius: 0.8px; pointer-events: none;
}
/* The wheel, cut at red and laid flat. */
.hue { width: 99px; }
.hue .line {
  background: linear-gradient(90deg, #f00 0%, #ff0 16.66%, #0f0 33.33%,
    #0ff 50%, #00f 66.66%, #f0f 83.33%, #f00 100%);
}
/* Painted by script with the palette it is producing, so the track shows the
   result rather than naming it. */
.spread { width: 57px; }
.knob {
  position: absolute; top: 50%; width: 10px; height: 10px; border-radius: 50%;
  transform: translate(-50%, -50%); pointer-events: none; background: #fff;
}
.models { display: flex; gap: 12px; flex: none; }
/* No container: the choice is the word itself. Grey while it is one of the
   options, white once it is the one in use, which is the same signal the field
   beside it uses for its rule and its value. */
.models button {
  height: 20px; padding: 0; border-radius: 0; cursor: pointer;
  white-space: nowrap; background: none; border: none;
  color: #5a5a5a; font-family: inherit; font-size: 10px;
  letter-spacing: 0.06em; text-transform: uppercase;
}
.models button:hover { color: #8a8a8a; }
.models button.on { color: #fff; }
.models button.on:hover { color: #fff; }
/* The field is measured, not fixed: a mirror span holds the same text in the
   same face, and the field takes its width. Off screen, never read aloud. */
.mirror {
  position: absolute; visibility: hidden; white-space: pre; pointer-events: none;
  font-family: inherit; font-size: 11.5px; letter-spacing: 0.06em;
  text-transform: uppercase;
}
.acts { display: flex; align-items: center; gap: 6px; }
.acts button {
  width: 28px; height: 28px; padding: 0; color: #9a9a9a;
  cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
}
.acts button:hover { color: #fff; border-color: #444; }
.acts svg { width: 15px; height: 15px; }
</style>
</head>
<body>
<div class="unit" id="u5">
  <div class="bar">
    <span class="tag">5x5</span>
    <div class="fieldWrap">
      <input class="field" type="text" spellcheck="false" autocomplete="off"
             placeholder="Type here">
      <span class="caret" aria-hidden="true"></span>
      <span class="flabel"></span>
    </div>
    <span class="mirror" aria-hidden="true"></span>
    <div class="sw">
      <div class="models"></div>
      <div class="hue strip" title="Base hue"><i class="line"></i><i class="knob"></i></div>
      <div class="spread strip" title="Spread"><i class="line"></i><i class="knob"></i></div>
    </div>
    <div class="acts">
      <button class="actShot" title="Download JPEG"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M8 2v8M4.5 7l3.5 3.5L11.5 7M2.5 13h11"/></svg></button>
      <button class="actLink" title="Copy link"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M6.5 9.5a2.6 2.6 0 0 0 3.7 0l2-2a2.6 2.6 0 0 0-3.7-3.7l-.9.9"/><path d="M9.5 6.5a2.6 2.6 0 0 0-3.7 0l-2 2a2.6 2.6 0 0 0 3.7 3.7l.9-.9"/></svg></button>
    </div>
  </div>
  <div class="panel" id="p5">
    <iframe id="f5" title="5x5"></iframe>
  </div>
</div>
<div class="unit" id="u10">
  <div class="bar">
    <span class="tag">10x10</span>
    <div class="fieldWrap">
      <input class="field" type="text" spellcheck="false" autocomplete="off"
             placeholder="Type here">
      <span class="caret" aria-hidden="true"></span>
      <span class="flabel"></span>
    </div>
    <span class="mirror" aria-hidden="true"></span>
    <div class="sw">
      <div class="models"></div>
      <div class="hue strip" title="Base hue"><i class="line"></i><i class="knob"></i></div>
      <div class="spread strip" title="Spread"><i class="line"></i><i class="knob"></i></div>
    </div>
    <div class="acts">
      <button class="actShot" title="Download JPEG"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M8 2v8M4.5 7l3.5 3.5L11.5 7M2.5 13h11"/></svg></button>
      <button class="actLink" title="Copy link"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M6.5 9.5a2.6 2.6 0 0 0 3.7 0l2-2a2.6 2.6 0 0 0-3.7-3.7l-.9.9"/><path d="M9.5 6.5a2.6 2.6 0 0 0-3.7 0l-2 2a2.6 2.6 0 0 0 3.7 3.7l.9-.9"/></svg></button>
    </div>
  </div>
  <div class="panel" id="p10">
    <iframe id="f10" title="10x10"></iframe>
  </div>
</div>
<script>
const PANEL_HTML = "<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script>/* Panel boot gate. A viewer shell injects __HG26_PANEL before this\nparses. Hiding the body here, before first paint, is what stops the editor\nUI flashing for the frames between paint and the late panel bootstrap. The\nstudio itself never has the flag and never takes the class. */\nif(window.__HG26_PANEL)document.documentElement.classList.add('hgpanel');<\/script>\n<style>html.hgpanel body{visibility:hidden}html.hgpanel body.panel{visibility:visible}<\/style>\n<link rel=\"stylesheet\" href=\"https://use.typekit.net/srq1kya.css\">\n<style>\n* { box-sizing: border-box; margin: 0; padding: 0; }\n\nbody {\n  background: #0a0a0a;\n  color: #eee;\n  font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;\n  overflow: hidden;\n  height: 100vh;\n  width: 100vw;\n  display: flex;\n  flex-direction: column;\n}\n\n/* ── Overlay UI (always visible) ─────────────────────────────────────────── */\n#overlay {\n  position: absolute;\n  top: 0; left: 0; right: 0;\n  display: flex;\n  align-items: flex-start;\n  justify-content: center;\n  padding: 20px 24px;\n  pointer-events: none;\n  z-index: 20;\n}\n\n/* Expanded invisible hit area so the field is easy to land on */\n#inputWrap {\n  position: relative;\n  pointer-events: all;\n  padding: 12px 20px;\n  margin: -12px -20px;\n  cursor: text;\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  justify-content: center;\n}\n\n/* Particle field living inside the pill outline */\n#pillCanvas {\n  position: absolute;\n  pointer-events: none;\n  z-index: 0;\n}\n\n/* Contenteditable sitting inside the pill */\n#textInput {\n  pointer-events: all;\n  background: transparent;              /* particles live behind the text */\n  border: 1px solid transparent;        /* ring is drawn by particles now */\n  border-radius: 999px;\n  position: relative;\n  z-index: 1;\n  padding: 7px 16px;\n  color: #ffffff;\n  font-size: 13px;\n  font-family: 'neue-haas-grotesk-text', 'Helvetica Neue', Helvetica, Arial, sans-serif;\n  font-weight: 400;\n  line-height: 1.5;\n  outline: none;\n  width: calc(15ch + 32px);\n  min-height: calc(1 * 13px * 1.5 + 14px);\n  max-height: calc(5 * 13px * 1.5 + 14px);\n  overflow: hidden;\n  word-break: break-all;\n  white-space: pre-wrap;\n  caret-color: #ffffff;\n  text-align: center;\n  transition: background 0.25s ease, border-color 0.25s ease, filter 0.25s ease;\n}\n#textInput.light-bg {\n  color: #111111;\n  caret-color: #111111;\n}\n\n/* Pill brightens on approach */\n#inputWrap:hover #textInput { filter: brightness(1.15); }\n\n/* Ghost placeholder, clears on first keystroke */\n#textInput.is-empty::before {\n  content: var(--ph, 'try');\n  opacity: 0.4;\n  pointer-events: none;\n  transition: opacity 0.35s ease;\n}\n#textInput.is-empty.ph-out::before { opacity: 0; }\n\n/* Faux caret: blinks even when the field is not focused */\n#textInput::after {\n  content: '';\n  display: inline-block;\n  width: 1px;\n  height: 1em;\n  background: currentColor;\n  vertical-align: -0.16em;\n  margin-left: 1px;\n  animation: caretBlink 1.1s step-end infinite;\n}\n#textInput:focus::after { display: none; }\n\n@keyframes caretBlink {\n  0%, 49%   { opacity: 1; }\n  50%, 100% { opacity: 0; }\n}\n\n/* ── Actions: appear only once something has been typed ─────────────────── */\n#actions {\n  position: absolute;\n  bottom: 48px;\n  left: 50%;\n  transform: translateX(-50%);\n  display: flex;\n  align-items: center;\n  gap: 14px;\n  z-index: 20;\n  opacity: 0;\n  pointer-events: none;\n  transition: opacity 0.3s ease;\n}\n#actions.on { opacity: 1; pointer-events: all; }\n\n.action {\n  font-family: inherit;\n  font-size: 8px;\n  letter-spacing: 0.04em;\n  text-transform: lowercase;\n  color: rgba(255,255,255,0.35);\n  background: none;\n  border: none;\n  padding: 0;\n  cursor: pointer;\n  transition: color 0.15s;\n}\n.action:hover { color: rgba(255,255,255,0.9); }\n.action-sep {\n  width: 0.5px;\n  height: 8px;\n  background: rgba(255,255,255,0.15);\n}\nbody.light-theme .action { color: rgba(0,0,0,0.4); }\nbody.light-theme .action:hover { color: rgba(0,0,0,0.9); }\nbody.light-theme .action-sep { background: rgba(0,0,0,0.2); }\n\n/* ── Theme dots, bottom center ───────────────────────────────────────────── */\n#themes {\n  position: absolute;\n  bottom: 22px;\n  left: 50%;\n  transform: translateX(-50%);\n  pointer-events: all;\n  display: flex;\n  flex-direction: row;\n  align-items: center;\n  gap: 7.2px;\n  z-index: 20;\n}\n\n/* Invisible hit rectangle wrapping each group of 4 dots */\n.theme-group {\n  display: flex;\n  flex-direction: row;\n  align-items: center;\n  gap: 3.6px;\n  cursor: pointer;\n  padding: 4px 2px;      /* expands the clickable/hoverable area */\n  opacity: 0.3;           /* unselected: 50% - 20% = 30% */\n  transition: opacity 0.15s;\n}\n.theme-group:hover   { opacity: 0.6; }\n.theme-group.active  { opacity: 1; }\n\n.tdot {\n  width: 7.49px;\n  height: 7.49px;\n  border-radius: 50%;\n  border: 0.5px solid rgba(255,255,255,0.15);\n  flex-shrink: 0;\n  pointer-events: none;  /* clicks pass through to the group */\n}\n\n/* ── Controls panel (hidden by default, press C) ─────────────────────────── */\n#controls {\n  position: absolute;\n  top: 50%; left: 24px;\n  transform: translateY(-50%);\n  background: none;\n  border: none;\n  padding: 0;\n  z-index: 21;\n  display: none;\n}\n#controls.visible {\n  display: flex;\n  flex-direction: column;\n  align-items: flex-start;\n  gap: 7px;\n}\n\n.ctrl {\n  display: flex;\n  align-items: center;\n  gap: 8px;\n  height: 12px;\n}\n.ctrl label {\n  font-size: 8px;\n  color: rgba(255,255,255,0.35);\n  white-space: nowrap;\n  text-transform: lowercase;\n  letter-spacing: 0.04em;\n  width: 46px;\n  flex-shrink: 0;\n}\n\n/* Hairline track, small dot thumb */\n.ctrl input[type=range] {\n  -webkit-appear l, #ctrlPane .edgrp label {\n  width: 84px !important; flex-shrink: 0; white-space: nowrap;\n}\n#ctrlPane .ctrl input[type=range], #ctrlPane .edgrp input[type=range] {\n  max-width: 100%;\n}\n#ctrlPane .ctrl .val, #ctrlPane .edgrp .edval { width: 34px !important; }\n#ctrlPane .ctrl, #ctrlPane .ctrl-toggle, #ctrlPane .ctrl-row { height: auto; min-height: 16px; }\n#ctrlPane .ctrl input[type=color] { width: 20px; height: 20px; }\n#ctrlPane .toggle-btn { width: 12px; height: 12px; }\n#ctrlPane .ctrl-separator { width: 48px; }\n/* pill input retired: type straight into the canvas */\n#overlay { display: none !important; }\n#actions { opacity: 1 !important; pointer-events: all !important; }\n\n.pane-title {\n  position: absolute; left: 16px; top: 14px; z-index: 12;\n  font-family: 'Aeonik Fono', monospace;\n  font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em;\n  color: #eee; pointer-events: none; user-select: none;\n}\n\n/* ── Bottom dock ───────────────────────────────────────────────────────── */\n#dock {\n  position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%);\n  z-index: 40; display: flex; align-items: center; gap: 6px;\n  padding: 3px 4px; border-radius: 999px;\n  background: #1c1c1c; border: 0.5px solid #2e2e2e;\n  font-family: 'Aeonik Fono', monospace;\n}\n#dock .dock-sep { width: 0.5px; height: 14px; background: #333; }\n#dock input#dockText {\n  width: 128px; height: 26px; padding: 0 11px;\n  border-radius: 999px; border: none; background: #111;\n  color: #eee; font-family: inherit; font-size: 10px; letter-spacing: 0.06em;\n  text-transform: uppercase; outline: none;\n}\n#dock input#dockText::placeholder { color: #6a6a6a; text-transform: uppercase; }\n#dock .dock-seg { display: flex; gap: 3px; }\n#dock .dock-seg button {\n  height: 26px; padding: 0 11px; border-radius: 999px; cursor: pointer;\n  border: none; background: #111; color: #8a8a8a;\n  font-family: inherit; font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase;\n}\n#dock .dock-seg button.on { background: #efefef; color: #111; }\n/* The way out of a preview. It only exists while a preview is up, so the two\n   set buttons read as one pair until there is something to close. */\n#dock .dock-seg button.seg-close {\n  width: 26px; padding: 0; color: #b9b9b9;\n  display: none; align-items: center; justify-content: center;\n}\n#dock .dock-seg button.seg-close.show { display: flex; }\n#dock .dock-seg button.seg-close:hover { color: #fff; background: #232323; }\n#dock .dock-seg button.seg-close svg { width: 11px; height: 11px; }\n#dock .dock-swatches { display: flex; gap: 4px; }\n/* The palette reads as its own particles: four dots on the theme's colours,\n   ringed when active, which is the only outline left in the bar. */\n#dock .dock-swatch {\n  width: 26px; height: 26px; border-radius: 999px; cursor: pointer; padding: 0;\n  border: 1.5px solid transparent; background: #111; position: relative;\n  box-sizing: border-box;\n}\n#dock .dock-swatch.on { border-color: #f2f2f2; }\n#dock .dock-swatch i {\n  position: absolute; width: 8px; height: 8px; border-radius: 50%; display: block;\n}\n#dock .dock-icon {\n  width: 26px; height: 26px; border-radius: 999px; cursor: pointer;\n  border: none; background: #111; color: #b9b9b9;\n  display: flex; align-items: center; justify-content: center; padding: 0;\n}\n#dock .dock-icon:hover { color: #fff; background: #232323; }\n#dock .dock-seg button:hover { color: #ddd; }\n#dock .dock-seg button.on:hover { color: #111; }\n#dock .dock-icon svg { width: 13px; height: 13px; }\n#ctrlHint { display: none; }\n\n/* ── Viewer mode: canvas only, chrome on a shortcut ───────────────────── */\nbody.viewer #edPane,\nbody.viewer #ctrlPane,\nbody.viewer .resizer { display: none !important; }\nbody.viewer #typePane { width: 100vw; }\nbody.viewer .pane-title { display: none; }\n\n/* The dock carries the set switch and the three actions. Nothing else. */\n#dockText, #dockSepText, #dockThemes, #dockSepThemes { display: none !important; }\n\n/* ── Panel mode: this page is one cell of a multi-set viewer ──────────────\n   The shell above owns the copy and the palette, so a panel is a canvas and\n   nothing else. The panel carrying the controls is told so by the shell,\n   since which one that is depends on the layout, not on the set. */\nbody.panel #edPane,\nbody.panel #ctrlPane,\nbody.panel .resizer,\nbody.panel .pane-title,\nbody.panel #overlay,\nbody.panel #themes,\nbody.panel #controls { display: none !important; }\nbody.panel #typePane { width: 100vw; }\nbody.panel #dock { display: none !important; }\nbody.panel.ui #dock { display: flex !important; }\n/* The set is fixed per panel, and there is no rail to jump to, so the two\n   controls that would act on this page alone are not offered. */\nbody.panel #dockSets,\nbody.panel #dockHarm { display: none !important; }\nbody.panel.no-share #dockPng,\nbody.panel.no-share #dockLink { display: none !important; }\nbody.panel #dockSets + .dock-sep { display: none; }\n/* Nothing is drawn until the panel has its set and its copy, which spares the\n   viewer a frame of the wrong thing before the right one arrives. */\nbody.panel #canvas { opacity: 0; }\nbody.panel.ready #canvas { opacity: 1; transition: opacity 0.18s ease; }\n\n/* ── Drag handles between the three columns ───────────────────────────── */\n.resizer {\n  width: 7px; flex-shrink: 0; cursor: col-resize; position: relative;\n  background: transparent; z-index: 30;\n}\n.resizer::before {\n  content: ''; position: absolute; left: 3px; top: 0; bottom: 0;\n  width: 0.5px; background: #262626; transition: background 0.12s;\n}\n.resizer:hover::before, .resizer.drag::before { background: #777; width: 1px; }\nbody.resizing { cursor: col-resize; user-select: none; }\n\n#ctrlHint {\n  position: absolute; left: 16px; bottom: 14px; z-index: 12;\n  font-family: 'Aeonik Fono', monospace;\n  font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: #555;\n  pointe Pane .ctrl input[type=range]::-webkit-slider-thumb {\n  -webkit-appearance: none; width: 10px; height: 10px; margin-top: -4px;\n  border-radius: 50%; background: rgba(255,255,255,0.9);\n}\n.edgrp input[type=range]::-moz-range-track,\n#ctrlPane .ctrl input[type=range]::-moz-range-track {\n  height: 2px; background: rgba(255,255,255,0.2); border: none;\n}\n.edgrp input[type=range]::-moz-range-thumb,\n#ctrlPane .ctrl input[type=range]::-moz-range-thumb {\n  width: 10px; height: 10px; border: none; border-radius: 50%;\n  background: rgba(255,255,255,0.9);\n}\n.edgrp .edval {\n  color: rgba(255,255,255,0.5) !important;\n  opacity: 0; transition: opacity 0.15s;\n}\n.edgrp:hover .edval { opacity: 1; }\n.edbtn, #actions .action {\n  font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em;\n  color: #ccc; background: transparent; border: 0.5px solid #333; border-radius: 2px;\n  padding: 6px 9px; cursor: pointer;\n}\n.edbtn:hover, #actions .action:hover { border-color: #888; color: #fff; }\n.edbtn.on { color: #000; background: #ccc; border-color: #ccc; }\n.edbtn:disabled { opacity: 0.35; cursor: default; }\n/* Native bar retired: the rail on the right reports position instead. */\n#edPane .edsheet {\n  flex: 1; overflow-y: auto; padding: 12px 24px 20px 14px;\n  scrollbar-width: none; -ms-overflow-style: none;\n}\n#edPane .edsheet::-webkit-scrollbar { width: 0; height: 0; display: none; }\n#edScrollWrap { position: relative; flex: 1; min-height: 0; display: flex; }\n#edRail {\n  position: absolute; right: 9px; top: 14px; bottom: 14px; width: 11px;\n  cursor: pointer; z-index: 4;\n}\n#edRail::before {\n  content: ''; position: absolute; left: 5px; top: 0; bottom: 0;\n  width: 1px; background: #242424;\n}\n#edDot {\n  position: absolute; left: 1.5px; width: 8px; height: 8px; border-radius: 50%;\n  background: #666; transition: background 0.15s;\n}\n#edRail:hover #edDot, #edRail.drag #edDot { background: #ccc; }\n#edPane .glyph-strip { display: grid; gap: 2px; justify-content: start; }\n#edPane .glyph-block {\n  display: flex; flex-direction: column; gap: 3px;\n  padding: 5px 6px; border-radius: 3px; border: 0.5px solid transparent;\n}\n#edPane .glyph-block.active { border-color: #333; background: #0d0d0d; }\n#edPane .glyph-key { font-size: 11px; color: #666; text-transform: uppercase; line-height: 1; cursor: pointer; user-select: none;\n  font-family: 'Aeonik Fono', monospace; }\n#edPane .glyph-block.active .glyph-key { color: #fff; }\n#edPane canvas.ed { display: block; cursor: crosshair; touch-action: none; }\n#edPane canvas.pv { display: block; cursor: pointer; }\n\n/* ── Harmony panel ─────────────────────────────────────────────────────────\n   A hue-relationship editor for the five colors that actually matter here:\n   the ambient drift layer, the two cursor-attracted sets, the two\n   cursor-repelled sets, and the ground they all sit on. Plus the theme\n   library those five colors get stored in. */\n#harm {\n  position: fixed; top: 14px; right: 14px; width: 348px;\n  max-height: calc(100vh - 28px); overflow-y: auto;\n  background: rgba(10,10,10,0.94); border: 0.5px solid #262626; border-radius: 4px;\n  padding: 12px; z-index: 60; display: none;\n  font-family: 'Aeonik Fono', ui-monospace, monospace; color: #ccc;\n  backdrop-filter: blur(8px);\n}\n#harm.visible { display: block; }\n#harm::-webkit-scrollbar { width: 6px; }\n#harm::-webkit-scrollbar-thumb { background: #262626; border-radius: 3px; }\n#harm .harm-head {\n  display: flex; align-items: center; justify-content: space-between;\n  font-size: 11px; letter-spacing: 0.04em; color: #888; margin-bottom: 10px;\n}\n#harm .harm-head button {\n  background: none; border: none; color: #555; cursor: pointer; font-size: 13px;\n  line-height: 1; padding: 2px 4px;\n}\n#harm .harm-head button:hover { color: #fff; }\n\n/* Theme library */\n#harmLib { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }\n#harmLib .chip {\n  position: relative; width: 26px; height: 26px; border-radius: 3px; padding: 0;\n  border: 1px solid #232323; background: #000; cursor: pointer; overflow: hidden;\n}\n#harmLib .chip.on { border-color: #fff; }\n#harmLib .chip i { position: absolute; width: 6px; height: 6px; border-radius: 50%; }\n#harmLib .add {\n  width: 26px; height: 26px; border-radius: 3px; border: 1px dashed #333; background: none;\n  color: #666; cursor: pointer; font-size: 13px; line-height: 1; padding: 0; font-family: inherit;\n}\n#harmLib .add:hover { color: #fff; border-color: #666; }\n#harmName {\n  width: 100%; background: #131313; border: 0.5px solid #242424; color: #ccc;\n  font-family: inherit; font-size: 10px; padding: 4px 6px; border-radius: 2px; margin-bottom: 6px;\n}\n#harmLibBar { display: flex; gap: 4px; margin-bottom: 10px; }\n#harmLibBar button {\n  flex: 1; font-family: inherit; font-size: 9px; letter-spacing: 0.02em; padding: 5px 2px;\n  background: #131313; border: 0.5px solid #242424; color: #888; border-radius: 2px; cursor: pointer;\n}\n#harmLibBar button:hover { background: #1e1e1e; color: #fff; }\n#harmLibBar button.danger:hover { color: #ff6b5e; border-color: #4a2320; }\n\n/* Model tabs */\n#harmModes { display: flex; gap: 4px; margin-bottom: 10px; }\n#harmModes button {\n  flex: 1; font-family: inherit; font-size: 10px; letter-spacing: 0.02em; padding: 6px 2px;\n  background: #131313; border: 0.5px solid #242424; color: #777; border-radius: 2px; cursor: pointer;\n}\n#harmModes button.on { background: #efefef; color: #111; border-color: #efefef; }\n\n#harmWheelWrap { position: relative; display: flex; justify-content: center; margin-bottom: 10px; }\n#harmWheel { cursor: crosshair; touch-action: none; display: block; }\n#harm .harm-row { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }\n#harm .harm-row.off { display: none; }\n#harm .harm-row label { font-size: 10px; color: #6a6a6a; width: 64px; flex: none; letter-spacing: 0.02em; }\n#harm .harm-row input[type=range] {\n  -webkit-appearance: none; appearance: none; flex: 1; height: 14px; background: none; cursor: pointer;\n}\n#harm .harm-row input[type=range]::-webkit-slider-runnable-track { height: 2px; background: rgba(255,255,255,0.16); }\n#harm .harm-row input[type=range]::-webkit-slider-thumb {\n  -webkit-appearance: none; margin-top: -4px; width: 10px; height: 10px;\n  border-radius: 50%; background: rgba(255,255,255,0.9);\n}\n#harm .harm-row input[type=range]::-moz-range-track { height: 2px; background: rgba(255,255,255,0.16); border: none; }\n#harm .harm-row input[type=range]::-moz-range-thumb { width: 10px; height: 10px; border: none; border-radius: 50%; background: rgba(255,255,255,0.9); }\n#harm .harm-row .v { font-size: 10px; color: #7a7a7a; width: 38px; text-align: right; flex: none; }\n#harm .harm-sep { height: 0.5px; background: #1e1e1e; margin: 10px 0; }\n#harm .harm-sub { font-size: 10px; color: #555; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 7px; }\n\n/* Exact color entry */\n#harm .hexrow { display: flex; align-items: center; gap: 6px; margin-bottom: 5px; }\n#harm .hexrow label { font-size: 10px; color: #6a6a6a; width: 64px; flex: none; }\n#harm .hexrow input[type=color] {\n  width: 24px; height: 22px; padding: 0; border: 0.5px solid #2a2a2a; border-radius: 2px;\n  background: none; cursor: pointer; flex: none;\n}\n#harm .hexrow input[type=text] {\n  flex: 1; min-width: 0; background: #131313; border: 0.5px solid #242424; color: #bbb;\n  font-family: inherit; font-size: 10px; padding: 4px 6px; border-radius: 2px;\n}\n#harm .hexrow input[type=text]:focus { outline: none; border-color: #444; color: #fff; }\n#harm .hexrow button {\n  font-family: inherit; font-size: 9px; padding: 4px 6px; background: #131313;\n  border: 0.5px solid #242424; color: #777; border-radius: 2px; cursor: pointer; flex: none;\n}\n#harm .hexrow button.on { background: #efefef; color: #111; border-color: #efefef; }\n\n#harmOut { display: flex; gap: 4px; margin-bottom: 4px; }\n#harmOut .sw { flex: 1; height: 22px; border-radius: 2px; border: 0.5px solid rgba(255,255,255,0.08); }\n#harmLegend { display: flex; gap: 4px; font-size: 9px; color: #4d4d4d; margin-bottom: 2px; }\n#harmLegend div { flex: 1; text-align: center; }\n\n#harmSug { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }\n#harmSug .sug { cursor: pointer; border: 0.5px solid #1e1e1e; border-radius: 3px; overflow: hidden; padding: 0; background: none; }\n#harmSug .sug:hover { border-color: #555; }\n#harmSug .sug canvas { display: block; width: 100%; height: auto; }\n#harmSug .sug .nm { font-size: 9px; color: #5a5a5a; text-align: center; padding: 3px 0 4px; letter-spacing: 0.02em; }\n#harmSug .sug:hover .nm { color: #ddd; }\n#harm .harm-note { font-size: 9px; color: #444; line-height: 1.5; margin-top: 9px; }\n#harm .harm-apply {\n  width: 100%; margin-top: 9px; padding: 6px; font-size: 10px; letter-spacing: 0.04em;\n  background: #161616; border: 0.5px solid #2a2a2a; color: #aaa; border-radius: 3px; cursor: pointer;\n  font-family: inherit;\n}\n#harm .harm-apply:hover { background: #202020; color: #fff; }\n#harmStatus { font-size: 9px; color: #4a4a4a; text-align: center; margin-top: 6px; min-height: 11px; }\n\n/* ── Embedded in the control rail ─────────────────────────────────────────\n   The panel is a section of the rail now, not a floating window, so it drops\n   the chrome that only made sense while it hovered. */\n#ctrlPane #harm {\n  position: static; width: auto; max-height: none; overflow: visible;\n  background: none; border: none; border-radius: 0; padding: 0;\n  backdrop-filter: none; display: block; z-index: auto;\n}\n#ctrlPane #harm .harm-head { margin-bottom: 7px; }\n#ctrlPane #harm .harm-head button { display: none; }\n#ctrlPane #harmWheelWrap { margin-bottom: 8px; }\n#ctrlPane #harm .harm-sep { margin: 8px 0; }\n#ctrlPane #harm .harm-sub { margin-bottom: 5px; }\n#ctrlPane #harm .harm-row { margin-bottom: 3px; }\n#ctrlPane #harm .harm-row label,\n#ctrlPane #harm .hexrow label { width: 62px !important; }\n#ctrlPane #harm .harm-row input[type=range] { width: auto !important; flex: 1; }\n#ctrlPane #harm .harm-row .v { width: 34px !important; }\n#ctrlPane #harm input[type=text] { text-transform: none !important; }\n/* The rail is narrow and resizable, so the grid fits whatever it is given. */\n#ctrlPane #harmSug { grid-template-columns: repeat(auto-fill, minmax(52px, 1fr)); gap: 4px; }\n#ctrlPane #harmLib .chip, #ctrlPane #harmLib .add { width: 24px; height: 24px; }\n#ctrlPane #harmModes button, #ctrlPane #harmLibBar button { padding: 5px 2px; }\n#ctrlPane #harm .harm-note { display: none; }\n\n/* ── Compact pass ─────────────────────────────────────────────────────────\n   Same language, less air. Every number here was a larger one above. */\n#ctrlPane, #ctrlPane *, #edPane .edbar, #edPane .edbar * { line-height: 1.15; }\n#ctrlPane { width: 17%; min-width: 172px; }\n.ctrlSection { padding: 10px 13px 11px; }\n.ctrlHead { margin-bottom: 9px; }\n.edbar { gap: 2px; }\n.edbar-row { gap: 4px; margin-top: 4px; }\n.edgrp { min-height: 14px; gap: 6px; }\n.edbtn, #actions .action { padding: 4px 7px; }\n.edgrp input[type=range], #ctrlPane .ctrl input[type=range] { height: 12px; }\n#ctrlPane .ctrl, #ctrlPane .ctrl-toggle, #ctrlPane .ctrl-row { min-height: 14px; }\n#ctrlPane .ctrl-separator { margin: 5px 0; }\n#vizHost #controls { gap: 2px; }\n#edPane .edbar { padding-bottom: 2px; }\n#edPane > .edbar { padding: 11px 13px 8px !important; }\n\n/* ── Glyph sheet: rail retired ────────────────────────────────────────────\n   The scroll rail is gone and the gutter it needed goes with it, which is\n   what closes the gap between the sheet and the rail beside it. */\n#edRail { display: none !important; }\n#edPane .edsheet { padding: 10px 12px 14px 13px; }\n.resizer { width: 5px; }\n.resizer::before { left: 2px; }\n\n/* ══════════════════════════════════════════════════════════════════════════\n   CONTROL RAIL SYSTEM\n   One token set, one row primitive, one control set. Everything above this\n   block is where the pieces were built; this is where they agree. The rule\n   is simple: a row is a row whether it lives in Editor, Visualizer or Color\n   theme, and a button is a button wherever it sits. Anything that needs to\n   differ does it by state, not by a second set of numbers.\n   ══════════════════════════════════════════════════════════════════════════ */\n:root {\n  /* rhythm */\n  --rail-px: 14px;      /* section inset, horizontal */\n  --rail-py: 12px;      /* section inset, vertical   */\n  --row-h: 20px;        /* every control row         */\n  --row-gap: 2px;       /* between rows in a stack   */\n  --group-gap: 11px;    /* between groups            */\n  --gap-x: 8px;         /* label to control to value */\n  /* measure */\n  --label-w: 70px;\n  --val-w: 30px;\n  --ctl-h: 22px;        /* buttons, fields, chips    */\n  --swatch: 18px;\n  --radius: 2px;\n  --track-h: 2px;\n  --thumb: 9px;\n  /* surface */\n  --line: #1f1f1f;\n  --line-2: #2b2b2b;\n  --field: #131313;\n  --field-hi: #1f1f1f;\n  /* ink */\n  --ink-0: #ffffff;\n  --ink-1: #b8b8b8;\n  --ink-2: #7a7a7a;\n  --ink-3: #4e4e4e;\n}\n\n/* ── Sections ───────────────────────────────────────────────────────────── */\n.ctrlSection {\n  padding: var(--rail-py) var(--rail-px) calc(var(--rail-py) + 2px);\n  border-bottom: 0.5px solid var(--line);\n}\n.ctrlHead { color: var(--ink-0); margin-bottom: var(--group-gap); }\n#edPane > .edbar { padding: var(--rail-py) var(--rail-px) 9px !important; border-bottom: 0.5px solid var(--line); }\n#edPane .ed-title { color: var(--ink-0); }\n#edPane .ed-hint { color: var(--ink-3); }\n#ctrlPane #harm .harm-sub { color: var(--ink-3); margin-bottom: 6px; }\n\n/* ── Stacks: one gap between rows, everywhere ───────────────────────────── */\n.edbar,\n#vizHost #controls,\n#ctrlPane .ctrl-group { display: flex; flex-direction: column; gap: var(--row-gap); }\n.edbar-row { display: flex; flex-wrap: wrap; gap: 4px; margin-top: var(--row-gap); }\n\n/* ── The row primitive ──────────────────────────────────────────────────── */\n#ctrlPane .ctrl,\n#ctrlPane .ctrl-toggle,\n#ctrlPane .ctrl-row,\n#ctrlPane .edgrp,\n#ctrlPane #harm .harm-row,\n#ctrlPane #harm .hexrow,\n#edPane .edgrp {\n  display: flex; align-items: center; gap: var(--gap-x);\n  height: var(--row-h); min-height: var(--row-h); margin: 0;\n  flex-wrap: nowrap;\n}\n#ctrlPane .ctrl label,\n#ctrlPane .ctrl-toggle label,\n#ctrlPane .ctrl-row > label,\n#ctrlPane .edgrp label,\n#ctrlPane #harm .harm-row label,\n#ctrlPane #harm .hexrow label,\n#edPane .edgrp label {\n  width: var(--label-w) !important; flex: none;\n  color: var(--ink-2) !important; white-space: nowrap;\n}\n/* Tracks fill whatever the rail is dragged to, rather than a fixed 84 or 116. */\n#ctrlPane .ctrl input[type=range],\n#ctrlPane .edgrp input[type=range],\n#ctrlPane #harm .harm-row input[type=range],\n#edPane .edgrp input[type=range] {\n  -webkit-appearance: none; appearance: none;\n  flex: 1 1 auto; width: auto !important; min-width: 0;\n  height: var(--row-h); background: none; cursor: pointer;\n}\n#ctrlPane input[type=range]::-webkit-slider-runnable-track,\n#edPane input[type=range]::-webkit-slider-runnable-track {\n  height: var(--track-h); background: rgba(255,255,255,0.18); border-radius: 1px;\n}\n#ctrlPane input[type=range]::-webkit-slider-thumb,\n#edPane input[type=range]::-webkit-slider-thumb {\n  -webkit-appearance: none; width: var(--thumb); height: var(--thumb);\n  margin-top: calc((var(--track-h) - var(--thumb)) / 2);\n  border-radius: 50%; background: var(--ink-0);\n}\n#ctrlPane input[type=range]::-moz-range-track,\n#edPane input[type=range]::-moz-range-track {\n  height: var(--track-h); background: rgba(255,255,255,0.18); border: none;\n}\n#ctrlPane input[type=range]::-moz-range-thumb,\n#edPane input[type=range]::-moz-range-thumb {\n  width: var(--thumb); height: var(--thumb); border: none; border-radius: 50%; background: var(--ink-0);\n}\n/* Values sit in one column on the right, shown on hover in both panels. */\n#ctrlPane .ctrl .val,\n#ctrlPane .edgrp .edval,\n#ctrlPane #harm .harm-row .v,\n#edPane .edgrp .edval {\n  width: var(--val-w) !important; flex: none; text-align: right;\n  color: var(--ink-2) !important;\n}\n/* Readouts are always on. See the rule further down, which is the one that\n   governs; this block used to reveal them on hover. */\n\n/* Nested rows inside a row (the four particle swatches) stop being rows. */\n#ctrlPane .ctrl-row .ctrl { height: auto; min-height: 0; width: auto; gap: 4px; }\n/* A hidden row is hidden. Stated at this specificity because the primitive\n   above sets display, and the primitive is the more specific selector. */\n#ctrlPane #harm .harm-row.off { display: none; }\n\n/* ── Group rules ────────────────────────────────────────────────────────── */\n#ctrlPane .ctrl-separator,\n#ctrlPane #harm .harm-sep {\n  width: 100%; height: 0.5px; background: var(--line);\n  margin: var(--group-gap) 0; border: none;\n}\n\n/* ── Swatches ───────────────────────────────────────────────────────────── */\n#ctrlPane input[type=color],\n#edPane input[type=color] {\n  width: var(--swatch); height: var(--swatch); min-width: var(--swatch); flex: none; padding: 0;\n  border: 0.5px solid var(--line-2); border-radius: var(--radius);\n  background: none; cursor: pointer;\n}\n#ctrlPane .toggle-btn { width: 12px; height: 12px; flex: none; }\n\n/* ── Buttons: one control, three sizes of container ─────────────────────── */\n.edbtn,\n#ctrlPane #harmModes button,\n#ctrlPane .lib-bar button,\n#ctrlPane #harm .harm-apply,\n#ctrlPane #harm .hexrow button,\n#edPane .lib-bar button {\n  height: var(--ctl-h); padding: 0 8px; border-radius: var(--radius);\n  background: var(--field); border: 0.5px solid var(--line-2); color: var(--ink-2);\n  cursor: pointer; font-family: inherit; letter-spacing: 0.05em;\n  display: inline-flex; align-items: center; justify-content: center;\n}\n.edbtn:hover,\n#ctrlPane #harmModes button:hover,\n#ctrlPane .lib-bar button:hover,\n#ctrlPane #harm .harm-apply:hover,\n#ctrlPane #harm .hexrow button:hover,\n#edPane .lib-bar button:hover { background: var(--field-hi); color: var(--ink-0); border-color: #3a3a3a; }\n.edbtn.on,\n#ctrlPane #harmModes button.on,\n#ctrlPane #harm .hexrow button.on { background: #efefef; color: #111; border-color: #efefef; }\n.edbtn:disabled { opacity: 0.35; cursor: default; }\n#ctrlPane .lib-bar button.danger:hover,\n#edPane .lib-bar button.danger:hover { color: #ff6b5e; border-color: #4a2320; }\n#ctrlPane #harm .harm-apply { width: 100%; margin-top: var(--row-gap); }\n\n/* ── Fields ─────────────────────────────────────────────────────────────── */\n#ctrlPane input[type=text],\n#edPane input[type=text] {\n  height: var(--ctl-h); padding: 0 7px; border-radius: var(--radius);\n  background: var(--field); border: 0.5px solid var(--line-2); color: var(--ink-1);\n  font-family: inherit; text-transform: none !important; min-width: 0;\n}\n#ctrlPane input[type=text]:focus,\n#edPane input[type=text]:focus { outline: none; border-color: #3f3f3f; color: var(--ink-0); }\n\n/* ── The library component, used by colours and by sizes ────────────────── */\n.lib { display: flex; flex-direction: column; gap: var(--row-gap); margin-top: var(--row-gap); }\n#harmLib, .lib-chips { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: var(--row-gap); }\n#harmLibBar, .lib-bar { display: flex; flex-wrap: wrap; gap: 4px; }\n#harmLibBar button, .lib-bar button { flex: 1 1 auto; padding: 0 4px; }\n#harmName, #finalsName { width: 100%; }\n.lib-chip {\n  height: var(--ctl-h); padding: 0 8px; border-radius: var(--radius);\n  background: var(--field); border: 1px solid var(--line-2); color: var(--ink-2);\n  cursor: pointer; font-family: inherit; letter-spacing: 0.05em;\n}\n.lib-chip:hover { color: var(--ink-0); border-color: #3a3a3a; }\n.lib-chip.on { border-color: var(--ink-0); color: var(--ink-0); }\n.lib-add, #ctrlPane #harmLib .add {\n  height: var(--ctl-h); width: var(--ctl-h); padding: 0; border-radius: var(--radius);\n  background: none; border: 1px dashed #333; color: var(--ink-3);\n  cursor: pointer; font-family: inherit;\n}\n.lib-add:hover, #ctrlPane #harmLib .add:hover { color: var(--ink-0); border-color: #666; }\n/* Colour chips carry their palette, so they are square and unlabelled. */\n#ctrlPane #harmLib .chip { width: var(--ctl-h); height: var(--ctl-h); border-radius: var(--radius); }\n.lib-status, #harmStatus { color: var(--ink-3); min-height: 12px; margin-top: var(--row-gap); }\n#harmStatus { text-align: left; }\n\n/* ── Suggestions and result strip ───────────────────────────────────────── */\n#ctrlPane #harmOut { gap: 3px; margin-bottom: 3px; }\n#ctrlPane #harmOut .sw { height: var(--swatch); border-radius: var(--radius); }\n#ctrlPane #harmLegend { gap: 3px; color: var(--ink-3); }\n#ctrlPane #harmSug { gap: 4px; }\n#ctrlPane #harmSug .sug { border: 0.5px solid var(--line); border-radius: var(--radius); }\n#ctrlPane #harmSug .sug:hover { border-color: #4a4a4a; }\n#ctrlPane #harmSug .sug .nm { color: var(--ink-3); padding: 3px 0 4px; }\n#ctrlPane #harmSug .sug:hover .nm { color: var(--ink-0); }\n\n\n/* ── Why the visualizer tracks were short ─────────────────────────────────\n   #controls is a flex column with align-items: flex-start, so its rows sized\n   to their content instead of the column, and a flexible track inside a\n   shrink-wrapped row falls back to the browser's intrinsic width for a range\n   input. The editor's .edbar never set align-items, which is why only one of\n   the two panels looked wrong. Rows stretch, and every row is a full-width\n   box, so the tracks end where the heading ends in both. */\n#vizHost #controls,\n#controls.visible,\n#ctrlPane .ctrl-group,\n.edbar { align-items: stretch !important; }\n#ctrlPane .ctrl,\n#ctrlPane .ctrl-toggle,\n#ctrlPane .ctrl-row,\n#ctrlPane .edgrp,\n#ctrlPane #harm .harm-row,\n#ctrlPane #harm .hexrow,\n#edPane .edgrp { width: 100%; box-sizing: border-box; }\n\n/* ── Full measure ─────────────────────────────────────────────────────────\n   A track that stops 38px short of the section edge is not aligned to\n   anything. The readout leaves the flow and sits over the tail of the track,\n   which puts every slider on the same measure as the section heading. */\n#ctrlPane .ctrl,\n#ctrlPane .ctrl-toggle,\n#ctrlPane .edgrp,\n#ctrlPane #harm .harm-row { position: relative; }\n#ctrlPane .ctrl .val,\n#ctrlPane .edgrp .edval,\n#ctrlPane #harm .harm-row .v {\n  position: absolute; right: 0; top: 50%; transform: translateY(-50%);\n  width: auto !important; padding-left: 6px; background: #000;\n  pointer-events: none;\n}\n/* One behaviour for every readout: always present. The number overlays the\n   tail of the track rather than taking a column out of it, so the tracks keep\n   the same measure as the section headings. */\n#ctrlPane .ctrl .val,\n#ctrlPane .edgrp .edval,\n#ctrlPane #harm .harm-row .v,\n#edPane .edgrp .edval { opacity: 1; }\n\n/* ── Swatches are dots ────────────────────────────────────────────────────\n   Every other colour in this interface is a circle: the dock palettes, the\n   particles themselves, the markers on the wheel. The inputs follow. */\n#ctrlPane input[type=color],\n#edPane input[type=color] { border-radius: 50%; }\n#ctrlPane #harmOut .sw { border-radius: 50%; width: var(--swatch); flex: none; }\n#ctrlPane #harmOut { gap: 6px; }\n#ctrlPane #harmLegend { display: none; }\n\n/* ── Screenshot pass ──────────────────────────────────────────────────────\n   Every button row, chip row and library bar sits on the same 4px gap, so\n   the stack reads as one rhythm rather than three that nearly agree. */\n#ctrlPane .edbar-row,\n#ctrlPane .lib,\n#ctrlPane .lib-bar,\n#ctrlPane #harmLibBar { gap: 4px; margin-top: 4px; }\n#ctrlPane .lib-chips,\n#ctrlPane #harmLib { gap: 6px; margin-top: 4px; margin-bottom: 4px; }\n#ctrlPane #finalsName,\n#ctrlPane #harmName { margin-top: 0; }\n\n/* Colour chips: room to breathe, and a selection ring that marks rather\n   than shouts. */\n#ctrlPane #harmLib { gap: 8px; }\n#ctrlPane #harmLib .chip,\n#ctrlPane .lib-chip { border-width: 0.5px; }\n#ctrlPane #harmLib .chip.on,\n#ctrlPane .lib-chip.on { border-width: 0.5px; border-color: #ffffff; }\n#ctrlPane #harmLib .chip { width: 26px; height: 26px; }\n#ctrlPane #harmLib .chip i { width: 7px; height: 7px; }\n\n/* The glyph sheet and the rail meet on a hairline. The handle keeps a wide\n   invisible grab area so nothing is lost by closing the gap. */\n.resizer { width: 1px; overflow: visible; }\n.resizer::before { left: 0; }\n.resizer::after {\n  content: ''; position: absolute; top: 0; bottom: 0; left: -4px; right: -4px;\n  cursor: col-resize;\n}\n\n/* ── Frame: the viewer's gutter system, applied to the studio ─────────────\n   The two-panel viewer sets one gutter and uses it everywhere: page edge to\n   panel, panel to panel, panel to page edge. The studio ran its three columns\n   flush against each other and against the window, which is a second system\n   doing the same job differently. Same token now, same 4px corner, same near\n   black page behind rounded black panels.\n\n   This reopens the gap I closed last turn, deliberately: the space is back as\n   a system value rather than as leftover from a drag handle. */\n:root { --frame: 12px; --panel-radius: 4px; }\nbody {\n  padding: var(--frame);\n  background: #000;             /* black ground; the panels are drawn, not filled */\n  gap: 0;                       /* the resizers are the gutters */\n}\n#edPane, #ctrlPane, #typePane {\n  height: auto; min-height: 0;\n  border-radius: var(--panel-radius);\n  background: #000;\n}\n/* Black on black, so the two working panels are described by a hairline\n   rather than by a fill. The visualizer takes no outline: an edge there\n   would read as a mat around the artwork. */\n#edPane, #ctrlPane { border: 1px solid #2a2a2a; }\n/* Two of the three clip, one scrolls. A rounded box can do both, but only if\n   the axis that scrolls says so rather than inheriting hidden from here. */\n#edPane, #typePane { overflow: hidden; }\n#ctrlPane { overflow-y: auto; overflow-x: hidden; }\n#ctrlPane::-webkit-scrollbar { width: 6px; }\n#ctrlPane::-webkit-scrollbar-thumb { background: #262626; border-radius: 3px; }\n#ctrlPane::-webkit-scrollbar-track { background: transparent; }\n/* The last section needs somewhere to land, or it sits against the corner. */\n#ctrlPane > .ctrlSection:last-child { border-bottom: none; padding-bottom: 20px; }\n/* The canvas is the panel's own surface, so it takes the panel's corner and\n   the pane stops drawing an edge the canvas would cover anyway. */\n#typePane { position: relative; }\n#canvas { border-radius: var(--panel-radius); }\n/* The handle is the gutter. Full width, no hairline, grabbable across all\n   of it, so the space between panels is doing two jobs instead of one. */\n.resizer {\n  width: var(--frame); flex-shrink: 0; overflow: visible;\n  background: transparent; cursor: col-resize;\n}\n.resizer::before { display: none; }\n.resizer::after { left: 0; right: 0; }\n/* The dock sits inside a rounded panel now, so it holds the same distance\n   from the panel edge that the panel holds from the page. */\n#dock { bottom: var(--frame); }\n\n/* A panel in the viewer is a canvas and nothing else, and the shell owns the\n   frame there, so panel mode drops the studio's own. */\nbody.panel { padding: 0; }\nbody.panel #typePane { border-radius: 0; }\n\n/* ── Stage ────────────────────────────────────────────────────────────────\n   The visualizer panel is chrome: page ground, the title, and the dock. The\n   stage inside it is the work: the theme's own background, the type, and\n   nothing else. Separating the two means a light palette no longer washes\n   the panel it sits in, and the dock never floats on top of the artwork.\n\n   Column layout rather than an absolute dock, so the stage cannot extend\n   under the controls. The dock sits after it, against the right edge. */\n/* The visualizer holds no chrome of its own. Its background is the theme's,\n   and it runs to all four edges of the container: the panel is the artwork,\n   not a mat around it. Title and dock float over it. */\n#typePane { background: #000; padding: 0; display: block; }\n#stage {\n  position: absolute; inset: 0;\n  border-radius: var(--panel-radius); overflow: hidden; background: #000;\n}\n#stage #canvas { width: 100%; height: 100%; display: block; border-radius: 0; }\n.pane-title {\n  position: absolute; left: 16px; top: 14px; z-index: 12;\n  color: var(--ink-0);\n}\n#dock {\n  position: absolute; right: var(--frame); bottom: var(--frame);\n  left: auto; transform: none; z-index: 40;\n}\n/* Overlays that used to hang off the pane now hang off the stage. */\n#overlay, #themes, #ctrlHint { z-index: 12; }\n\n/* A viewer panel is the work and nothing else, so the chrome and its insets\n   drop away and the stage becomes the whole frame. */\nbody.panel #typePane { padding: 0; gap: 0; background: #000; }\nbody.panel #stage { border-radius: 0; }\n\n/* ── Flush ────────────────────────────────────────────────────────────────\n   No gutters, no insets, no corners. Three containers meeting edge to edge.\n   One hairline divides the glyph editor from the settings rail, because both\n   are black and nothing else would tell them apart. The rail meets the\n   visualizer with no line at all: black against the theme colour is already\n   the separation, and a rule there would be a second one saying the same\n   thing. */\nbody { padding: 0; background: #000; }\n#edPane, #ctrlPane, #typePane { border: none; border-radius: 0; }\n#stage { border-radius: 0; }\n\n/* The divider is the handle. One pixel wide, drawn, with a grab area either\n   side of it so it stays as easy to hit as a wide one. */\n#rz1 {\n  width: 1px; background: #2a2a2a; overflow: visible; position: relative;\n  cursor: col-resize; flex-shrink: 0;\n}\n#rz1::before { display: none; }\n#rz1::after {\n  content: ''; position: absolute; top: 0; bottom: 0; left: -4px; right: -4px;\n  cursor: col-resize;\n}\n/* Nothing drawn here at all, so the handle is width zero and only the grab\n   area survives. */\n#rz2 {\n  width: 0; background: none; overflow: visible; position: relative;\n  cursor: col-resize; flex-shrink: 0;\n}\n#rz2::before { display: none; }\n#rz2::after {\n  content: ''; position: absolute; top: 0; bottom: 0; left: -4px; right: -4px;\n  cursor: col-resize; z-index: 30;\n}\n\n/* ── One gap ──────────────────────────────────────────────────────────────\n   Button rows, chip rows and library bars all sat on slightly different\n   numbers. They are one thing repeated, so they get one number: the distance\n   between Spacing and Populate is the distance between 10x10 and 5x5 is the\n   distance between Duplicate and Delete, in both sections. */\n#ctrlPane .edbar-row,\n#ctrlPane .lib,\n#ctrlPane .lib-bar,\n#ctrlPane .lib-chips,\n#ctrlPane #harmLib,\n#ctrlPane #harmLibBar,\n#ctrlPane #harmModes { gap: var(--btn-gap); margin-top: var(--btn-gap); }\n#ctrlPane .lib-chips, #ctrlPane #harmLib { margin-bottom: var(--btn-gap); }\n#ctrlPane #finalsName, #ctrlPane #harmName { margin-top: 0; }\n:root { --btn-gap: 6px; }\n\n/* Sub label: the quiet heading a library sits under, in either section. */\n#ctrlPane .sub-label,\n#ctrlPane #harm .harm-sub {\n  font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase;\n  color: var(--ink-3); margin-bottom: 5px;\n}\n\n/* Both edges of the rail are drawn now. */\n#rz2 {\n  width: 1px; background: #2a2a2a;\n}\n\n/* ── Selected is outlined, not filled ─────────────────────────────────────\n   A solid white block for a selected option is the loudest thing on the\n   panel and it competes with the artwork. The size chips already say it the\n   quiet way: white rule, white copy. Everything that carries a selected\n   state now says it the same way. */\n#ctrlPane #harmModes button.on,\n#ctrlPane #harm .hexrow button.on,\n.edbtn.on {\n  background: none;\n  border-color: var(--ink-0);\n  color: var(--ink-0);\n}\n#ctrlPane #harmModes button.on:hover,\n#ctrlPane #harm .hexrow button.on:hover,\n.edbtn.on:hover { background: none; color: var(--ink-0); border-color: var(--ink-0); }\n\n/* ── Swatches are dots, everywhere ────────────────────────────────────────\n   The two exact fields kept a rectangle because their own rule outranked the\n   general one. Stated here at matching weight. */\n#ctrlPane #harm .hexrow input[type=color],\n#ctrlPane #harm input[type=color] { border-radius: 50%; }\n\n/* Library chips: the four dots are one block, centred in the chip, rather\n   than pinned to fixed offsets that left a gap on two sides. */\n#ctrlPane #harmLib .chip {\n  display: grid; grid-template-columns: repeat(2, 7px); grid-auto-rows: 7px;\n  gap: 5px; place-content: center;\n}\n#ctrlPane #harmLib .chip i {\n  position: static !important; width: 7px; height: 7px;\n  left: auto !important; top: auto !important;\n}\n\n/* ── The thumb stays visible at the ends ──────────────────────────────────\n   The readout sits over the tail of the track, so at 100% it was covering\n   the very thing it describes. Raising the input above it means the thumb\n   passes over the number instead of under it. */\n#ctrlPane .ctrl,\n#ctrlPane .edgrp,\n#ctrlPane #harm .harm-row { isolation: isolate; }\n#ctrlPane .ctrl input[type=range],\n#ctrlPane .edgrp input[type=range],\n#ctrlPane #harm .harm-row input[type=range] { position: relative; z-index: 2; }\n#ctrlPane .ctrl .val,\n#ctrlPane .edgrp .edval,\n#ctrlPane #harm .harm-row .v { z-index: 1; }\n\n/* ── The readout gets its own room ────────────────────────────────────────\n   The track used to run under the number. It now stops short of it, so the\n   thumb can reach either end and still be seen, and the numbers have air. */\n#ctrlPane .ctrl input[type=range],\n#ctrlPane .edgrp input[type=range],\n#ctrlPane #harm .harm-row input[type=range] { margin-right: calc(var(--val-w) + 10px); }\n\n/* A colour input paints an inner swatch of its own, which is what kept the\n   two exact fields square: rounding the element is not rounding the swatch. */\n#ctrlPane input[type=color]::-webkit-color-swatch-wrapper { padding: 0; border: none; }\n#ctrlPane input[type=color]::-webkit-color-swatch { border: none; border-radius: 50%; }\n#ctrlPane input[type=color]::-moz-color-swatch { border: none; border-radius: 50%; }\n#ctrlPane input[type=color] { padding: 0; border-radius: 50%; overflow: hidden; }\n\n/* The export preview covers the stage exactly, so what is on screen is the\n   file, at the file's own proportions. */\n#previewFrame {\n  position: absolute; inset: 0; width: 100%; height: 100%;\n  border: 0; background: #000; z-index: 20;\n}\n\n/* The dock is the preview switch. Everything else it used to carry is in the\n   rail, where the rest of the controls are. */\n#dockPng, #dockHarm, #dockLink, #dockSepThemes { display: none !important; }\n#dock .dock-sep:last-of-type { display: none; }\n\n/* ── Swatch chips ─────────────────────────────────────────────────────────\n   Smaller dots on the same centre, with twice the air around them, and only\n   as many dots as the theme actually shows: four when four particle sets are\n   visible, one when the image is carried by the glyph fill alone. */\n#ctrlPane #harmLib .chip {\n  display: grid; gap: 4px; place-content: center;\n  grid-template-columns: repeat(2, 5.5px); grid-auto-rows: 5.5px;\n}\n#ctrlPane #harmLib .chip[data-n=\"1\"] { grid-template-columns: 5.5px; }\n#ctrlPane #harmLib .chip[data-n=\"2\"] { grid-template-columns: repeat(2, 5.5px); grid-auto-rows: 5.5px; }\n#ctrlPane #harmLib .chip i {\n  position: static !important; width: 5.5px; height: 5.5px;\n  left: auto !important; top: auto !important;\n}\n\n/* ── Swatch dots, one scale ───────────────────────────────────────────────\n   Matched to the wheel: a dot with a gap beside it worth about a third of\n   its own width. Unselected chips show the first two colours only, so a row\n   of themes reads as a row rather than as sixteen dots; selecting one opens\n   it to the full set. */\n#ctrlPane #harmLib .chip {\n  display: grid; gap: 4px; place-content: center;\n  grid-template-columns: repeat(2, 6px); grid-auto-rows: 6px;\n}\n#ctrlPane #harmLib .chip[data-n=\"1\"] { grid-template-columns: 6px; }\n#ctrlPane #harmLib .chip i {\n  position: static !important; width: 6px; height: 6px;\n  left: auto !important; top: auto !important;\n}\n#ctrlPane #harmLib .chip:not(.on) i:nth-child(n+3) { display: none; }\n\n/* ── Thumbs are circles ───────────────────────────────────────────────────\n   Stated once at a weight nothing earlier can beat, so every pane agrees. */\n/* Every thumb, listed explicitly, because three older rules sit at higher\n   specificity than a plain pane selector. */\n#ctrlPane input[type=range]::-webkit-slider-thumb,\n#ctrlPane .ctrl input[type=range]::-webkit-slider-thumb,\n#ctrlPane .edgrp input[type=range]::-webkit-slider-thumb,\n#ctrlPane #harm .harm-row input[type=range]::-webkit-slider-thumb,\n#edPane input[type=range]::-webkit-slider-thumb,\n#edPane .edgrp input[type=range]::-webkit-slider-thumb { border-radius: 50% !important; }\n#ctrlPane input[type=range]::-moz-range-thumb,\n#ctrlPane .ctrl input[type=range]::-moz-range-thumb,\n#ctrlPane .edgrp input[type=range]::-moz-range-thumb,\n#ctrlPane #harm .harm-row input[type=range]::-moz-range-thumb,\n#edPane input[type=range]::-moz-range-thumb,\n#edPane .edgrp input[type=range]::-moz-range-thumb { border-radius: 50% !important; }\n\n/* One dot size for every square-arranged swatch, here and in the viewers. */\n:root { --chip-dot: 4.3px; --chip-gap: 3px; }\n#ctrlPane #harmLib .chip {\n  grid-template-columns: repeat(2, var(--chip-dot)); grid-auto-rows: var(--chip-dot);\n  gap: var(--chip-gap);\n}\n#ctrlPane #harmLib .chip[data-n=\"1\"] { grid-template-columns: var(--chip-dot); }\n#ctrlPane #harmLib .chip i { width: var(--chip-dot); height: var(--chip-dot); }\n\n/* Swatch group and the two exact pickers, sized to a slider thumb: the two\n   are the same gesture, a single colour shown as one dot. */\n/* One diameter for every single-colour dot. 19px is what the particle\n   swatches were already drawing, from a rule specific enough to beat the\n   token; that rule now reads the token instead, so exact, amb exact, the\n   background and glyph fill dots and the wheel markers all match them. */\n:root { --swatch: 15.2px; }\n#ctrlPane .ctrl input[type=color],\n#ctrlPane .ctrl-row input[type=color] {\n  width: var(--swatch); height: var(--swatch); min-width: var(--swatch);\n}\n/* This is a label element, and the hexrow's own label rule sets a 64px width\n   with !important, which is what stretched the circle into an oval. Stated\n   here at the same weight and higher specificity. */\n#ctrlPane #harm .hexrow label.dotpick,\n#ctrlPane .dotpick {\n  position: relative; flex: none; display: inline-block; cursor: pointer;\n  width: var(--swatch) !important; height: var(--swatch) !important;\n  min-width: var(--swatch); margin: 0; padding: 0;\n}\n#ctrlPane .dotpick .dot {\n  display: block; width: 100%; height: 100%; border-radius: 50%;\n  border: 0.5px solid rgba(255,255,255,0.14); background: #000;\n}\n#ctrlPane .dotpick input[type=color] {\n  position: absolute; inset: 0; width: 100%; height: 100%;\n  opacity: 0; cursor: pointer; border: none; padding: 0;\n}\n\n/* The glyph editor's own title needs no rule under it: the panel edge is\n   already the boundary. */\n#edPane > .edbar { border-bottom: none !important; }\n/* ── Glyph sheet ────────────────────────────────────────────────────────── */\n#edPane .edsheet { padding: var(--rail-py) var(--rail-px) 16px; }\n<\/style>\n\n<script id=\"hg26-state\" type=\"application/json\">{\"grid\":3,\"thick\":2,\"autoConnect\":false,\"diamond\":55,\"width\":60,\"weld\":false,\"fit\":true,\"sil\":2,\"silCount\":10000,\" r\"><\/div>\n  <!-- Background particles. Three states rather than two: a field can stand\n       on its own or sit under the type as a ground. -->\n  <div class=\"edbar-row\">\n    <button class=\"edbtn\" id=\"edField\">Background particles: Off<\/button>\n    <div id=\"edKnockWrap\" style=\"display:none;align-items:center;gap:6px\">\n      <label style=\"font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#8a8a8a\">type<\/label>\n      <input type=\"color\" id=\"edKnockColor\" value=\"#ffffff\" style=\"width:22px;height:18px;padding:0;border:0;background:none;cursor:pointer\">\n      <label style=\"font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#8a8a8a\">size<\/label>\n      <input type=\"range\" id=\"edKnockSize\" min=\"15\" max=\"150\" value=\"100\" step=\"1\" style=\"width:84px\">\n      <span class=\"val\" id=\"edKnockSizeVal\">100%<\/span>\n    <\/div>\n  <\/div>\n  <div class=\"ctrl-toggle\" style=\"display:none\" onclick=\"toggleFloat()\">\n    <label>float 2+4<\/label>\n    <div class=\"toggle-btn\" id=\"floatBtn\"><\/div>\n  <\/div>\n  <span class=\"ctrl-hint\">⌥c<\/span>\n<\/div><\/div>\n  <\/div>\n  <div class=\"ctrlSection\" id=\"themeSection\">\n    <div class=\"ctrlHead\">Colors<\/div>\n<!-- ── Color theme (⌥H jumps to it) ───────────────────────────────────────────────────\n     Edits the whole color system at once rather than five disconnected\n     pickers, and stores the result in a theme library of any length. -->\n<div id=\"harm\">\n  <div class=\"harm-head\" style=\"display:none\"><span id=\"harmTitle\">harmony · 7/7<\/span><button id=\"harmClose\">×<\/button><\/div>\n\n  <div class=\"sub-label\">library<\/div>\n  <div id=\"harmLib\"><button class=\"chip\" title=\"Dune\" data-n=\"4\" style=\"background: rgb(6, 9, 8);\"><i style=\"background: rgb(255, 82, 134);\"><\/i><i style=\"background: rgb(9, 206, 147);\"><\/i><i style=\"background: rgb(255, 91, 20);\"><\/i><i style=\"background: rgb(7, 115, 162);\"><\/i><\/button><button class=\"chip\" title=\"Prism\" data-n=\"4\" style=\"background: rgb(0, 0, 0);\"><i style=\"background: rgb(216, 69, 50);\"><\/i><i style=\"background: rgb(254, 247, 82);\"><\/i><i style=\"background: rgb(213, 122, 241);\"><\/i><i style=\"background: rgb(114, 186, 105);\"><\/i><\/button><button class=\"chip\" title=\"Signal\" data-n=\"4\" style=\"background: rgb(0, 0, 0);\"><i style=\"background: rgb(255, 255, 255);\"><\/i><i style=\"background: rgb(85, 85, 85);\"><\/i><i style=\"background: rgb(232, 58, 37);\"><\/i><i style=\"background: rgb(151, 200, 208);\"><\/i><\/button><button class=\"chip\" title=\"Pulse\" data-n=\"4\" style=\"background: rgb(0, 0, 0);\"><i style=\"background: rgb(224, 64, 251);\"><\/i><i style=\"background: rgb(85, 85, 85);\"><\/i><i style=\"background: rgb(234, 50, 35);\"><\/i><i style=\"background: rgb(107, 163, 255);\"><\/i><\/button><button class=\"chip\" title=\"Silhouette\" data-n=\"1\" style=\"background: rgb(0, 0, 0);\"><i style=\"background: rgb(255, 255, 255);\"><\/i><\/button><button class=\"chip\" title=\"Emboss\" data-n=\"2\" style=\"background: rgb(110, 110, 110);\"><i style=\"background: rgb(255, 255, 255);\"><\/i><i style=\"background: rgb(58, 58, 58);\"><\/i><\/button><button class=\"chip on\" title=\"theme 7\" data-n=\"4\" style=\"background: rgb(6, 9, 8);\"><i style=\"background: rgb(255, 82, 134);\"><\/i><i style=\"background: rgb(9, 206, 147);\"><\/i><i style=\"background: rgb(255, 91, 20);\"><\/i><i style=\"background: rgb(7, 115, 162);\"><\/i><\/button><button class=\"add\" title=\"New theme from the current colors\">+<\/button><\/div>\n  <input type=\"text\" id=\"harmName\" spellcheck=\"false\" placeholder=\"theme name\">\n  <div id=\"harmLibBar\">\n    <button id=\"harmDup\">duplicate<\/button>\n    <button id=\"harmDel\" class=\"danger\">delete<\/button>\n    <button id=\"harmSave\">save<\/button>\n    <button id=\"harmLoad\">load<\/button>\n    <button id=\"harmDefaults\" title=\"Put the four original themes back\">originals<\/button>\n  <\/div>\n\n  <div class=\"harm-sep\"><\/div>\n  <div class=\"harm-sub\">swatches<\/div>\n  <!-- Manual override: the six colours of the selected theme, edited directly. -->\n  <div class=\"ctrl-group\">\n    <div class=\"ctrl-row\">\n      <label id=\"themeEditLabel\">theme 7<\/label>\n    <\/div>\n    <div class=\"ctrl\">\n      <label>background<\/label>\n      <input type=\"color\" id=\"tc_bg\" oninput=\"onThemeColor()\" title=\"Background\" value=\"#060908\">\n    <\/div>\n    <div class=\"ctrl\">\n      <label>glyph fill<\/label>\n      <input type=\"color\" id=\"tc_glyph\" oninput=\"onThemeColor()\" title=\"Glyph\" value=\"#060908\">\n    <\/div>\n    <div class=\"ctrl-row\">\n      <label>particles<\/label>\n      <div class=\"ctrl\"><input type=\"color\" id=\"tc_pt\" oninput=\"onThemeColor()\" title=\"Particle set 1\" value=\"#ff5286\"><\/div>\n      <div class=\"ctrl\"><input type=\"color\" id=\"tc_fill\" oninput=\"onThemeColor()\" title=\"Particle set 2\" value=\"#09ce93\"><\/div>\n      <div class=\"ctrl\"><input type=\"color\" id=\"tc_tert\" oninput=\"onThemeColor()\" title=\"Particle set 3\" value=\"#ff5b14\"><\/div>\n      <div class=\"ctrl\"><input type=\"color\" id=\"tc_quat\" oninput=\"onThemeColor()\" title=\"Particle set 4\" value=\"#0773a2\"><\/div>\n    <\/div>\n    <div class=\"ctrl\">\n      <label>glyph op<\/label>\n      <input type=\"range\" id=\"tc_glyphOpacity\" min=\"0\" max=\"100\" value=\"100\" step=\"1\" oninput=\"onThemeColor()\">\n      <span class=\"val\" id=\"tc_glyphOpacityVal\">100%<\/span>\n    <\/div>\n  <\/div>\n\n  <div class=\"harm-sep\"><\/div>\n  <div class=\"harm-sub\">color harmony model<\/div>\n  <div id=\"harmModes\">\n    <button data-m=\"comp\" class=\"on\">complementary<\/button>\n    <button data-m=\"analog\">analogous<\/button>\n    <button data-m=\"triad\">triadic<\/button>\n  <\/div>\n\n  <div id=\"harmWheelWrap\"><canvas id=\"harmWheel\" width=\"420\" height=\"420\" style=\"width: 210px; height: 210px;\"><\/canvas><\/div>\n\n  <div class=\"harm-row\"><label>saturation<\/label><input type=\"range\" id=\"hmSat\" min=\"0\" max=\"100\" step=\"1\" value=\"100\"><span class=\"v\" id=\"hmSatV\">100%<\/span><\/div>\n  <div class=\"harm-row\"><label>hue<\/label><input type=\"range\" id=\"hmHue\" min=\"0\" max=\"19\" step=\"1\" value=\"19\"><span class=\"v\" id=\"hmHueV\">19/20<\/span><\/div>\n  <div class=\"harm-row\" id=\"rowSpr\"><label>spread<\/label><input type=\"range\" id=\"hmSpr\" min=\"0\" max=\"5\" step=\"1\" value=\"2\"><span class=\"v\" id=\"hmSprV\">36°<\/span><\/div>\n  <div class=\"harm-row\" id=\"rowOpp\"><label>opposition<\/label><input type=\"range\" id=\"hmOpp\" min=\"1\" max=\"10\" step=\"1\" value=\"10\"><span class=\"v\" id=\"hmOppV\">180°<\/span><\/div>\n\n  <!-- Per pair saturation and lightness are gone: one saturation drives both,\n       and the value split between the pairs is held at the ratio that keeps\n       pull and push legible as two behaviours. -->\n  <div class=\"harm-row\" id=\"rowSatA\" style=\"display:none\"><input type=\"range\" id=\"hmSatA\" min=\"0\" max=\"100\" step=\"1\" value=\"100\"><span class=\"v\" id=\"hmSatAV\">100%<\/span><\/div>\n  <div class=\"harm-row\" id=\"rowLitA\" style=\"display:none\"><input type=\"range\" id=\"hmLitA\" min=\"8\" max=\"94\" step=\"1\" value=\"66\"><span class=\"v\" id=\"hmLitAV\">66%<\/span><\/div>\n  <div class=\"harm-row\" id=\"rowSatB\" style=\"display:none\"><input type=\"range\" id=\"hmSatB\" min=\"0\" max=\"100\" step=\"1\" value=\"92\"><span class=\"v\" id=\"hmSatBV\">92%<\/span><\/div>\n  <div class=\"harm-row\" id=\"rowLitB\" style=\"display:none\"><input type=\"range\" id=\"hmLitB\" min=\"8\" max=\"94\" step=\"1\" value=\"42\"><span class=\"v\" id=\"hmLitBV\">42%<\/span><\/div>\n\n  <div class=\"harm-sep\"><\/div>\n  <div class=\"harm-sub\">background<\/div>\n  <div class=\"harm-row\" id=\"rowBgL\" style=\"display:none\"><input type=\"range\" id=\"hmBgL\" min=\"0\" max=\"96\" step=\"1\" value=\"3\"><span class=\"v\" id=\"hmBgLV\">3%<\/span><\/div>\n  <div class=\"harm-row\" id=\"rowBgS\" style=\"display:none\"><input type=\"range\" id=\"hmBgS\" min=\"0\" max=\"100\" step=\"1\" value=\"18\"><span class=\"v\" id=\"hmBgSV\">18%<\/span><\/div>\n  <div class=\"hexrow\">\n    <label>color<\/label>\n    <label class=\"dotpick\"><span class=\"dot\" id=\"hmBgDot\" style=\"background: rgb(6, 9, 8);\"><\/span><input type=\"color\" id=\"hmBgPick\" value=\"#060908\"><\/label>\n    <input type=\"text\" id=\"hmBgHex\" spellcheck=\"false\" placeholder=\"#0a0a0a or 10,10,10\">\n    <button id=\"hmBgAuto\" title=\"Let the model drive the background\" class=\"on\">auto<\/button>\n  <\/div>\n\n  <!-- Layer opacity and blend retired. The rows are kept out of the flow so\n       the code that syncs them still has something to write to. -->\n  <div class=\"harm-row\" style=\"display:none\"><input type=\"range\" id=\"hmPullA\" min=\"0\" max=\"100\" step=\"1\" value=\"100\"><span class=\"v\" id=\"hmPullAV\">100%<\/span><\/div>\n  <div class=\"harm-row\" style=\"display:none\"><input type=\"range\" id=\"hmPushA\" min=\"0\" max=\"100\" step=\"1\" value=\"100\"><span class=\"v\" id=\"hmPushAV\">100%<\/span><\/div>\n  <div class=\"hexrow\" style=\"display:none\">\n    <button id=\"hmBlendNorm\" class=\"on\">normal<\/button>\n    <button id=\"hmBlendMul\">multiply<\/button>\n  <\/div>\n\n  <div class=\"harm-sub\" style=\"margin-top:10px\">silhouette particle<\/div>\n  <!-- Two independent drift layers sharing one colour. Two counts and two\n       opacities is enough to build depth: a dense faint field with a sparse\n       brighter one over it reads as atmosphere rather than as noise. -->\n  <div class=\"harm-row\"><label>count 1<\/label><input type=\"range\" id=\"edSil\" min=\"0\" max=\"60000\" step=\"250\" value=\"10000\"><span class=\"v edval\" id=\"edSilVal\">10000<\/span><\/div>\n  <div class=\"harm-row\"><label>opacity 1<\/label><input type=\"range\" id=\"hmAmb\" min=\"0\" max=\"100\" step=\"1\" value=\"22\"><span class=\"v\" id=\"hmAmbV\">22%<\/span><\/div>\n  <div class=\"harm-row\"><label>count 2<\/label><input type=\"range\" id=\"edSil2\" min=\"0\" max=\"60000\" step=\"250\" value=\"0\"><span class=\"v edval\" id=\"edSil2Val\">0<\/span><\/div>\n  <div class=\"harm-row\"><label>opacity 2<\/label><input type=\"range\" id=\"hmAmb2\" min=\"0\" max=\"100\" step=\"1\" value=\"50\"><span class=\"v\" id=\"hmAmb2V\">50%<\/span><\/div>\n  <input type=\"color\" id=\"edSilColor\" value=\"#ffffff\" style=\"display:none\">\n  <div class=\"hexrow\">\n    <label>color<\/label>\n    <label class=\"dotpick\"><span class=\"dot\" id=\"hmAmbDot\" style=\"background: rgb(255, 255, 255);\"><\/span><input type=\"color\" id=\"hmAmbPick\" value=\"#ffffff\"><\/label>\n    <input type=\"text\" id=\"hmAmbHex\" spellcheck=\"false\" placeholder=\"#ffffff or 255,255,255\">\n    <button id=\"hmAmbAuto\" title=\"White over dark grounds, black over light\" class=\"on\">auto<\/button>\n  <\/div>\n\n  <div id=\"harmOut\" style=\"display:none\">\n    <div class=\"sw\" id=\"hsBg\" style=\"background: rgb(6, 9, 8);\"><\/div><div class=\"sw\" id=\"hsAmb\" style=\"background: rgb(255, 255, 255); opacity: 0.22;\"><\/div>\n    <div class=\"sw\" id=\"hsP1\" style=\"background: rgb(255, 82, 134);\"><\/div><div class=\"sw\" id=\"hsP3\" style=\"background: rgb(255, 91, 20);\"><\/div>\n    <div class=\"sw\" id=\"hsP2\" style=\"background: rgb(9, 206, 147);\"><\/div><div class=\"sw\" id=\"hsP4\" style=\"background: rgb(7, 115, 162);\"><\/div>\n  <\/div>\n  <div id=\"harmLegend\" style=\"display:none\"><\/div>\n\n  <!-- Suggestions retired from the rail. The generator is still below: set\n       SHOW_SUGGESTIONS to true and this block comes back as it was. -->\n  <div id=\"harmSug\" style=\"display:none\"><\/div>\n  <div class=\"harm-sub\" id=\"harmSugLabel\" style=\"display:none\"><\/div>\n\n  <button class=\"harm-apply\" id=\"harmRevert\">revert to opened state<\/button>\n  <div id=\"harmStatus\"><\/div>\n  <div class=\"harm-note\">Live. Every move writes into the selected theme. Sets 1+3 chase the cursor, 2+4 flee it, so each pair stays analogous inside itself and the two pairs separate by value. Save writes the whole library to this browser. Export HTML in the editor bakes it into the file.<\/div>\n<\/div>\n  <\/div>\n  <div class=\"ctrlSection\" id=\"saveSection\">\n    <div class=\"ctrlHead\">Save / Export<\/div>\n    <div class=\"edbar-row\">\n        <button class=\"edbtn\" id=\"edExportJSON\">Export JSON<\/button>\n        <button class=\"edbtn\" id=\"edExportHTML\">Export HTML<\/button>\n        <button class=\"edbtn\" id=\"edExportPair\">Export 5x5 · 10x10<\/button>\n        <button class=\"edbtn\" id=\"edExportTri\">Export 3x3<\/button>\n        <button class=\"edbtn\" id=\"edExportSolid\">Export solid type<\/button>\n        <button class=\"edbtn\" id=\"edImport\">Import<\/button>\n        <input type=\"file\" id=\"edImportFile\" accept=\".json\" style=\"display:none\">\n      <\/div>\n  <\/div>\n<\/div>\n<div class=\"resizer\" id=\"rz2\"><\/div>\n<div id=\"typePane\">\n<div class=\"pane-title\">Visualizer<\/div>\n<div id=\"ctrlHint\">type anywhere<\/div>\n\n\n<!-- Always-visible overlay: text input + particle color dots -->\n<div id=\"overlay\">\n  <div id=\"inputWrap\">\n    <canvas id=\"pillCanvas\"><\/canvas>\n    <div id=\"textInput\" contenteditable=\"true\" spellcheck=\"false\" class=\"is-empty dark-bg\" style=\"background: transparent; border-color: transparent; color: rgb(255, 255, 255); caret-color: rgb(255, 255, 255); --ph: &quot;try&quot;;\"><\/div>\n  <\/div>\n<\/div>\n\n<!-- Actions, revealed once the field has content -->\n<div id=\"dock\">\n  <!-- The field and the palette are kept in the document but out of the dock:\n       typing lands anywhere on the canvas, and the palette is the library in\n       the rail. Two controls for one value is not a system. The nodes stay so\n ing, leading, particleCount, speed, speed2,\n        ptRadius, ptSoft, spacing, contW, contH, offX, offY, floatMode\n      };\n    } catch (e) {}\n    if (over && over.field) state.field = Object.assign({}, state.field, over.field);\n    const holder = document.getElementById('hg26-state');\n    holder.textContent = JSON.stringify(state);\n    return '<!DOCTYPE html>\\n' + document.documentElement.outerHTML;\n  }\n  window.__snapshotHTML = snapshotHTML;\n  document.getElementById('edExportHTML').addEventListener('click', () => {\n    if (!themesReady()) return;\n    dl(snapshotHTML(), 'text/html', 'hg26-studio-export.html');\n  });\n\n  /* ── Viewer builder ────────────────────────────────────────────────────────\n     The same shell the standalone viewer files use, filled in here so the\n     preview in the dock and the exported file are produced by one template.\n     The solidus in a closing tag has to be escaped or the embedded copy would\n     close the script tag that carries it. */\n  const VIEWER_SHELL='';\n  /* The embedded panel copy of this document, less what a panel can never\n     use: the viewer shell template, which only the studio's own export\n     buttons read, and the dead imported set. Stub declarations keep the\n     script parsing; nothing in panel mode calls the export path. */\n  function panelHTML(over) {\n    return snapshotHTML(over)\n      .replace(/\\/\\*__HG26_STRIP_SHELL_START__\\*\\/[\\s\\S]*?\\/\\*__HG26_STRIP_SHELL_END__\\*\\//, \"const VIEWER_SHELL='';\")\n      .replace(/\\/\\*__HG26_STRIP_SET_START__\\*\\/[\\s\\S]*?\\/\\*__HG26_STRIP_SET_END__\\*\\//, \"const IMPORTED_SET={};\");\n  }\n  /* The active theme's four particle colours at the moment of export. The file\n     opens wearing exactly what the studio was showing; the bar stays the plain\n     generated bar it always was and takes over on the first touch. */\n  function jsonInitPal() {\n    try {\n      const t = THEMES[(typeof currentTheme === 'number') ? currentTheme : 0
