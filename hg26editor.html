  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #000000;
    --fg:        #ffffff;
    --fg-mid:    #949494;
    --fg-dim:    #5f5f5f;
    --border:    #272727;
    --cell-off:  #242424;
    --cell-on:   #4b4b4b;
  }

  html, body {
    background: var(--bg);
    color: var(--fg);
    font-family: 'Aeonik Fono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    font-size: 12px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    line-height: 1;
    min-height: 100vh;
  }

  /* ── App shell: title bar over a sheet that fills what is left ── */
  .app {
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  .topbar {
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 12px;
    padding: 20px 28px 14px;
  }

  .topbar-row {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: baseline;
    width: 100%;
    gap: 24px;
  }
  .topbar-row .ctrl-hint { justify-self: center; }
  .topbar-row .export-btn { justify-self: end; }

  .wordmark {
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    line-height: 1;
    color: var(--fg);
  }

  /* ── Sheet: takes the remaining height, scaled so all glyphs fit ── */
  .zone-sheet {
    flex: 1 1 auto;
    min-height: 0;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    padding: 0 28px 22px;
  }
  #rowWrap {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
  }

  /* ── Controls ── */
  .controls {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 9px;
  }

  .ctrl-group {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .ctrl-label {
    font-size: 11px;
    color: var(--fg-dim);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    white-space: nowrap;
    width: 62px;
  }

  input[type=range] {
    -webkit-appearance: none;
    appearance: none;
    width: 88px;
    height: 1px;
    background: var(--border);
    outline: none;
    cursor: pointer;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--fg);
    cursor: pointer;
  }
  input[type=range]::-moz-range-thumb {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--fg);
    border: none;
    cursor: pointer;
  }

  .ctrl-val {
    font-size: 11px;
    color: var(--fg-mid);
    width: 36px;
    font-variant-numeric: tabular-nums;
  }

  .ctrl-btn {
    font-size: 11px;
    letter-spacing: 0.06em;
    color: var(--fg-mid);
    background: none;
    border: none;
    cursor: pointer;
    padding: 0;
    text-transform: uppercase;
  }
  .ctrl-btn:hover { color: var(--fg); }

  .ctrl-hint {
    font-size: 12px;
    line-height: 1;
    color: var(--fg-dim);
    letter-spacing: 0.04em;
    white-space: nowrap;
  }
  .ctrl-hint span {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--fg);
    vertical-align: middle;
    margin-right: 5px;
    margin-bottom: 1px;
  }

  /* ── Glyph strip ── */
  .glyph-strip {
    flex: 1 1 auto;
    display: grid;
    justify-content: space-between;
    align-content: end;
    gap: 0;
  }

  /* ── Per-glyph block ── */
  .glyph-block {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 4px;
    padding: 6px 7px;
    cursor: default;
  }

  /* keyPad lines the key up with the left edge of the first circle */
  .glyph-key {
    font-size: 11px;
    color: var(--fg-mid);
    letter-spacing: 0.08em;
    line-height: 1;
    font-weight: 400;
    padding-left: var(--keyPad, 11px);
    transition: color 0.1s;
    user-select: none;
  }
  .glyph-block.active .glyph-key { color: var(--fg); font-weight: 500; }

  .export-btn {
    font-size: 12px;
    line-height: 1;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--fg);
    background: var(--bg);
    border: 0.5px solid var(--border);
    border-radius: 2px;
    padding: 7px 11px;
    cursor: pointer;
  }
  .export-btn:hover { border-color: var(--fg); }

  canvas.ed { display: block; cursor: pointer; }
  canvas.pv { display: block; }

  @media (max-width: 900px) {
    .topbar { padding: 16px 18px 12px; }
    .topbar-row { flex-direction: column; align-items: flex-start; gap: 8px; }
    .zone-sheet { padding: 0 18px 18px; }
  }
</style>
</head>
<body>

<div class="app">

  <header class="topbar">
    <div class="topbar-row">
      <span class="wordmark">HG26 — Glyph editor</span>
      <span class="ctrl-hint"><span></span>Click midpoint to connect cells</span>
      <button class="export-btn" onclick="exportData()">Export JSON</button>
    </div>

    <div class="controls" id="controlsBar" style="display:none;">
      <div class="ctrl-group">
        <span class="ctrl-label">Diamond</span>
        <input type="range" id="sizeSlider" min="10" max="100" value="53"
          oninput="onSizeChange(this.value)">
        <span class="ctrl-val" id="sizeVal">53%</span>
      </div>
      <div class="ctrl-group">
        <span class="ctrl-label">Rounding</span>
        <input type="range" id="roundSlider" min="0" max="20" value="0"
          oninput="onRoundChange(this.value)">
        <span class="ctrl-val" id="roundVal">0px</span>
      </div>
      <div class="ctrl-group">
        <button class="ctrl-btn" onclick="clearCurrent()">Clear</button>
        <button class="ctrl-btn" onclick="clearAll()">Clear all</button>
        <button class="ctrl-btn" onclick="fillCurrent()">Fill</button>
        <button class="ctrl-btn" onclick="suggest()">Suggest</button>
        <button class="ctrl-btn" onclick="document.getElementById('importFile').click()">Import</button>
        <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
      </div>
    </div>
  </header>

  <section class="zone-sheet" id="sheet">
    <div id="rowWrap"></div>
  </section>

</div>

<script>
// ── Data ─────────────────────────────────────────────────────────────────────
const LETTERS = 'abcdefghijklmnopqrstuvwxyz'.split('');
const DIGITS  = '0123456789'.split('');
const PUNCT   = ['!', '-', "'", ',', '.', '?', '/'];
const ALL_GLYPHS = [...LETTERS, ...DIGITS, ...PUNCT];

// Safe DOM ids (punctuation is not id-friendly)
const GLYPH_ID = {};
ALL_GLYPHS.forEach((g, i) => { GLYPH_ID[g] = 'block-' + i; });

const PRESETS = {
  "a":  {"c":[1,2,3,4,5,6,7,8],"e":[[3,4],[2,5],[5,8],[1,2],[6,7],[3,6],[7,8]]},
  "b":  {"c":[0,3,4,5,6,7,8],"e":[[6,7],[7,8],[0,3],[3,6],[4,5],[5,8]]},
  "c":  {"c":[0,1,2,3,6,7,8],"e":[[7,8],[3,6],[6,7],[1,2],[0,3],[0,1]]},
  "d":  {"c":[2,3,4,5,6,7,8],"e":[[6,7],[3,6],[3,4],[7,8],[5,8],[2,5]]},
  "e":  {"c":[0,1,2,3,4,5,6,7],"e":[[0,1],[1,2],[6,7],[0,3],[3,6],[2,5],[4,5]]},
  "f":  {"c":[0,1,2,3,4,6],"e":[[0,1],[3,4],[0,3],[3,6],[1,2]]},
  "g":  {"c":[0,1,3,4,5,6,7,8],"e":[[0,1],[7,8],[0,3],[4,5],[6,7],[3,6],[5,8]]},
  "h":  {"c":[0,3,4,5,6,8],"e":[[0,3],[3,6],[3,4],[4,5],[5,8]]},
  "i":  {"c":[0,1,2,4,6,7,8],"e":[[6,7],[7,8],[0,1],[1,2],[1,4],[4,7]]},
  "j":  {"c":[1,2,5,6,7,8],"e":[[6,7],[2,5],[7,8],[5,8],[1,2]]},
  "k":  {"c":[0,1,3,4,5,6,8],"e":[[0,3],[3,6],[4,5],[1,4],[3,4],[5,8]]},
  "l":  {"c":[0,3,6,7,8],"e":[[0,3],[3,6],[6,7],[7,8]]},
  "m":  {"c":[0,1,2,3,4,5,6,8],"e":[[0,3],[2,5],[3,6],[5,8],[1,4],[0,1],[1,2]]},
  "n":  {"c":[0,1,2,3,4,5,6,7,8],"e":[[0,3],[2,5],[3,6],[5,8],[0,1],[1,4],[4,7],[7,8]]},
  "o":  {"c":[0,1,2,3,5,6,7,8],"e":[[0,1],[1,2],[6,7],[7,8],[0,3],[2,5],[3,6],[5,8]]},
  "p":  {"c":[0,1,2,3,4,5,6],"e":[[0,1],[1,2],[4,5],[0,3],[2,5],[3,6]]},
  "q":  {"c":[0,1,2,3,4,5,8],"e":[[0,1],[1,2],[3,4],[0,3],[2,5],[5,8]]},
  "r":  {"c":[0,1,3,4,5,6,8],"e":[[1,4],[4,5],[0,3],[3,6],[0,1],[5,8]]},
  "s":  {"c":[0,1,3,4,5,7,8],"e":[[3,4],[4,5],[7,8],[0,3],[5,8],[0,1]]},
  "t":  {"c":[0,1,2,4,7],"e":[[1,2],[1,4],[4,7],[0,1]]},
  "u":  {"c":[0,2,3,5,6,7,8],"e":[[6,7],[7,8],[0,3],[2,5],[3,6],[5,8]]},
  "v":  {"c":[0,2,3,5,7,8],"e":[[2,5],[3,7],[5,7],[0,3],[7,8],[5,8]]},
  "w":  {"c":[0,2,3,4,5,6,7,8],"e":[[2,5],[5,8],[0,3],[4,7],[7,8],[3,6],[6,7]]},
  "x":  {"c":[0,2,4,6,8],"e":[]},
  "y":  {"c":[0,2,3,4,5,7],"e":[[0,4],[2,4],[4,7],[3,4],[4,5],[0,3],[2,5]]},
  "z":  {"c":[0,1,2,4,6,7,8],"e":[[0,1],[7,8]]},
  "0":  {"c":[0,1,2,3,4,5,6,7,8],"e":[[0,1],[1,2],[0,3],[3,6],[6,7],[7,8],[5,8],[2,5]]},
  "1":  {"c":[0,1,4,6,7,8],"e":[[0,1],[1,4],[4,7],[6,7],[7,8]]},
  "2":  {"c":[1,2,3,4,5,6,7,8],"e":[[1,2],[2,5],[4,5],[3,4],[3,6],[6,7],[7,8]]},
  "3":  {"c":[0,1,2,4,5,6,7,8],"e":[[0,1],[1,2],[2,5],[4,5],[6,7],[7,8],[5,8]]},
  "4":  {"c":[0,2,3,4,5,8],"e":[[0,3],[3,4],[4,5],[2,5],[5,8]]},
  "5":  {"c":[0,1,3,4,5,6,7,8],"e":[[0,1],[0,3],[3,4],[4,5],[7,8],[5,8],[6,7]]},
  "6":  {"c":[0,1,2,3,4,5,6,7,8],"e":[[3,6],[6,7],[7,8],[5,8],[4,5],[1,2],[0,3],[0,1]]},
  "7":  {"c":[0,1,2,4,5,7],"e":[[1,2],[0,1],[2,5],[4,5],[4,7]]},
  "8":  {"c":[0,1,2,3,4,5,6,7,8],"e":[[0,1],[1,2],[2,5],[4,5],[3,4],[0,3],[3,6],[6,7],[7,8],[5,8]]},
  "9":  {"c":[0,1,2,3,4,5,6,7,8],"e":[[0,1],[1,2],[0,3],[3,4],[4,5],[2,5],[5,8],[7,8],[6,7]]},
  "!":  {"c":[1,4,7],"e":[[1,4]]},
  "-":  {"c":[3,4,5],"e":[[3,4],[4,5]]},
  "'":  {"c":[1,4],"e":[[1,4]]},
  ",":  {"c":[4,7],"e":[[4,7]]},
  ".":  {"c":[7],"e":[]},
  "?":  {"c":[0,1,2,4,5,7],"e":[[0,1],[1,2],[2,5],[4,5]]},
  "/":  {"c":[2,4,6],"e":[]}
};

// Deep copy so the presets stay intact and edits are non destructive
const GLYPH_DATA = {};
ALL_GLYPHS.forEach(g => {
  const src = PRESETS[g];
  GLYPH_DATA[g] = { c: [...(src?.c || [])], e: (src?.e || []).map(p => [...p]) };
});

// ── State ────────────────────────────────────────────────────────────────────
let currentLetter = 'a';
let diamondPct    = 53;
let seamRound     = 0;

// ── Geometry ─────────────────────────────────────────────────────────────────
// Both editor and preview use the same canvas size
const CELL    = 28;           // center-to-center spacing
const H       = CELL / 2;    // diamond tip radius in editor
const PAD     = 9;
const ED_SIZE = PAD * 2 + CELL * 2 + H * 2;   // ~90px

// Preview uses identical physical canvas size; scale factor maps coords
const P_CELL  = CELL;
const P_PAD   = PAD;
const P_SIZE  = ED_SIZE;

function cellCenter(idx) {
  const r = Math.floor(idx / 3), c = idx % 3;
  return [PAD + c * CELL + H, PAD + r * CELL + H];
}

const ALL_EDGES = [
  [0,1],[1,2],[3,4],[4,5],[6,7],[7,8],   // horizontal
  [0,3],[1,4],[2,5],[3,6],[4,7],[5,8]    // vertical
];

function hasEdge(g, a, b) {
  return GLYPH_DATA[g].e.some(([x,y]) => (x===a&&y===b)||(x===b&&y===a));
}
function toggleEdge(g, a, b) {
  const idx = GLYPH_DATA[g].e.findIndex(([x,y]) => (x===a&&y===b)||(x===b&&y===a));
  if (idx >= 0) GLYPH_DATA[g].e.splice(idx, 1);
  else GLYPH_DATA[g].e.push([a, b]);
}

// ── Hit tests ────────────────────────────────────────────────────────────────
function hitCell(px, py) {
  for (let i = 0; i < 9; i++) {
    const [cx, cy] = cellCenter(i);
    if (Math.hypot(px - cx, py - cy) <= H * 0.92) return i;
  }
  return -1;
}

function hitEdge(px, py) {
  const cellSet = new Set(GLYPH_DATA[currentLetter].c);
  for (const [a, b] of ALL_EDGES) {
    if (!cellSet.has(a) || !cellSet.has(b)) continue;
    const [ax, ay] = cellCenter(a);
    const [bx, by] = cellCenter(b);
    const mx = (ax + bx) / 2, my = (ay + by) / 2;
    if (Math.hypot(px - mx, py - my) < H * 0.42) return [a, b];
  }
  return null;
}

// ── Drawing ──────────────────────────────────────────────────────────────────
// Canvas palette, dark theme
const C = {
  bg:      '#000000',
  ink:     '#ffffff',
  cellOn:  '#4b4b4b',
  cellOff: '#222222'
};

function circle(ctx, cx, cy, r) {
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.closePath();
}

function drawEditor(ctx, glyph) {
  ctx.clearRect(0, 0, ED_SIZE, ED_SIZE);
  const data = GLYPH_DATA[glyph];
  const cellSet = new Set(data.c);

  const off = C.cellOff;
  const LW  = H * 0.35;

  // The full lattice is always present. Every one of the twelve connectors is
  // drawn solid, in the off tone when unmade and the on tone when made, so an
  // available connection reads as an invitation rather than as absence.
  // Lines go down first, the circles then cover their ends.
  ctx.lineWidth = LW;
  ctx.lineCap = 'butt';
  for (const [a, b] of ALL_EDGES) {
    const made = cellSet.has(a) && cellSet.has(b) && hasEdge(glyph, a, b);
    const [ax, ay] = cellCenter(a);
    const [bx, by] = cellCenter(b);
    ctx.strokeStyle = made ? C.cellOn : off;
    ctx.beginPath();
    ctx.moveTo(ax, ay);
    ctx.lineTo(bx, by);
    ctx.stroke();
  }

  // Cells sit on top, same two tones, so connector and circle read as one mass
  for (let i = 0; i < 9; i++) {
    const [cx, cy] = cellCenter(i);
    circle(ctx, cx, cy, H * 0.82);
    ctx.fillStyle = cellSet.has(i) ? C.cellOn : off;
    ctx.fill();
  }
}

// size    optional canvas side, defaults to the small preview
// flush   solve cell and pad so the ink exactly fills the canvas edge to edge
function drawPreview(ctx, glyph, size, flush) {
  const S = size || P_SIZE;
  let cell, pad;

  if (flush) {
    // PH = cell * m / 2, and we want pad + cell/2 - PH === 0
    const m = (diamondPct / 100) * 1.85;
    cell = S / (m + 2);
    pad  = cell * (m - 1) / 2;
  } else {
    const k = S / ED_SIZE;
    cell = P_CELL * k;
    pad  = P_PAD  * k;
  }

  const k = cell / P_CELL;            // scale relative to the reference cell

  ctx.clearRect(0, 0, S, S);
  const data = GLYPH_DATA[glyph];
  if (!data.c.length) return;

  const PH = (cell / 2) * (diamondPct / 100) * 1.85;
  const ir_base = PH / Math.SQRT2;
  const ir = Math.max(0, ir_base - seamRound * k);

  const sh = {};
  data.c.forEach(i => sh[i] = { N: false, E: false, S: false, W: false });
  data.e.forEach(([a, b]) => {
    if (!sh[a] || !sh[b]) return; // skip edges referencing cells not in c[]
    const ra = Math.floor(a/3), ca = a%3, rb = Math.floor(b/3), cb = b%3;
    if (rb===ra && cb===ca+1)      { sh[a].E=true; sh[b].W=true; }
    else if (rb===ra && cb===ca-1) { sh[a].W=true; sh[b].E=true; }
    else if (rb===ra+1 && cb===ca) { sh[a].S=true; sh[b].N=true; }
    else if (rb===ra-1 && cb===ca) { sh[a].N=true; sh[b].S=true; }
  });

  ctx.fillStyle = C.ink;

  data.c.forEach(idx => {
    const row = Math.floor(idx / 3), col = idx % 3;
    const cx = pad + col * cell + cell / 2;
    const cy = pad + row * cell + cell / 2;
    const s = sh[idx];

    const corners = [
      { sharp: s.N, tip: [cx,    cy-PH], a1: -3*Math.PI/4, a2: -Math.PI/4 },
      { sharp: s.E, tip: [cx+PH, cy   ], a1: -Math.PI/4,   a2:  Math.PI/4 },
      { sharp: s.S, tip: [cx,    cy+PH], a1:  Math.PI/4,   a2:  3*Math.PI/4 },
      { sharp: s.W, tip: [cx-PH, cy   ], a1:  3*Math.PI/4, a2:  5*Math.PI/4 },
    ];

    ctx.beginPath();
    let started = false;
    for (const { sharp, tip, a1, a2 } of corners) {
      if (sharp) {
        if (!started) { ctx.moveTo(tip[0], tip[1]); started = true; }
        else ctx.lineTo(tip[0], tip[1]);
      } else {
        const r = Math.max(k, ir);
        const sx = cx + r * Math.cos(a1), sy = cy + r * Math.sin(a1);
        if (!started) { ctx.moveTo(sx, sy); started = true; }
        else ctx.lineTo(sx, sy);
        ctx.arc(cx, cy, r, a1, a2, false);
      }
    }
    ctx.closePath();
    ctx.fill();
  });
}

// ── Fit ──────────────────────────────────────────────────────────────────────
// Solve for the largest canvas size that still lets all glyphs sit on one page,
// then back off a little so the sheet keeps a margin off the edges.
const BLOCK_PX = 7;    // block padding, left and right
const BLOCK_PY = 6;    // block padding, top and bottom
const BLOCK_GAP = 4;   // gap between key, editor and preview
const KEY_H = 13;      // key label line box
const FILL = 0.96;     // the deliberate back off

let cellPx = ED_SIZE;  // current rendered canvas side, in CSS pixels

function fitSheet() {
  const zone = document.getElementById('sheet');
  const wrap = document.getElementById('rowWrap');
  if (!zone || !wrap) return;

  const cs = getComputedStyle(zone);
  const availW = zone.clientWidth  - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const availH = zone.clientHeight - parseFloat(cs.paddingTop)  - parseFloat(cs.paddingBottom);
  if (availW <= 0 || availH <= 0) return;

  const n = ALL_GLYPHS.length;
  let bestPx = 0, bestCols = 1;
  for (let c = 1; c <= n; c++) {
    const r = Math.ceil(n / c);
    const byWidth  = availW / c - BLOCK_PX * 2;
    const byHeight = (availH / r - KEY_H - BLOCK_GAP * 2 - BLOCK_PY * 2) / 2;
    const px = Math.floor(Math.min(byWidth, byHeight) * FILL);
    // >= not > : when several column counts yield the same glyph size, take the
    // widest one, so the leftover space spreads as thin gaps rather than as a
    // few very wide ones.
    if (px >= bestPx) { bestPx = px; bestCols = c; }
  }

  cellPx = Math.max(24, bestPx);
  const strip = wrap.querySelector('.glyph-strip');
  if (strip) {
    strip.style.gridTemplateColumns =
      'repeat(' + bestCols + ', ' + (cellPx + BLOCK_PX * 2) + 'px)';
  }

  // Where the first circle's left edge actually lands, in page pixels. The key
  // label, the title and the export button all hang off this one number so
  // they stay aligned with the glyphs at any scale.
  const inkInset = (PAD + H - H * 0.82) * (cellPx / ED_SIZE);
  const edge = parseFloat(cs.paddingLeft) + BLOCK_PX + inkInset;
  document.documentElement.style.setProperty('--keyPad', inkInset + 'px');
  const bar = document.querySelector('.topbar');
  if (bar) {
    bar.style.paddingLeft  = edge + 'px';
    bar.style.paddingRight = edge + 'px';
  }
}

// Back the canvas at device resolution and scale the context, so all drawing
// code keeps working in the original ED_SIZE coordinate space.
function sizeCanvas(cv, px) {
  const dpr = window.devicePixelRatio || 1;
  cv.style.width  = px + 'px';
  cv.style.height = px + 'px';
  cv.width  = Math.round(px * dpr);
  cv.height = Math.round(px * dpr);
  const ctx = cv.getContext('2d');
  const k = (px * dpr) / ED_SIZE;
  ctx.setTransform(k, 0, 0, k, 0, 0);
  return ctx;
}

// ── UI construction ───────────────────────────────────────────────────────────
function makeStrip(glyphs) {
  const strip = document.createElement('div');
  strip.className = 'glyph-strip';

  glyphs.forEach(g => {
    const block = document.createElement('div');
    block.className = 'glyph-block' + (g === currentLetter ? ' active' : '');
    block.id = GLYPH_ID[g];

    const key = document.createElement('div');
    key.className = 'glyph-key';
    key.textContent = g;

    const edCanvas = document.createElement('canvas');
    edCanvas.width  = ED_SIZE;
    edCanvas.height = ED_SIZE;
    edCanvas.className = 'ed';

    edCanvas.addEventListener('click', evt => {
      currentLetter = g;
      const rect = edCanvas.getBoundingClientRect();
      const scaleX = ED_SIZE / rect.width;
      const scaleY = ED_SIZE / rect.height;
      const px = (evt.clientX - rect.left) * scaleX;
      const py = (evt.clientY - rect.top)  * scaleY;

      const ep = hitEdge(px, py);
      if (ep) {
        const [a, b] = ep;
        const cellSet = new Set(GLYPH_DATA[g].c);
        if (cellSet.has(a) && cellSet.has(b)) toggleEdge(g, a, b);
      } else {
        const ci = hitCell(px, py);
        if (ci >= 0) {
          const set = new Set(GLYPH_DATA[g].c);
          if (set.has(ci)) {
            set.delete(ci);
            GLYPH_DATA[g].e = GLYPH_DATA[g].e.filter(([a, b]) => a !== ci && b !== ci);
          } else {
            set.add(ci);
          }
          GLYPH_DATA[g].c = [...set].sort((a, b) => a - b);
        }
      }
      renderAll();
    });

    const pvCanvas = document.createElement('canvas');
    pvCanvas.width  = P_SIZE;
    pvCanvas.height = P_SIZE;
    pvCanvas.className = 'pv';

    block.appendChild(key);
    block.appendChild(edCanvas);
    block.appendChild(pvCanvas);
    strip.appendChild(block);
  });

  return strip;
}

function buildUI() {
  const wrap = document.getElementById('rowWrap');
  wrap.innerHTML = '';
  wrap.appendChild(makeStrip(ALL_GLYPHS));
}

function renderAll() {
  fitSheet();
  ALL_GLYPHS.forEach(g => {
    const block = document.getElementById(GLYPH_ID[g]);
    if (block) block.className = 'glyph-block' + (g === currentLetter ? ' active' : '');

    const ed = block?.querySelector('canvas.ed');
    if (ed) drawEditor(sizeCanvas(ed, cellPx), g);

    const pv = block?.querySelector('canvas.pv');
    if (pv) drawPreview(sizeCanvas(pv, cellPx), g);
  });
}

// ── Controls ─────────────────────────────────────────────────────────────────
// C toggles the controls bar; hidden by default.
document.addEventListener('keydown', function(e) {
  if (e.key === 'c' || e.key === 'C') {
    const bar = document.getElementById('controlsBar');
    bar.style.display = (bar.style.display === 'none') ? '' : 'none';
  }
});
function onSizeChange(v) {
  diamondPct = parseInt(v);
  document.getElementById('sizeVal').textContent = v + '%';
  renderAll();
}
function onRoundChange(v) {
  seamRound = parseInt(v);
  document.getElementById('roundVal').textContent = v + 'px';
  renderAll();
}
function clearCurrent() {
  GLYPH_DATA[currentLetter] = { c: [], e: [] };
  renderAll();
}
function fillCurrent() {
  GLYPH_DATA[currentLetter].c = [0,1,2,3,4,5,6,7,8];
  renderAll();
}

// Wipes every glyph. Guarded, since there is no undo.
function clearAll() {
  const drawn = ALL_GLYPHS.filter(g => GLYPH_DATA[g].c.length).length;
  if (drawn && !confirm('Clear all ' + drawn + ' drawn glyphs. This cannot be undone.')) return;
  ALL_GLYPHS.forEach(g => { GLYPH_DATA[g] = { c: [], e: [] }; });
  renderAll();
}

// Proposes a starting point for anything still blank. Non destructive on
// purpose: glyphs you have already drawn are left exactly as they are, so this
// is safe to press at any time, not just on an empty slate.
function suggest() {
  ALL_GLYPHS.forEach(g => {
    if (GLYPH_DATA[g].c.length) return;
    const src = PRESETS[g];
    if (!src) return;
    GLYPH_DATA[g] = { c: [...src.c], e: src.e.map(pair => [...pair]) };
  });
  renderAll();
}
// A glyph that only occupies part of the grid should not export as three
// columns wide. x is the leftmost column it touches, w is how many it spans.
function glyphMetrics(d) {
  if (!d.c.length) return { x: 0, w: 0 };
  const cols = d.c.map(i => i % 3);
  const x = Math.min(...cols);
  return { x, w: Math.max(...cols) - x + 1 };
}

function exportData() {
  const out = {};
  ALL_GLYPHS.forEach(g => {
    const d = GLYPH_DATA[g];
    const m = glyphMetrics(d);
    out[g] = { c: d.c, e: d.e, x: m.x, w: m.w };
  });
  const blob = new Blob([JSON.stringify(out, null, 2)], { type: 'application/json' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url; a.download = 'hg26-glyphs.json'; a.click();
}
function importData(evt) {
  const file = evt.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      ALL_GLYPHS.forEach(g => { if (data[g]) GLYPH_DATA[g] = data[g]; });
      renderAll();
    } catch { alert('Could not parse JSON.'); }
  };
  reader.readAsText(file);
  evt.target.value = '';
}

// ── Init ─────────────────────────────────────────────────────────────────────
window.addEventListener('resize', renderAll);
buildUI();
renderAll();
</script>
</body>
</html>
